<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Midas · Performance</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/static/theme.css" />
<style>
  /* Page layout + widgets unique to the Performance page. Shared tokens and
     components live in /static/theme.css; every rule here consumes those tokens
     (no colour literals). The .kpi sizing overrides that used to sit here have
     been folded into theme.css, so this page no longer redefines a shared
     component. */
  /* The shell owns page layout (see .app-shell in theme.css); body just
     provides the backdrop the inset content panel sits on. Embed mode strips
     both classes at runtime and falls back to plain flow — see `embedded`. */
  body { margin:0; background:var(--surface-faint); }

  button, .btn { padding:.5rem .9rem; }
  .pill { margin:1px; }

  .small { font-size:.8rem; }
  .diff-row { background:var(--surface-faint); padding:.75rem; }
  pre { white-space:pre-wrap; background:var(--surface-faint); padding:.6rem; border-radius:6px; margin:.25rem 0; }
  details > summary { cursor:pointer; }
  input, select { font:inherit; padding:.4rem .55rem; border-radius:6px; border:1px solid var(--border-strong); background:transparent; color:inherit; box-sizing:border-box; }
  .filter-bar { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin:.25rem 0 .9rem; }

  /* The edit log. Columns declared once, as on the other tables. Deltas were
     removed with the aggregate cards — YouTube Studio owns those numbers; what
     remains is what changed, and whether it went the wrong way. */
  #rows { padding:0; border:0; }
  #rows .dt { --dt-cols: 88px minmax(260px,2fr) 7rem 8rem 4.5rem 9.5rem; --dt-min: 880px; }
  #rows .dt-row { align-items:start; }
  #rows .regression-row { background:var(--color-err-faint); }
  .perf-thumb { width:88px; border-radius:6px; display:block; }
  .perf-title { font-weight:600; }
  .perf-was { font-size:.76rem; opacity:.6; margin-top:.15rem; }
  .perf-sub { font-size:.74rem; opacity:.5; margin-top:.15rem; }
  .perf-actions { display:flex; gap:.35rem; flex-wrap:wrap; }
  .perf-actions button { padding:.3rem .6rem; font-size:.8rem; }
</style>
</head>
<body>
  <div class="app-shell" id="app-shell">
  <main class="app-main">
  <header class="page-head">
    <h1 class="page-title">Applied edits</h1>
  </header>
  <p class="page-lede" id="perf-lede">—</p>
  <p class="page-meta" id="perf-meta"></p>

  <div class="chip-bar" id="perf-chips" role="group" aria-label="Filter by measured verdict"></div>

  <div class="filter-bar">
    <label>Status:
      <select id="f-status">
        <option value="applied">Applied (default)</option>
        <option value="all">All statuses</option>
        <option value="pending">Pending</option>
        <option value="quarantined">Bad output</option>
        <option value="failed">Failed</option>
        <option value="rejected">Rejected</option>
        <option value="reverted">Reverted</option>
        <option value="applied,quarantined,failed">Applied + problems</option>
      </select>
    </label>
    <label>Min days since apply:
      <input id="min-days" type="number" value="0" min="0" style="width:5rem"/>
    </label>
    <input id="search" type="search" placeholder="Search title…" style="min-width:200px"/>
    <button id="sync-btn" style="margin-left:auto">Sync stats now</button>
    <a class="btn btn-link" id="csv-btn" href="#" download>Export CSV</a>
    <span id="sync-status" class="muted"></span>
  </div>

  <div id="rows" class="card" aria-live="polite">Loading…</div>

  </main>
  </div>

<script src="/static/swr.js"></script>
<script src="/static/status.js"></script>
<script src="/static/sidebar.js"></script>
<script>
const params = new URLSearchParams(location.search);
const channelId = params.get('channel_id');
// This page is also the channel page's Performance tab, embedded in an iframe
// with ?embed=1. There the parent already supplies the rail and the heading, so
// embed mode drops both shell classes and falls back to plain full-width flow —
// rendering a sidebar inside the iframe would nest one rail inside another.
const embedded = params.get('embed') === '1';
if (embedded) {
  // This script runs at the end of <body>, so the shell and h1 are parsed.
  document.querySelector('.page-head')?.remove();   // the whole header, not just the h1
  document.getElementById('app-shell')?.classList.remove('app-shell');
  document.querySelector('.app-main')?.classList.remove('app-main');
} else {
  mountSidebar();
}

// Standalone, this is a channel-scoped page, so it carries the channel rail
// with Performance current. The other sections navigate back to the channel
// page's matching panel.
function mountSidebar() {
  const sec = (id) => channelId
    ? `/channel?id=${encodeURIComponent(channelId)}#${id}`
    : '/';
  Sidebar.mount({
    items: [
      { id: 'overview',    label: 'Overview',    icon: 'home',        href: sec('overview') },
      { id: 'videos',      label: 'Videos',      icon: 'videos',      href: sec('videos') },
      { id: 'performance', label: 'Performance', icon: 'performance' },
      { id: 'autopilot',   label: 'Autopilot',   icon: 'autopilot',   href: sec('autopilot') },
      { id: 'playlists',   label: 'Playlists',   icon: 'playlists',   href: sec('playlists') },
      { id: 'settings',    label: 'Settings',    icon: 'settings',    href: sec('settings') },
    ],
    activeId: 'performance',
    // Switching channel from here keeps you on Performance.
    channelHref: (id) => `/performance?channel_id=${encodeURIComponent(id)}`,
  });
  SWR.swr('/auth/channels', (chs) => Sidebar.setChannels(chs, channelId));
}

if (!channelId) { showMissingId('channel_id'); throw new Error('no id'); }

// Render the error inside the content panel so the rail survives.
function showMissingId(what) {
  const main = document.querySelector('.app-main') || document.body;
  main.innerHTML = `<div class="card"><p style="color:var(--color-err);margin:0">`
    + `Missing ${what} — open a channel from the <a href="/">dashboard</a>.</p></div>`;
}

const $ = (id) => document.getElementById(id);
function toast(msg, kind='ok', timeout=3500) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = 0; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300); }, timeout);
}
// In-page confirm — styled replacement for native confirm(); resolves true/false.
function confirmDialog(message, okLabel = 'Confirm') {
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true">
      <div class="modal-msg"></div>
      <div class="modal-actions">
        <button class="btn modal-cancel">Cancel</button>
        <button class="btn modal-ok"></button>
      </div></div>`;
    back.querySelector('.modal-msg').textContent = message;
    back.querySelector('.modal-ok').textContent = okLabel;
    const close = (val) => { back.remove(); document.removeEventListener('keydown', onKey); resolve(val); };
    back.querySelector('.modal-cancel').onclick = () => close(false);
    back.querySelector('.modal-ok').onclick = () => close(true);
    back.onclick = (e) => { if (e.target === back) close(false); };
    function onKey(e) { if (e.key === 'Escape') close(false); else if (e.key === 'Enter') close(true); }
    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
    back.querySelector('.modal-ok').focus();
  });
}
const escapeHtml = (s) => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => (n ?? 0).toLocaleString();
const signed = (n) => (n > 0 ? '+' : '') + fmt(n ?? 0);
const cls = (n) => n > 0 ? 'pos' : n < 0 ? 'neg' : 'neutral';
const pctTxt = (p) => p == null ? '—' : (p > 0 ? '+' : '') + p.toFixed(1) + '%';

// Status pills come from the shared canonical map — see /static/status.js
// (global statusPill / AUDIT_STATUS / SHORTS_STATUS).

let rowsData = [];
let summary = null;
let sortKey = 'days_since_apply';
let sortDir = 'desc';

function statusParam() { return $('f-status').value || 'applied'; }
function csvHref() { return `/channels/${channelId}/performance.csv?status=${encodeURIComponent(statusParam())}`; }

function renderAll() {
  renderLede();
  renderVerdictChips();
  render();
}

// Stale-while-revalidate, keyed by status (the URL carries ?status=…), so
// flipping the filter to a value seen before paints instantly. The two
// endpoints are cached independently and renderAll() tolerates either arriving
// first — every render* fn already guards on empty rowsData/summary.
function load() {
  $('csv-btn').href = csvHref();
  const s = statusParam();
  const perfUrl = `/channels/${channelId}/performance?status=${encodeURIComponent(s)}`;
  const summaryUrl = `/channels/${channelId}/performance/summary?status=${encodeURIComponent(s)}`;
  if (SWR.get(perfUrl) === undefined) $('rows').innerHTML = 'Loading…';
  SWR.swr(perfUrl, (d) => { rowsData = d; renderAll(); });
  SWR.swr(summaryUrl, (d) => { summary = d; renderAll(); });
}







// ── Verdict ────────────────────────────────────────────────────────────
// What survived the gutting: this page is the record of what SEO was applied,
// and which of those edits went the wrong way. View/like/comment deltas were
// dropped — YouTube Studio already reports those, and duplicating them here
// invited reading them as Midas' own findings.
const MEASURED = ['win', 'neutral', 'regression'];
const VERDICT_META = {
  regression: { label: 'Regressed', role: 'err' },
  win:        { label: 'Won',       role: 'ok' },
  neutral:    { label: 'Neutral',   role: 'neutral' },
  unmeasured: { label: 'No verdict', role: 'info' },
};
let verdict = '';   // '' = all

const verdictOf = (r) => MEASURED.includes(r.measurement_status) ? r.measurement_status : 'unmeasured';

function renderLede() {
  const s = summary || {};
  const applied = s.applied_count || 0;
  const reg = s.regression_count || 0;
  const withVerdict = s.ctr_measured_count ?? 0;

  $('perf-lede').innerHTML = reg
    ? `${fmt(reg)} regression${reg === 1 ? '' : 's'} <span class="u">need${reg === 1 ? 's' : ''} review</span>`
    : 'No regressions <span class="u">among measured edits</span>';

  // State the coverage plainly. Most applied edits never get a CTR verdict, and
  // the page used to imply otherwise by citing the larger measured_count.
  $('perf-meta').innerHTML = applied
    ? `${fmt(applied)} applied edits · <b>${fmt(withVerdict)}</b> with a CTR verdict`
      + (applied ? ` <span class="muted">(${Math.round(100 * withVerdict / applied)}%)</span>` : '')
    : '';
}

function renderVerdictChips() {
  const counts = {};
  rowsData.forEach(r => { const v = verdictOf(r); counts[v] = (counts[v] || 0) + 1; });

  const chip = (key, label, role, count, active) => `
    <button type="button" class="chip" data-verdict="${key}" aria-pressed="${active}">
      ${role ? `<span class="chip-dot dot--${role}"></span>` : ''}
      ${escapeHtml(label)}<span class="chip-count">${fmt(count)}</span>
    </button>`;

  let html = chip('', 'All', '', rowsData.length, verdict === '');
  Object.entries(VERDICT_META).forEach(([key, m]) => {
    const n = counts[key] || 0;
    if (!n && verdict !== key) return;
    html += chip(key, m.label, m.role, n, verdict === key);
  });
  $('perf-chips').innerHTML = html;
  $('perf-chips').querySelectorAll('.chip').forEach(b => {
    b.onclick = () => { verdict = b.dataset.verdict; renderVerdictChips(); render(); };
  });
}

function passesFilters(r) {
  const minDays = parseFloat($('min-days').value || '0');
  if ((r.days_since_apply ?? 0) < minDays) return false;
  const q = ($('search').value || '').toLowerCase().trim();
  if (q) {
    const hay = ((r.title_now || '') + ' ' + (r.title_before || '') + ' ' + r.video_id).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (verdict && verdictOf(r) !== verdict) return false;
  return true;
}

function sortRows(list) {
  const k = sortKey, dir = sortDir === 'asc' ? 1 : -1;
  return [...list].sort((a, b) => {
    let av = a[k], bv = b[k];
    if (av == null) av = 0; if (bv == null) bv = 0;
    if (typeof av === 'string' || typeof bv === 'string') return String(av).localeCompare(String(bv)) * dir;
    return (av - bv) * dir;
  });
}

function render() {
  const filtered = rowsData.filter(passesFilters);
  const sorted = sortRows(filtered);
  if (!sorted.length) {
    $('rows').innerHTML = '<div class="dt"><div class="dt-empty muted">No edits match the current filters.</div></div>';
    return;
  }
  const arrow = (k) => sortKey === k ? (sortDir === 'asc' ? ' ↑' : ' ↓') : '';
  const sortCell = (k, label) =>
    `<button type="button" class="dt-sort" data-sort="${k}">${label}${arrow(k)}</button>`;

  const verdictCell = (r) => {
    const v = verdictOf(r);
    const m = VERDICT_META[v];
    const d = r.ctr_delta_pct;
    return `<span class="pill pill--${m.role === 'err' ? 'err' : m.role === 'ok' ? 'ok' : m.role === 'info' ? 'info' : 'neutral'} pill--sm">${m.label}</span>`
      + (d != null ? `<div class="small dt-num ${d > 0 ? 'pos' : d < 0 ? 'neg' : 'muted'}">${d > 0 ? '+' : ''}${d}% CTR</div>` : '');
  };

  $('rows').innerHTML = `<div class="dt"><div class="dt-scroll"><div class="dt-body">
    <div class="dt-head">
      <span aria-hidden="true"></span>
      <span>Video</span>
      <span>Status</span>
      <span>Verdict</span>
      <span>${sortCell('days_since_apply', 'Days')}</span>
      <span aria-hidden="true"></span>
    </div>
    ${sorted.map((r, i) => `<div class="dt-row${r.measurement_status === 'regression' ? ' regression-row' : ''}">
      <span>${r.thumbnail_url ? `<img class="perf-thumb" src="${r.thumbnail_url}" loading="lazy" alt="" />` : ''}</span>
      <span>
        <div class="perf-title truncate" title="${escapeHtml(r.title_now || '')}">${escapeHtml(r.title_now)}</div>
        ${r.title_changed
          ? `<div class="perf-was truncate" title="${escapeHtml(r.title_before || '')}">was: ${escapeHtml(r.title_before)}</div>`
          : '<div class="perf-was">title unchanged</div>'}
        <div class="perf-sub"><code>${r.video_id}</code> · ${r.applied_at ? 'applied ' + r.applied_at.slice(0,10) : 'created ' + (r.created_at || '').slice(0,10)}</div>
      </span>
      <span>${statusPill(r.status)}</span>
      <span>${verdictCell(r)}</span>
      <span class="dt-num">${r.days_since_apply == null ? '—' : Math.round(r.days_since_apply)}</span>
      <span class="perf-actions">
        <button type="button" onclick="toggle(${i})">Diff</button>
        ${r.status === 'applied' ? `<button type="button" onclick="revert(${r.audit_id})">Revert</button>` : ''}
      </span>
    </div>
    <div class="dt-detail" id="diff-${i}" style="display:none"><div class="diff-row">${diffBlock(r)}</div></div>`).join('')}
  </div></div></div>`;

  $('rows').querySelectorAll('.dt-sort').forEach(el => el.onclick = () => {
    const k = el.dataset.sort;
    if (sortKey === k) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortKey = k; sortDir = 'desc'; }
    render();
  });
}

function diffBlock(r) {
  return `
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:.75rem;">
      <div><div class="muted small">DESCRIPTION — BEFORE</div><pre>${escapeHtml(r.description_before || '')}</pre></div>
      <div><div class="muted small">DESCRIPTION — AFTER</div><pre>${escapeHtml(r.description_after || '')}</pre></div>
      <div><div class="muted small">TAGS — BEFORE</div><div>${(r.tags_before||[]).map(t=>`<span class="pill">${escapeHtml(t)}</span>`).join(' ') || '<em class="muted">none</em>'}</div></div>
      <div><div class="muted small">TAGS — AFTER</div><div>${(r.tags_after||[]).map(t=>`<span class="pill">${escapeHtml(t)}</span>`).join(' ') || '<em class="muted">none</em>'}</div></div>
    </div>
    ${r.ai_reasoning ? `<div class="small muted" style="margin-top:.5rem"><b>Reasoning:</b> ${escapeHtml(r.ai_reasoning)}</div>` : ''}
    <div class="small muted" style="margin-top:.5rem">
      At apply: ${fmt(r.view_count_at_apply)} views · ${fmt(r.like_count_at_apply)} likes · ${fmt(r.comment_count_at_apply)} comments
      &nbsp;|&nbsp; Now: ${fmt(r.view_count_now)} / ${fmt(r.like_count_now)} / ${fmt(r.comment_count_now)}
      ${r.stats_last_fetched ? ` · stats refreshed ${(r.stats_last_fetched||'').slice(0,16).replace('T',' ')}` : ''}
    </div>`;
}

function toggle(i) {
  const el = document.getElementById('diff-' + i);
  el.style.display = el.style.display === 'none' ? '' : 'none';
}

async function revert(auditId) {
  if (!await confirmDialog('Restore the previous title / description / tags from before this audit?')) return;
  try {
    const r = await fetch(`/audits/${auditId}/revert`, { method: 'POST' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || JSON.stringify(j));
    toast(j.status === 'dry_run' ? 'DRY_RUN — payload logged but not pushed.' : 'Reverted to previous metadata.', j.status === 'dry_run' ? 'warn' : 'ok');
    SWR.invalidatePrefix(`/channels/${channelId}/performance`);
    await load();
  } catch (e) { toast('Revert failed: ' + escapeHtml(String(e)), 'err'); }
}

['min-days','search','f-status'].forEach(id => {   // verdict is a chip now
  $(id).oninput = id === 'f-status' ? load : render;
  $(id).onchange = id === 'f-status' ? load : render;
});

// Seconds until YouTube's daily quota reset (midnight America/Los_Angeles),
// DST-safe. Lets us show the same "resets in Xh Ym" countdown as the dashboard.
function secondsToQuotaReset() {
  const p = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })
    .formatToParts(new Date()).reduce((o, x) => (o[x.type] = x.value, o), {});
  const secsIntoDay = (Number(p.hour) % 24) * 3600 + Number(p.minute) * 60 + Number(p.second);
  return 86400 - secsIntoDay;
}
function fmtResetTime(seconds) {
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60);
  return `${h}h ${m}m`;
}

$('sync-btn').onclick = async () => {
  $('sync-btn').disabled = true; $('sync-status').textContent = 'Refreshing…';
  try {
    const r = await fetch(`/channels/${channelId}/refresh-applied-stats`, { method: 'POST' });
    const j = await r.json();
    if (r.status === 429 || j.detail === 'youtube_quota_exceeded') {
      toast(`YouTube quota exhausted — stats refresh skipped. Quota resets in ${fmtResetTime(secondsToQuotaReset())}.`, 'warn', 6000);
      $('sync-status').textContent = 'Quota exhausted';
    } else if (!r.ok) {
      toast('Stats refresh failed: ' + escapeHtml(j.detail || JSON.stringify(j)), 'err');
      $('sync-status').textContent = 'Failed';
    } else {
      toast(`Refreshed stats for ${j.refreshed} video${j.refreshed === 1 ? '' : 's'}.`, 'ok');
      $('sync-status').textContent = '';
      await load();
    }
  } catch (e) {
    toast('Stats refresh failed: ' + escapeHtml(String(e)), 'err');
    $('sync-status').textContent = 'Failed';
  }
  finally { $('sync-btn').disabled = false; }
};

load();
</script>
  <div id="toasts" aria-live="assertive" role="alert"></div>
</body>
</html>
