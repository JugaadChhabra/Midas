<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Midas · Results</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/static/theme.css" />
<link rel="icon" type="image/png" href="/static/midas.png" />
<link rel="apple-touch-icon" href="/static/midas.png" />
<style>
  body { margin:0; background:var(--ground); }

  /* One card per lever for this channel; each is the tab for the section below. */
  .glance { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:.75rem; margin:0 0 1.2rem; }
  .gl { text-align:left; font:inherit; color:inherit; cursor:pointer; padding:.85rem 1rem .9rem;
        border:1px solid var(--border); border-radius:var(--radius); background:var(--panel-bg);
        display:flex; flex-direction:column; gap:.3rem; transition:border-color .12s, box-shadow .12s; }
  .gl:hover { border-color:var(--ink-4); }
  .gl[aria-pressed="true"] { border-color:var(--color-accent); box-shadow:inset 0 0 0 1px var(--color-accent); }
  .gl .gl-top { font-size:12.5px; font-weight:650; color:var(--ink-2); }
  .gl .gl-big { font-size:19px; font-weight:700; letter-spacing:-.01em; line-height:1.2; }
  .gl .gl-big.ok { color:var(--color-ok); } .gl .gl-big.err { color:var(--color-err); }
  .gl .gl-big.muted { color:var(--ink-3); }
  .gl .gl-line { font-size:12.5px; color:var(--ink-3); line-height:1.45; }
  .gl .gl-line b { color:var(--ink-1); font-weight:600; font-variant-numeric:tabular-nums; }

  /* The selected lever: its numbers, then the videos behind them. */
  .panel { border:1px solid var(--border); border-radius:var(--radius); background:var(--panel-bg); padding:1rem 1.1rem; }
  .lv-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:.4rem 1rem; margin:0 0 .9rem; }
  .lv-head h2 { font-size:16px; margin:0; }
  .lv-head .what { font-size:12.5px; color:var(--ink-3); }
  .lv-head .grow { flex:1 1 0; }
  .lv-head a { font-size:12.5px; color:var(--color-accent); }
  .stats { display:flex; flex-wrap:wrap; gap:.8rem 2rem; align-items:flex-end; padding:0 0 1rem;
           border-bottom:1px solid var(--border-soft); margin:0 0 1rem; font-variant-numeric:tabular-nums; }
  .stat .k { display:block; font-size:11.5px; color:var(--ink-3); margin:0 0 .2rem; }
  .stat .v { font-size:20px; font-weight:700; letter-spacing:-.01em; }
  .stat .v.ok { color:var(--color-ok); } .stat .v.err { color:var(--color-err); }
  .stat .v small { font-size:12px; font-weight:500; color:var(--ink-3); margin-left:.2rem; }
  .stat .s { display:block; font-size:11.5px; color:var(--ink-4); margin-top:.15rem; }
  .stat .v i { font-weight:650; }
  .spark-svg { display:block; overflow:visible; }
  .spark-svg .zl { stroke:var(--border); stroke-dasharray:2 2; }
  .spark-svg .ln { fill:none; stroke:var(--ink-3); stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round; }
  .spark-svg .pt { fill:var(--ink-3); }
  .spark-svg.v-helped .ln { stroke:var(--color-ok); } .spark-svg.v-helped .pt { fill:var(--color-ok); }
  .spark-svg.v-worse .ln { stroke:var(--color-err); } .spark-svg.v-worse .pt { fill:var(--color-err); }
  .zero { color:var(--ink-4); }
  .of { color:var(--ink-4); font-weight:400; }

  .more-nums { font-size:12.5px; margin:-.4rem 0 1rem; }
  .more-nums summary { cursor:pointer; color:var(--color-accent); width:max-content; }
  .more-nums .box { max-width:30rem; margin:.5rem 0 0; font-variant-numeric:tabular-nums; }
  .hc-head, .hc-total { display:none; }
  .hc-row { display:flex; align-items:center; gap:.45rem; margin:.2rem 0; }
  .hc-row b { margin-left:auto; font-weight:600; }
  .hc-foot { margin:.5rem 0 0; padding:.45rem 0 0; border-top:1px solid var(--border-soft); color:var(--ink-3); }

  .howto { font-size:12.5px; color:var(--ink-3); margin:.9rem 0 0; line-height:1.55; }
  .howto summary { cursor:pointer; color:var(--color-accent); width:max-content; }
  .howto ul { margin:.4rem 0 0; padding-left:1.1rem; }

  .chg-tools { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem 1rem; margin:0 0 .6rem; font-size:12.5px; }
  .chg-tools h3 { font-size:13.5px; margin:0; }
  .chg-tools .grow { flex:1 1 0; }
  .chg-group + .chg-group { margin-top:1.3rem; }
  .chg-group h3 { display:flex; align-items:baseline; gap:.6rem; margin:0 0 .4rem; font-size:13px; font-weight:650; color:var(--ink-2); }
  .chg-group h3 .n { font-size:12px; font-weight:500; color:var(--ink-3); }
  .chg-row { display:grid; grid-template-columns:132px 1fr auto; gap:.9rem; align-items:start;
             padding:.65rem 0; border-top:1px solid var(--border-soft); }
  .chg-group h3 + .chg-row { border-top:0; }
  .chg-row .th { display:block; position:relative; aspect-ratio:16 / 9; border-radius:var(--radius-sm);
                 overflow:hidden; background:var(--surface-tint); }
  .chg-row .th img { width:100%; height:100%; object-fit:cover; display:block; }
  .chg-row .th .badge { position:absolute; left:5px; bottom:5px; padding:1px 6px; border-radius:4px;
                        font-size:10.5px; font-weight:600; color:#fff; background:rgba(0,0,0,.72); }
  .chg-row .vt { font-size:13px; font-weight:600; color:inherit; text-decoration:none; }
  .chg-row .vt:hover { text-decoration:underline; }
  .chg-row .tags { display:flex; flex-wrap:wrap; gap:.3rem; margin:.3rem 0; }
  .chg-row .what { font-size:12.5px; color:var(--ink-2); line-height:1.5; }
  .chg-row .what .was { color:var(--ink-4); text-decoration:line-through; }
  .chg-row .what ul { margin:.2rem 0 0; padding-left:1.1rem; }
  .chg-row .res { text-align:right; font-variant-numeric:tabular-nums; min-width:7.5rem; font-size:12.5px; }
  .chg-row .res b { display:block; font-size:16px; letter-spacing:-.01em; }
  .chg-row .res .up { color:var(--color-ok); } .chg-row .res .down { color:var(--color-err); }
  .chg-row .res .sm { display:block; color:var(--ink-4); font-size:11.5px; margin-top:.15rem; }
  .chg-more { text-align:center; margin:.8rem 0 0; }
  @media (max-width: 640px) {
    .chg-row { grid-template-columns:88px 1fr; }
    .chg-row .res { grid-column:2; text-align:left; }
  }

  .week { border:1px solid var(--border); border-radius:var(--radius); background:var(--panel-bg);
          margin:1rem 0 0; padding:.65rem .9rem; }
  .week > summary { cursor:pointer; display:flex; gap:.8rem; align-items:baseline; flex-wrap:wrap; font-size:13px; }
  .week > summary h2 { font-size:13.5px; font-weight:650; margin:0; display:inline; }
  .week .tot { color:var(--ink-3); } .week .tot b { color:var(--ink-1); font-weight:650; }
  .week ul { list-style:none; margin:.5rem 0 .2rem; padding:0; font-size:12.5px; }
  .week li { display:flex; gap:.7rem; padding:.18rem 0; align-items:baseline; }
  .week li .t { color:var(--ink-4); width:6.5rem; flex:none; font-variant-numeric:tabular-nums; }
  .week li .k { width:5.2rem; flex:none; font-weight:600; }
  .week li .k-written { color:var(--color-ok); } .week li .k-judged { color:var(--ink-2); }
  .week li .k-reverted, .week li .k-stopped, .week li .k-cancelled { color:var(--color-err); }
</style>
</head>
<body>
  <div class="app-shell" id="app-shell">
  <main class="app-main">
    <header class="page-head">
      <h1 class="page-title" id="title">Results</h1>
    </header>
    <p class="page-meta" id="meta">Is Midas helping this channel?</p>

    <div class="glance" id="glance" role="group" aria-label="What Midas changes"></div>
    <section class="panel" id="lever"><div class="skel" data-skeleton data-rows="4"></div></section>
    <details class="week" id="week" hidden></details>
  </main>
  </div>

<script src="/static/swr.js"></script>
<script src="/static/components.js"></script>
<script src="/static/sidebar.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? '').toString().replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ── Which channel: ?id=, else the last one opened, else the first ─────
const params = new URLSearchParams(location.search);
let channelId = params.get('id') || Sidebar.lastChannel() || '';
let channelName = '';
Sidebar.mount({
  items: Sidebar.TOP_ITEMS.concat([{ section: '' }],
    Sidebar.CHANNEL_ITEMS.map(it => ({ ...it, href: Sidebar.channelItemHref(it.id, channelId) }))),
  activeId: 'results',
  channelHref: (id) => `/results?id=${encodeURIComponent(id)}`,
});

// ── Formatting ────────────────────────────────────────────────────────
const num = (n) => Number(n || 0).toLocaleString();
const signed = (x, d = 1) => x == null ? '' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
const pct = (x, d = 0) => x == null ? '' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(100 * (Math.exp(x) - 1)).toFixed(d) + '%';
const wk = (iso) => iso ? new Date(iso + 'T00:00:00Z').toLocaleDateString(undefined,
  { day: 'numeric', month: 'short', timeZone: 'UTC' }) : '';
const plural = (n, w) => `${num(n)} ${w}${n === 1 ? '' : 's'}`;

// `fmt` writes a lift: backlinks and playlists per week, titles as the % a log-ratio is.
const LEVERS = [
  { id: 'backlinks', label: 'Backlinks', what: 'Midas adds up to 3 links to related videos in the description',
    unit: 'views / week', per: '/wk', fmt: (x, d) => signed(x, d) },
  { id: 'title', label: 'Titles', what: "Midas rewrites the title in the SEO team's structure",
    unit: 'change in views vs held back', per: '', fmt: (x, d) => pct(x, d === 2 ? 1 : 0), paths: true },
  { id: 'playlist', label: 'Playlist test', what: 'Midas added related videos to half the playlists, one test per channel',
    unit: 'playlist starts / week', per: '/wk', fmt: (x, d) => signed(x, d), kind: 'playlist' },
  { id: 'short_link', label: 'Short links', what: 'Midas recommends a video to link from each Short; the team sets it in Studio',
    kind: 'short_link' },
];
const LEVER_KEY = 'midas:results:lever';
let current = params.get('lever')
  || (() => { try { return localStorage.getItem(LEVER_KEY) || 'backlinks'; } catch { return 'backlinks'; } })();
if (!LEVERS.some(l => l.id === current)) current = 'backlinks';

function spark(weeks, verdict) {
  const vals = (weeks || []).map(w => w.lift).filter(v => v != null);
  if (!vals.length) return '<span class="zero">·</span>';
  const W = 72, H = 22, pad = 3;
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const span = hi - lo || 1;
  const x = (i) => vals.length === 1 ? W / 2 : pad + i * (W - 2 * pad) / (vals.length - 1);
  const y = (v) => pad + (hi - v) * (H - 2 * pad) / span;
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const last = vals.length - 1;
  return `<svg class="spark-svg v-${esc(verdict || 'none')}" width="${W}" height="${H}"
      viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly lift: ${vals.map(v => signed(v)).join(', ')}">
    <line class="zl" x1="0" x2="${W}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/>
    ${vals.length > 1 ? `<polyline class="ln" points="${pts}"/>` : ''}
    <circle class="pt" cx="${x(last).toFixed(1)}" cy="${y(vals[last]).toFixed(1)}" r="2.4"/></svg>`;
}

// The early read (#172): changes still inside their window, never a verdict.
const postDays = (e) => e.post_days_min === e.post_days_max
  ? `${e.post_days_max} day${e.post_days_max === 1 ? '' : 's'} in`
  : `${e.post_days_min}–${e.post_days_max} days in`;
const ctrPct = (x) => x == null ? '—' : (100 * x).toFixed(1) + '%';
function earlyLine(lever, e) {
  if (!e || e.lift == null) return '';
  return `<span class="early" title="Early, not a verdict">
    <span class="pill pill--sm pill--info">early</span> <i>${lever.fmt(e.lift, 1)}${esc(lever.per)}</i> · ${esc(postDays(e))}</span>`;
}
function earlyCard(lever, e) {
  if (!e) return '';
  const row = (label, v) => `<div class="hc-row">${label}<b>${v}</b></div>`;
  const mean = (x, n) => x == null ? '—' : `<i>${lever.fmt(x, 2)}</i> <span class="of">(${n})</span>`;
  return `<div class="hc-foot"><span class="pill pill--sm pill--info">early</span> <i>Early, not a verdict</i>, ${esc(postDays(e))}
    ${row('Early lift', e.lift == null ? '—' : `<i>${lever.fmt(e.lift, 2)}</i>`)}
    ${row('Changed videos, mean', mean(e.treated_mean_delta, e.n_treated))}
    ${row('Held back, mean', mean(e.holdout_mean_delta, e.n_holdout))}
    ${e.impressions ? row('Impressions / day, before → after',
        `${num(Math.round(e.impressions.pre))} → ${num(Math.round(e.impressions.post))}`) : ''}
    ${e.ctr ? row('CTR, before → after', `${ctrPct(e.ctr.pre)} → ${ctrPct(e.ctr.post)}`) : ''}
  </div>`;
}

// ── The answer per channel, in plain words ────────────────────────────
const VERDICT = { helped: ['Helping', 'pill--ok'], no_change: ['No clear effect', 'pill--neutral'],
                  worse: ['Hurting', 'pill--err'] };
function statusOf(c) {
  if (c.stop_rule_triggered)
    return { key: 'stopped', word: 'Stopped', pill: 'pill--err',
             why: `didn't help, switched off wk of ${wk(c.stopped_week)}` };
  if (c.state && !c.state.on) return { key: 'off', word: 'Off', pill: 'pill--neutral', why: c.state.reason || '' };
  if (c.verdict) return { key: c.verdict, word: VERDICT[c.verdict][0], pill: VERDICT[c.verdict][1],
                          why: plural(c.windows_judged, 'week') + ' judged' };
  if (c.early && c.early.lift != null)
    return { key: 'early', word: 'Too early', pill: 'pill--info', why: 'still being measured' };
  if (c.first_verdict) return { key: 'waiting', word: 'Waiting', pill: 'pill--info', why: `first verdict ~${wk(c.first_verdict)}` };
  if (!c.counts.written) return { key: 'idle', word: 'Nothing written yet', pill: 'pill--neutral', why: '' };
  return { key: 'waiting', word: 'Waiting', pill: 'pill--info', why: 'no verdict yet' };
}
const stPill = (s) => `<div class="st"><span class="pill pill--sm ${s.pill}">${esc(s.word)}</span>${s.why ? `<span class="why">${esc(s.why)}</span>` : ''}</div>`;

function hoverBody(name, lever, c, fleet) {
  const k = c.counts;
  const cancelled = Object.entries(k.cancelled).map(([r, n]) => `${esc(r)} ${n}`).join(', ');
  const row = (label, v) => `<div class="hc-row">${label}<b>${v}</b></div>`;
  return `<div class="hc-head">${esc(name)} · ${esc(lever.label)}</div>
    <div class="hc-total">${c.lift == null ? '—' : lever.fmt(c.lift, 2)}<small>lift, ${esc(lever.unit)}</small></div>
    ${row('Changed videos, mean', c.treated_mean_delta == null ? '—' : `${lever.fmt(c.treated_mean_delta, 2)} <span class="of">(${c.n_treated})</span>`)}
    ${row('Held back, mean', c.holdout_mean_delta == null ? '—' : `${lever.fmt(c.holdout_mean_delta, 2)} <span class="of">(${c.n_holdout})</span>`)}
    ${fleet ? '' : row('Cumulative lift (stop rule)', c.cumulative_lift == null ? '—' : lever.fmt(c.cumulative_lift, 2))}
    ${row('Weeks judged', c.windows_judged)}
    ${c.paths ? `<div class="hc-foot">${Object.entries(c.paths).map(([p, v]) => row(
        `${esc(p[0].toUpperCase() + p.slice(1))} <span class="of">${num(v.treated)} written, ${num(v.n_treated)} judged vs ${num(v.n_holdout)} held back${v.stopped ? ', stopped' : ''}</span>`,
        v.lift == null ? '—' : lever.fmt(v.lift, 2))).join('')}</div>` : ''}
    ${c.first_verdict && !c.weeks.length ? `<div class="hc-foot">First verdicts ~${esc(wk(c.first_verdict))}</div>` : ''}
    ${earlyCard(lever, c.early)}
    <div class="hc-foot">
      ${row('Held back', num(k.holdout))}
      ${row('Declined', num(k.declined))}
      ${cancelled ? row('Cancelled', cancelled) : ''}
      ${k.reverted.manual + k.reverted.auto ? row('Reverted', `${k.reverted.manual} by hand, ${k.reverted.auto} auto`) : ''}
      ${row('Not enough data', num(k.insufficient_data))}
      ${k.shorts_excluded ? row('On Shorts, left out', num(k.shorts_excluded)) : ''}
      ${k.team ? row('Team edits (never in the lift)', `${num(k.team)}, ${num(k.team_judged)} judged`) : ''}
    </div>`;
}

function liftHtml(lever, x, verdict, early) {
  if (x == null) return early && early.lift != null ? '' : '<span class="zero">—</span>';
  const cls = verdict === 'helped' ? 'ok' : verdict === 'worse' ? 'err' : '';
  return `<span class="n ${cls}">${lever.fmt(x, 1)}</span>${lever.per ? `<span class="u">${esc(lever.per)}</span>` : ''}`;
}
const yt = (id) => `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;

function videoThumb(id, v) {
  const img = v && v.thumbnail_url ? `<img src="${esc(v.thumbnail_url)}" loading="lazy" alt="" />` : '';
  const type = !v || v.is_short == null ? '' : v.is_short ? 'Short' : 'Long-form';
  return `<a class="th" href="${yt(id)}" target="_blank" rel="noopener">${img}${type ? `<span class="badge">${type}</span>` : ''}</a>`;
}
const vlink = (id, v) => `<a class="vt" href="${yt(id)}" target="_blank" rel="noopener">${esc((v && v.title) || id)}</a>`;
const views = (x) => x == null ? '—' : num(Math.round(x));

function resultCell(lever, c) {
  if (c.delta != null && !c.early) {
    const cls = c.delta > 0 ? 'up' : c.delta < 0 ? 'down' : '';
    return `<b class="${cls}">${lever.fmt(c.delta, 1)}${esc(lever.per)}</b>
      ${c.pre != null ? `<span class="sm">views ${views(c.pre)} → ${views(c.post)}</span>` : ''}`;
  }
  if (c.early) return `<b><i>${c.early.delta == null ? '—' : lever.fmt(c.early.delta, 1) + esc(lever.per)}</i></b>
      <span class="sm"><span class="pill pill--sm pill--info">early</span> <i>not a verdict</i>, ${c.early.post_days} post day${c.early.post_days === 1 ? '' : 's'}</span>
      ${c.early.impressions ? `<span class="sm">impressions/day ${views(c.early.impressions.pre)} → ${views(c.early.impressions.post)}</span>
      <span class="sm">CTR ${ctrPct(c.early.ctr.pre)} → ${ctrPct(c.early.ctr.post)}</span>` : ''}`;
  if (c.status === 'insufficient_data') return '<span class="sm">not enough data</span>';
  return `<span class="sm">${esc((c.status || '').replace('_', ' '))}</span>`;
}

function changeRow(lever, c) {
  const tags = [];
  if (c.origin === 'human') tags.push('<span class="tag">team edit</span>');
  if (c.arm === 'holdout') tags.push('<span class="tag">held back</span>');
  if (c.status === 'declined') tags.push('<span class="tag">declined</span>');
  if (c.error) tags.push(`<span class="tag">cancelled: ${esc(c.error)}</span>`);
  if (c.reverted_by) tags.push(`<span class="pill pill--sm pill--warn" title="${esc(c.reverted_at || '')}">reverted by ${c.reverted_by === 'midas' ? 'Midas' : 'a person'}</span>`);
  let what = '';
  if (lever.id === 'title') {
    if (c.title || c.title_before) what = `<span class="was">${esc(c.title_before || '')}</span> → ${esc(c.title || '(no change)')}`;
    if (c.path) tags.unshift(`<span class="pill pill--sm pill--neutral">${esc(c.path)} path</span>`);
  } else if (c.targets && c.targets.length) {
    what = `Linked to:<ul>${c.targets.map(t => `<li><a href="${yt(t.video_id)}" target="_blank" rel="noopener">${esc(t.title || t.video_id)}</a></li>`).join('')}</ul>`;
  }
  return `<div class="chg-row">${videoThumb(c.video_id, c.video)}
    <div><div>${vlink(c.video_id, c.video)}</div>
      <div class="tags">${tags.join('')}</div><div class="what">${what}</div></div>
    <div class="res">${resultCell(lever, c)}</div></div>`;
}

function armRow(lever, c) {
  const pill = { dosed: 'pill--ok', holdout: 'pill--neutral', judged: 'pill--info' }[c.status] || 'pill--neutral';
  const weeks = (c.measurement_result && c.measurement_result.weeks || []).length;
  return `<div class="chg-row"><div></div>
    <div><div><b>${esc((c.playlist && c.playlist.title) || c.playlist_id)}</b></div>
      <div class="tags"><span class="pill pill--sm ${pill}">${esc(c.status.replace('_', ' '))}</span>
        <span class="tag">${esc(c.arm)}</span></div>
      <div class="what">${num(c.eligible_members)} members${c.first_applied_at ? ` · first additions ${esc(wk(c.first_applied_at.slice(0, 10)))}` : ''}${weeks ? ` · ${weeks} week${weeks === 1 ? '' : 's'} measured` : ''}</div></div>
    <div class="res">${c.delta == null ? '<span class="sm">no week judged</span>' : `<b class="${c.delta > 0 ? 'up' : c.delta < 0 ? 'down' : ''}">${lever.fmt(c.delta, 1)}${esc(lever.per)}</b><span class="sm">latest week, starts</span>`}</div></div>`;
}

function recRow(lever, c) {
  const pill = { set: 'pill--ok', pending: 'pill--info', dismissed: 'pill--neutral', not_chosen: 'pill--neutral' }[c.status] || 'pill--neutral';
  return `<div class="chg-row">${videoThumb(c.short_id, c.video)}
    <div><div>${vlink(c.short_id, c.video)}</div>
      <div class="tags"><span class="pill pill--sm ${pill}">${esc(c.status.replace('_', ' '))}</span>
        ${c.seen_at ? '<span class="tag">seen in traffic</span>' : ''}</div>
      <div class="what">→ <a href="${yt(c.target_video_id)}" target="_blank" rel="noopener">${esc((c.target && c.target.title) || c.target_video_id)}</a>
        <span class="of">· similarity ${Number(c.similarity).toFixed(2)}${c.feed_views != null ? ` · ${num(c.feed_views)} feed views` : ''}</span></div></div>
    <div class="res"><span class="sm">rank ${c.rank}</span></div></div>`;
}

// Gains best first, losses worst first (the server's order), then what is still
// open, then the rest; a held-back row sits in its own group.
function groupChanges(lever, d) {
  if (d.kind !== 'interventions') return [[d.kind === 'arms' ? 'Arms' : 'Recommendations', d.changes]];
  const held = d.changes.filter(c => c.arm !== 'treated' || c.status === 'declined');
  const mine = d.changes.filter(c => !held.includes(c));
  const judged = (c) => c.delta != null && c.status !== 'insufficient_data' && !c.early;
  return [
    ['Biggest gains', mine.filter(c => judged(c) && c.delta >= 0)],
    ['Biggest losses', mine.filter(c => judged(c) && c.delta < 0)],
    ['Still measuring', mine.filter(c => !judged(c) && c.early)],
    ['Not measured', mine.filter(c => !judged(c) && !c.early)],
    ['Held back and declined', held],
  ].filter(([, rows]) => rows.length);
}
const ANSWER = { yes: ['Helping', 'pill--ok', 'playlists with additions earned more starts'], no: ["Didn't help", 'pill--err', 'stopped'], pending: ['Still counting', 'pill--info', 'the test runs 4 weeks'] };
function eventText(e, names) {
  const d = e.detail || {};
  const ch = names[e.channel_id] || e.channel_id;
  const vid = e.video_id ? (d.video_title || e.video_id) : '';
  const lever = (LEVERS.find(l => l.id === e.lever) || {}).label || e.lever;
  const tail = e.kind === 'judged' ? ` (${d.status || 'judged'}${d.delta != null ? ', ' + signed(d.delta, 2) : ''})`
    : e.kind === 'reverted' ? ` (by ${d.by === 'midas' ? 'Midas' : 'a person'})`
    : e.kind === 'cancelled' ? ` (${d.reason})`
    : e.kind === 'stopped' ? ` (week of ${wk(d.week_start)}, ${d.windows_judged ?? '?'} windows)` : '';
  const link = e.video_id ? `<a href="https://youtu.be/${encodeURIComponent(e.video_id)}" target="_blank" rel="noopener">${esc(vid)}</a>` : 'the lever';
  return `${esc(ch)} · ${esc(lever)} · ${link}${esc(tail)}`;
}


// ── This channel's answer per lever ───────────────────────────────────
function cardFor(lever, c) {
  let big, cls = 'muted', lines = [];
  if (lever.kind === 'playlist') {
    const total = Object.values(c.arms).reduce((x, y) => x + y, 0);
    if (!total) big = 'No test here';
    else { big = ANSWER[c.answer][0]; cls = { yes: 'ok', no: 'err' }[c.answer] || 'muted'; }
    if (total) lines.push(`<b>${num(c.arms.dosed || 0)}</b> playlists changed · <b>${num(c.arms.holdout || 0)}</b> held back`);
  } else if (lever.kind === 'short_link') {
    const r = c.recommendations;
    if (c.team) { big = `${plural(c.team, 'link')} set`; cls = 'ok'; }
    else if (r.pending) big = 'Not used yet';
    else big = 'Nothing recommended';
    lines.push(`<b>${num(r.pending)}</b> recommendations waiting`);
  } else {
    const s = statusOf(c);
    big = s.word;
    cls = { helped: 'ok', worse: 'err', stopped: 'err' }[s.key] || 'muted';
    if (c.lift != null) lines.push(`Lift <b>${lever.fmt(c.lift, 1)}${esc(lever.per)}</b>`);
    else if (c.early && c.early.lift != null) lines.push(`Early read <b><i>${lever.fmt(c.early.lift, 1)}${esc(lever.per)}</i></b>, not a verdict`);
    if (s.why && s.key !== 'early') lines.push(esc(s.why));
    lines.push(`<b>${num(c.counts.written)}</b> written · <b>${num(c.counts.awaiting)}</b> measuring`);
  }
  return `<button type="button" class="gl" data-lever="${esc(lever.id)}" aria-pressed="${lever.id === current}">
    <span class="gl-top">${esc(lever.label)}</span><span class="gl-big ${cls}">${esc(big)}</span>
    ${lines.map(l => `<span class="gl-line">${l}</span>`).join('')}</button>`;
}

// ── The selected lever: headline numbers ──────────────────────────────
const stat = (k, v, s = '', cls = '') => `<div class="stat"><span class="k">${k}</span><span class="v ${cls}">${v}</span>${s ? `<span class="s">${s}</span>` : ''}</div>`;
const liftCls = (v) => v === 'helped' ? 'ok' : v === 'worse' ? 'err' : '';

function statsFor(lever, c) {
  if (lever.kind === 'short_link') {
    const r = c.recommendations;
    return stat('Recommended, waiting', num(r.pending)) + stat('Set by the team', num(r.set))
      + stat('Seen in traffic', num(c.seen))
      + stat('Team effect', c.verdict && c.verdict.treated_mean_delta != null
          ? `${signed(c.verdict.treated_mean_delta, 1)}<small>views/wk</small>` : '<span class="zero">—</span>',
          c.verdict ? `week of ${wk(c.verdict.week_start)}` : 'no week measured yet');
  }
  if (lever.kind === 'playlist') {
    const total = Object.values(c.arms).reduce((x, y) => x + y, 0);
    if (!total) return stat('Answer', 'No test drawn on this channel', '', 'zero');
    const [word, , why] = ANSWER[c.answer];
    return stat('Answer', word, c.stop_rule_triggered ? `stopped wk of ${wk(c.stopped_week)}` : why,
                { yes: 'ok', no: 'err' }[c.answer] || '')
      + stat('Lift', c.lift == null ? '<span class="zero">—</span>' : `${lever.fmt(c.lift, 1)}<small>${esc(lever.unit)}</small>`,
             plural(c.windows_judged, 'week') + ' judged', liftCls(c.verdict))
      + stat('Weekly trend', spark(c.weeks, c.verdict))
      + stat('Test ran', c.test_start ? `${wk(c.test_start)} – ${wk(c.test_end)}` : '—')
      + stat('Playlists changed', num(c.arms.dosed || 0), `${num(c.arms.holdout || 0)} held back`);
  }
  const s = statusOf(c);
  const k = c.counts;
  const lift = c.lift != null
    ? stat('Lift', `${lever.fmt(c.lift, 1)}<small>${esc(lever.unit)}</small>`,
           `changed ${c.treated_mean_delta == null ? '—' : lever.fmt(c.treated_mean_delta, 1)} vs held back ${c.holdout_mean_delta == null ? '—' : lever.fmt(c.holdout_mean_delta, 1)}`,
           liftCls(c.verdict))
    : c.early && c.early.lift != null
      ? stat('Early read', `<i>${lever.fmt(c.early.lift, 1)}</i><small>${esc(lever.unit)}</small>`,
             `not a verdict · ${postDays(c.early)}`)
      : stat('Lift', '<span class="zero">—</span>', 'nothing measured yet');
  return stat('Result', `<span class="pill ${s.pill}">${esc(s.word)}</span>`, esc(s.why))
    + lift
    + (c.weeks.length ? stat('Weekly trend', spark(c.weeks, c.verdict), plural(c.weeks.length, 'week')) : '')
    + stat('Written', num(k.written), `${num(k.holdout)} held back for comparison`)
    + stat('Measured', num(k.judged), `${num(k.awaiting)} still measuring`);
}

function paintLever() {
  if (!shown) return;
  const lever = LEVERS.find(l => l.id === current);
  const c = shown.levers[lever.id];
  const more = lever.kind ? '' : `<details class="more-nums"><summary>All the numbers</summary>
      <div class="box">${hoverBody(channelName, lever, c, false)}</div></details>`;
  const csvQ = new URLSearchParams({ channel_id: channelId, lever: lever.id });
  $('lever').innerHTML = `<div class="lv-head"><h2>${esc(lever.label)}</h2><span class="what">${esc(lever.what)}</span>
      <span class="grow"></span><a href="/seo/results/changes.csv?${csvQ}" download>Download CSV</a></div>
    <div class="stats">${statsFor(lever, c)}</div>${more}
    <div class="chg-tools"><h3>${lever.kind === 'playlist' ? 'Playlists' : lever.kind === 'short_link' ? 'Recommendations' : 'Videos changed'}</h3>
      <span class="grow"></span>
      ${lever.kind === 'short_link' ? '' : `<label class="field-check"><input type="checkbox" id="chg-held"${showHeld ? ' checked' : ''} /> <span>Show held back</span></label>`}</div>
    <div id="chg-list"><div class="skel" data-skeleton data-rows="3"></div></div>
    <details class="howto"><summary>How to read this</summary><ul>
      <li><b>Helping</b>, <b>No clear effect</b> or <b>Hurting</b> comes from the weekly judgement (Mondays).
        <b>Stopped</b> means it didn't help here, so Midas switched it off on this channel.</li>
      <li><b>Lift</b> is how much more a changed video gained than the videos Midas deliberately left alone
        (1 in 5 is held back for comparison). Backlinks: extra views per week arriving from the linking video.
        Titles: the extra change in browse, search and suggested views, as a %.</li>
      <li><span class="pill pill--sm pill--info">early</span> <i>in italics</i> is a first look at changes still being
        measured. It is not a verdict and never stops or undoes anything.</li></ul></details>`;
  const held = $('chg-held');
  if (held) held.onchange = () => { showHeld = held.checked; loadChanges(false); };
  loadChanges(false);
}

// ── The videos behind it, from /seo/results/changes ───────────────────
let showHeld = false, chRows = [], chKind = '', chNext = null, chGen = 0;
function drawChanges(lever) {
  const list = $('chg-list');
  if (!list) return;
  const render = lever.kind === 'playlist' ? armRow : lever.kind === 'short_link' ? recRow : changeRow;
  const groups = groupChanges(lever, { kind: chKind, changes: chRows });
  list.innerHTML = groups.length
    ? groups.map(([title, items]) => `<div class="chg-group"><h3>${esc(title)}<span class="n">${items.length}</span></h3>
        ${items.map(c => render(lever, c)).join('')}</div>`).join('')
      + (chNext != null ? '<div class="chg-more"><button class="btn" id="chg-more">Show more</button></div>' : '')
    : '<p class="muted">Nothing here yet.</p>';
  const more = $('chg-more');
  if (more) more.onclick = () => loadChanges(true);
}
async function loadChanges(append) {
  const lever = LEVERS.find(l => l.id === current);
  const mine = ++chGen;
  const q = new URLSearchParams({ channel_id: channelId, lever: lever.id, order: 'delta', limit: '100',
    offset: append ? String(chNext) : '0' });
  if (!showHeld && lever.kind !== 'short_link') q.set('arm', 'treated');
  try {
    const r = await fetch('/seo/results/changes?' + q);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (mine !== chGen) return;
    chRows = append ? chRows.concat(d.changes) : d.changes;
    chKind = d.kind; chNext = d.next_offset;
    drawChanges(lever);
  } catch (err) {
    if (mine === chGen && $('chg-list')) $('chg-list').innerHTML = `<em class="muted">Could not load the changes: ${esc(err && err.message || err)}</em>`;
  }
}

// ── Page ──────────────────────────────────────────────────────────────
let shown = null;
function paint(data) {
  const ch = data.channels.find(c => c.id === channelId);
  if (!ch) { $('lever').innerHTML = '<p class="muted">This channel has no results.</p>'; return; }
  shown = ch;
  const next = new Date(data.next_judgement);
  const t = ch.today;
  $('meta').textContent = (t ? `${num(t.written)} of ${t.cap == null ? '–' : num(t.cap)} changes written today. ` : '')
    + `Next weekly judgement ${next.toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short',
      hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC' })} UTC.`;
  const levers = LEVERS.filter(l => ch.levers[l.id]);
  if (!levers.some(l => l.id === current)) current = levers[0].id;
  $('glance').innerHTML = levers.map(l => cardFor(l, ch.levers[l.id])).join('');
  paintLever();
}
$('glance').addEventListener('click', (e) => {
  const b = e.target.closest('[data-lever]');
  if (!b || b.dataset.lever === current) return;
  current = b.dataset.lever;
  try { localStorage.setItem(LEVER_KEY, current); } catch {}
  for (const x of $('glance').querySelectorAll('[data-lever]')) x.setAttribute('aria-pressed', String(x.dataset.lever === current));
  paintLever();
});

// ── Last 7 days on this channel, folded to one line ───────────────────
const KINDS = ['written', 'judged', 'reverted', 'stopped', 'cancelled'];
function paintWeek(data) {
  const box = $('week');
  const events = data.events.filter(e => e.channel_id === channelId);
  const totals = KINDS.map(k => [k, events.filter(e => e.kind === k).length]).filter(([, n]) => n)
    .map(([k, n]) => `<b>${n}</b> ${k}`).join(' · ') || 'nothing happened';
  const names = { [channelId]: channelName };
  const wasOpen = box.open;
  box.hidden = false;
  box.innerHTML = `<summary><h2>Last ${data.days} days</h2><span class="tot">${totals}</span></summary>
    ${events.length ? `<ul>${events.map(e => `<li><span class="t">${esc(new Date(e.at).toLocaleString(undefined,
      { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }))}</span>
      <span class="k k-${esc(e.kind)}">${esc(e.kind)}</span><span>${eventText(e, names).replace(/^[^·]*· /, '')}</span></li>`).join('')}</ul>` : ''}`;
  box.open = wasOpen;
}

async function start() {
  let all = [];
  try { const r = await fetch('/auth/channels'); all = r.ok ? await r.json() : []; } catch {}
  if (!all.some(c => c.id === channelId)) channelId = (all.slice().sort((a, b) =>
    String(a.name || '').localeCompare(String(b.name || '')))[0] || {}).id || '';
  if (!channelId) {
    $('glance').innerHTML = '';
    $('lever').innerHTML = '<p class="muted">No channels are mapped to you yet; ask the admin.</p>';
    return;
  }
  Sidebar.rememberChannel(channelId);
  const q = new URLSearchParams(location.search);
  q.set('id', channelId);
  history.replaceState(null, '', '/results?' + q);
  for (const it of Sidebar.CHANNEL_ITEMS) {
    const a = document.querySelector(`.sidebar a[data-tab="${it.id}"]`);
    if (a) a.setAttribute('href', Sidebar.channelItemHref(it.id, channelId));
  }
  const c = all.find(x => x.id === channelId) || {};
  channelName = c.name || channelId;
  const short = Sidebar.shortLabel(channelName, Sidebar.commonWordPrefix(all.map(x => x.name)));
  Sidebar.setChannels(all, channelId);
  Sidebar.setSection(short);
  $('title').textContent = `${short} · Results`;
  document.title = `Midas · ${short} · Results`;

  SWR.swr('/seo/results?' + new URLSearchParams({ channel_id: channelId }), paint, {
    onError: (err) => { if (!shown) $('lever').innerHTML = `<em class="muted">Could not load the results: ${esc(err && err.message || err)}</em>`; },
  });
  SWR.swr('/seo/results/timeline?days=7', paintWeek, { onError: () => {} });
}

Components.init();
start();
</script>
</body>
</html>
