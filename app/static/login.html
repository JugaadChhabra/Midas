<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Midas · Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- theme.css is the only asset this page loads: it is the one static file
     outside the gate (app/session.py PUBLIC_PATHS), so the script stays inline. -->
<link rel="stylesheet" href="/static/theme.css" />
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:var(--ground); }
  .login { box-sizing:border-box; width:min(360px, calc(100vw - 2rem));
           padding:28px 28px 24px; background:var(--panel-bg); color:var(--panel-fg);
           border:1px solid var(--border); border-radius:var(--radius);
           box-shadow:var(--shadow-1); }
  .login-brand { display:flex; align-items:center; gap:.55rem; margin:0 0 4px;
                 font-size:1.15rem; font-weight:700; }
  .login-lede { margin:0 0 20px; font-size:.88rem; color:var(--ink-3); }
  .login .field { max-width:none; }
  .login input { font:inherit; font-size:.92rem; padding:.55rem .65rem;
                 border:1px solid var(--border-strong); border-radius:var(--radius-md);
                 background:transparent; color:inherit; }
  .login input:focus-visible { outline:2px solid var(--color-accent); outline-offset:1px; }
  .login .btn-primary { width:100%; padding:.65rem; font-size:.92rem; margin-top:4px; }
  .login-error { margin:0 0 14px; padding:.55rem .7rem; font-size:.85rem;
                 color:var(--color-err); background:var(--color-err-bg);
                 border:1px solid var(--color-err-border); border-radius:var(--radius-md); }
</style>
</head>
<body>
  <main class="login">
    <h1 class="login-brand">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="3.4" fill="currentColor"/>
        <g stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M12 1.7v3.5M12 18.8v3.5M22.3 12h-3.5M5.2 12H1.7"/>
          <path d="m19.3 4.7-2.5 2.5M7.2 16.8l-2.5 2.5M19.3 19.3l-2.5-2.5M7.2 7.2 4.7 4.7"/>
        </g></svg>
      Midas
    </h1>
    <p class="login-lede">Sign in to continue.</p>

    <form id="login-form" action="/session/login" method="post" novalidate>
      <p class="login-error" id="login-error" role="alert" hidden></p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn btn-primary" id="login-go" type="submit">Sign in</button>
    </form>
  </main>

<script>
(function () {
  'use strict';
  const form = document.getElementById('login-form');
  const err = document.getElementById('login-error');
  const go = document.getElementById('login-go');

  // Only a same-site path: never an absolute URL or a protocol-relative "//host".
  function nextPath() {
    const next = new URLSearchParams(location.search).get('next') || '/';
    return /^\/(?![\/\\])/.test(next) ? next : '/';
  }

  // swr.js keeps pages' last responses in localStorage. A new sign-in starts
  // clean, so nobody is painted the previous user's data (this page can't load
  // swr.js: it is behind the gate).
  function clearPageCache() {
    try {
      Object.keys(localStorage)
        .filter(k => k.indexOf('midas:swr:') === 0)
        .forEach(k => localStorage.removeItem(k));
    } catch (_) { /* private mode */ }
  }

  function showError(text) {
    err.textContent = text;
    err.hidden = !text;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    showError('');
    go.disabled = true;
    go.textContent = 'Signing in…';
    try {
      const r = await fetch('/session/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: form.email.value.trim(),
          password: form.password.value,
        }),
      });
      if (r.ok) { clearPageCache(); location.replace(nextPath()); return; }
      const body = await r.json().catch(() => ({}));
      showError(typeof body.detail === 'string' ? body.detail : 'Email or password is wrong.');
      form.password.value = '';
      form.password.focus();
    } catch (_) {
      showError('Midas could not be reached. Try again.');
    } finally {
      go.disabled = false;
      go.textContent = 'Sign in';
    }
  });
})();
</script>
</body>
</html>
