<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Midas · Team</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/static/theme.css" />
<link rel="icon" type="image/png" href="/static/midas.png" />
<link rel="apple-touch-icon" href="/static/midas.png" />
<style>
  body { margin:0; background:var(--ground); }

  /* One panel per tab; the chip bar above picks which is shown. */
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* ── The Board (the Roster, rebuilt 2026-11-20) ─────────────────────────
     Scratch-like blocks: hat blocks for managers, C-blocks for members wrapping
     their channels, puzzle-piece channel blocks. One hue per manager (--h). */
  .board-bar { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem 1.1rem; margin:0 0 .9rem;
               font-size:12.5px; color:var(--ink-3); }
  .board-bar .grow { flex:1 1 0; }
  .board-bar .key { display:inline-flex; align-items:center; gap:.35rem; }
  .board-bar .key i { display:inline-block; width:12px; height:12px; border-radius:3px; }
  .board-bar .key .k-gold { background:#f5c542; box-shadow:0 0 6px #f5c542; }
  .board-bar .key .k-alarm { background:#f0685a; }
  .board { position:relative; height:calc(100vh - 170px); min-height:420px; overflow:auto;
           border:1px solid var(--border); border-radius:var(--radius);
           background-color:var(--ground);
           background-image:radial-gradient(color-mix(in srgb, var(--ink-4) 45%, transparent) 1px, transparent 1.2px);
           background-size:22px 22px; cursor:grab; }
  .board.panning { cursor:grabbing; }
  .board-canvas { position:relative; min-width:100%; min-height:100%; }
  .board-canvas.tidying .mgr { transition:left .45s cubic-bezier(.2,.8,.2,1), top .45s cubic-bezier(.2,.8,.2,1); }

  .mgr { --c1:hsl(var(--h) 58% 50%); --c1d:hsl(var(--h) 52% 38%);
         --c2:hsl(var(--h) 62% 58%); --c2d:hsl(var(--h) 50% 44%);
         --c3:hsl(var(--h) 70% 64%); --c3d:hsl(var(--h) 52% 48%);
         --slot:color-mix(in srgb, var(--panel-bg) 86%, hsl(var(--h) 70% 50%));
         position:absolute; z-index:0; width:318px; box-sizing:border-box; padding:0 0 0 16px;
         background:var(--c1); border:1px solid var(--c1d); border-radius:6px 12px 12px 12px;
         color:#fff; cursor:default;
         box-shadow:0 2px 0 var(--c1d), 0 10px 28px rgb(0 0 0 / .14); }
  .mgr.nomgr { --c1:hsl(220 9% 52%); --c1d:hsl(220 9% 40%); --c3:hsl(220 10% 62%); --c3d:hsl(220 9% 46%);
               --c2:hsl(220 9% 58%); --c2d:hsl(220 9% 44%); }
  .mgr.carrying { z-index:5; box-shadow:0 2px 0 var(--c1d), 0 22px 50px rgb(0 0 0 / .28); scale:1.015; }
  .hat { position:relative; padding:14px 12px 10px 0; cursor:grab; touch-action:none; }
  .hat::before { content:''; position:absolute; z-index:-1; left:-17px; top:-17px; width:136px; height:44px;
                 background:var(--c1); border:1px solid var(--c1d); border-bottom:0;
                 border-radius:50% 50% 0 0 / 100% 100% 0 0; }
  .hat-name { display:block; font-size:15px; font-weight:800; letter-spacing:-.01em;
              text-shadow:0 1px 0 rgb(0 0 0 / .18); }
  .hat-meta { display:block; font-size:11.5px; opacity:.88; margin-top:1px; }

  .members { background:var(--slot); border:1px solid var(--c1d); border-right:0; border-radius:8px 0 0 8px;
             padding:10px; min-height:44px; display:flex; flex-direction:column; gap:12px; }
  .members:empty::after { content:'No members yet'; color:var(--ink-3); font-size:12px; padding:4px 2px; }
  .add-mem { all:unset; display:block; font-size:12px; font-weight:600; opacity:.85; padding:7px 0 0; cursor:pointer; }
  .add-mem:hover, .add-mem:focus-visible { opacity:1; text-decoration:underline; }
  .add-mem-form { display:flex; gap:.35rem; padding:7px 10px 0 0; }
  .add-mem-form input { flex:1; min-width:0; font:inherit; font-size:12.5px; padding:.3rem .5rem; border-radius:5px;
                        border:1px solid var(--c1d); background:#fff; color:#222; }
  .add-mem-form button { font-size:12px; }
  .mgr-foot { padding:10px 12px 12px 0; }
  .tray-label { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; opacity:.85;
                margin:0 0 6px; }
  .tray-slot { --slot:color-mix(in srgb, var(--c1d) 70%, #000); background:var(--slot); border-radius:6px;
               min-height:36px; padding:6px; box-shadow:inset 0 1px 3px rgb(0 0 0 / .25); }
  .tray-slot:empty::after { content:'Nothing loose'; display:block; font-size:11.5px; opacity:.7; padding:4px; }

  .mem { position:relative; background:var(--c2); border:1px solid var(--c2d); border-radius:4px 8px 8px 8px;
         padding:0 0 0 14px; color:#fff; }
  .mem::after { content:''; position:absolute; z-index:2; left:16px; top:100%; width:24px; height:6px;
                background:var(--c2); clip-path:polygon(0 0,100% 0,78% 100%,22% 100%); }
  .mem-top { display:flex; align-items:center; gap:.45rem; padding:8px 10px 7px 0; font-size:13px;
             font-weight:750; cursor:pointer; text-shadow:0 1px 0 rgb(0 0 0 / .15); }
  .is-admin .mem-top { cursor:grab; }
  .mem-top:focus-visible, .ch:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .mem-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mem-sum { margin-left:auto; font-size:11.5px; font-weight:600; opacity:.9; font-variant-numeric:tabular-nums;
             white-space:nowrap; }
  .mem-slot { background:var(--slot); border:1px solid var(--c2d); border-right:0; border-radius:6px 0 0 6px;
              min-height:34px; padding:6px 8px 9px; }
  .mem-slot:empty::after { content:'Drop channels here'; display:block; color:var(--ink-3); font-size:11.5px;
                           padding:6px 2px; }
  .mem-foot { height:11px; }
  .mem .star { color:#ffe680; filter:drop-shadow(0 0 4px #ffcf33); }
  .mem.gold { border-color:#f2b705; box-shadow:0 0 0 2px #f5c542, 0 0 22px rgb(245 197 66 / .6); }
  .mem.off { filter:grayscale(.85); opacity:.65; }

  .ch { position:relative; display:flex; align-items:center; gap:.5rem; min-height:32px; box-sizing:border-box;
        padding:6px 9px 6px 11px; background:var(--c3); border:1px solid var(--c3d); border-radius:5px;
        color:#fff; font-size:12.5px; font-weight:650; cursor:grab; user-select:none; touch-action:none;
        text-shadow:0 1px 0 rgb(0 0 0 / .16); transition:filter .15s, translate .15s; }
  .ch + .ch { margin-top:2px; }
  .ch::before { content:''; position:absolute; left:15px; top:-1px; width:22px; height:6px; background:var(--slot);
                clip-path:polygon(0 0,100% 0,78% 100%,22% 100%); }
  .ch::after { content:''; position:absolute; z-index:2; left:15px; top:100%; width:22px; height:6px;
               background:var(--c3); clip-path:polygon(0 0,100% 0,78% 100%,22% 100%); }
  .ch:hover { filter:brightness(1.07); translate:0 -1px; }
  .is-exec .ch { cursor:pointer; }
  .ch-name { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ch.no-target .ch-name { flex:1 1 auto; }
  .ch-bar { flex:1 1 auto; min-width:28px; height:6px; border-radius:3px; background:rgb(0 0 0 / .2); overflow:hidden; }
  .ch-bar i { display:block; height:100%; border-radius:3px; background:#fff; transition:width .7s cubic-bezier(.2,.8,.2,1); }
  .ch-n { flex:0 0 auto; font-size:11.5px; font-variant-numeric:tabular-nums; }
  .ch-n.dim { opacity:.8; font-weight:550; }
  .ch-tick { flex:0 0 auto; display:grid; place-items:center; width:16px; height:16px; border-radius:50%;
             background:#fff; color:var(--c3d); font-size:10px; font-weight:900; text-shadow:none; }
  .ch.alarm { border-color:#f0685a; animation:alarm 1.6s ease-in-out infinite; }
  @keyframes alarm { 0%,100% { box-shadow:0 0 0 0 rgb(240 104 90 / 0); }
                     50% { box-shadow:0 0 0 4px rgb(240 104 90 / .6); } }

  /* Dragging: every place a block can go glows; the one under it lights up. */
  body.dragging-ch .slot { outline:2px dashed color-mix(in srgb, #fff 55%, var(--c3)); outline-offset:-2px; }
  body.dragging-ch .slot:has(.ghost) { outline:2px solid #fff; box-shadow:0 0 0 4px color-mix(in srgb, var(--c3) 70%, transparent), inset 0 0 0 999px rgb(255 255 255 / .06); }
  body.dragging-mem .members { outline:2px dashed color-mix(in srgb, #fff 55%, var(--c2)); outline-offset:-2px; }
  body.dragging-mem .members:has(.ghost) { outline:2px solid #fff; }
  .ghost { opacity:.35; }
  .lifted { rotate:-3deg; scale:1.06; opacity:1 !important; cursor:grabbing !important;
            box-shadow:0 16px 34px rgb(0 0 0 / .32) !important; }
  .landed { animation:land .55s cubic-bezier(.2,.8,.2,1); }
  @keyframes land { 0% { scale:1.14; } 35% { scale:.94; } 65% { scale:1.04; } 100% { scale:1; } }

  /* Cards: a channel's targets and move, a member's name and state. */
  .modal.blk { --c2:hsl(var(--h) 62% 52%); --c3:hsl(var(--h) 66% 56%);
               max-width:400px; padding:0; overflow:hidden; }
  .modal.blk.grey { --c2:hsl(220 9% 52%); --c3:hsl(220 9% 52%); }
  .blk-head { padding:1rem 1.1rem .85rem; color:#fff; background:var(--c3, #888);
              text-shadow:0 1px 0 rgb(0 0 0 / .18); }
  .blk-head.mem-head { background:var(--c2, #888); }
  .blk-head h2 { margin:0; font-size:16px; }
  .blk-head .sub { font-size:12px; opacity:.92; margin-top:.2rem; }
  .blk-body { padding:1rem 1.1rem 1.1rem; }
  .blk-body h3 { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
                 color:var(--ink-3); margin:0 0 .55rem; }
  .blk-body section + section { margin-top:1.1rem; }
  .blk-row { display:flex; gap:.45rem; align-items:center; }
  .blk-row select, .blk-row input[type="text"] { flex:1; min-width:0; font:inherit; font-size:13px;
      padding:.4rem .55rem; border-radius:var(--radius-sm); border:1px solid var(--border);
      background:var(--panel-bg); color:inherit; }
  .blk-today { font-size:13px; font-variant-numeric:tabular-nums; }
  .blk-today .met { color:var(--color-ok); font-weight:600; }
  .blk-today .short { color:var(--color-err); font-weight:600; }
  .blk-chs { display:flex; flex-wrap:wrap; gap:.3rem; }
  .blk .modal-actions { margin-top:1rem; }

  .confetti { position:fixed; z-index:80; width:8px; height:12px; border-radius:2px; pointer-events:none; }

  @media (prefers-reduced-motion: reduce) {
    .ch.alarm, .landed { animation:none; }
    .lifted { rotate:0deg; scale:1; }
    .board-canvas.tidying .mgr { transition:none; }
  }

  /* Uploads grid (#151): rows × IST days, one number per cell, shaded by
     how busy the cell is; the Shorts / long-form split is a filter, and a
     hover card spells it out. */
  .up-bar { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem 1rem; margin:0 0 1.4rem; }
  .up-bar .chip-bar { margin:0; }
  .up-bar .grow { flex:1 1 0; }
  .up-custom { display:flex; align-items:center; gap:.35rem; font-size:12px; color:var(--ink-3); }
  .up-custom[hidden], #up-manager[hidden] { display:none; }
  .up-custom input[type="date"] {
    font:inherit; font-size:12.5px; padding:.3rem .5rem; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--panel-bg); color:inherit;
  }
  .up-sep { width:1px; height:18px; background:var(--border); }

  .up-summary { display:flex; flex-wrap:wrap; align-items:flex-end; gap:.4rem 2rem;
                margin:0 0 1rem; font-variant-numeric:tabular-nums; }
  .up-summary .big { font-size:28px; font-weight:700; letter-spacing:-.02em; line-height:1; }
  .up-summary .big-u { font-size:14px; font-weight:600; color:var(--ink-3); margin-left:.3rem; }
  .up-summary .range { font-size:13px; color:var(--ink-3); margin-top:.35rem; }
  .up-stats { display:flex; gap:1.6rem; }
  .up-stat { display:grid; gap:2px; }
  .up-stat b { font-size:16px; font-weight:650; }
  .up-stat span { font-size:11.5px; color:var(--ink-3); }
  .up-summary .fresh { margin-left:auto; font-size:12px; color:var(--ink-3); text-align:right; }
  .up-summary .fresh .stale { color:var(--color-warn); }

  .grid-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);
               background:var(--panel-bg); }
  table.up { border-collapse:separate; border-spacing:0; font-size:13px;
             font-variant-numeric:tabular-nums; width:100%; }
  table.up th, table.up td { padding:0; text-align:center; white-space:nowrap;
                             border-bottom:1px solid var(--border-soft); }
  table.up tbody tr:last-child td { border-bottom:0; }
  table.up thead th { padding:.55rem .4rem; font-size:11px; font-weight:500; color:var(--ink-4);
                      border-bottom:1px solid var(--border); vertical-align:bottom; }
  table.up thead th .d { font-size:13px; font-weight:600; color:var(--ink-2); }
  table.up thead th .w { font-size:11.5px; color:var(--ink-4); margin-left:.25rem; }
  table.up thead th.today .d { color:var(--color-accent); }
  table.up thead th.today { box-shadow:inset 0 -2px 0 var(--color-accent); }
  table.up thead th.future .d { color:var(--ink-3); font-weight:500; }
  table.up th.name, table.up td.name {
    text-align:left; position:sticky; left:0; z-index:1; background:var(--panel-bg);
    padding:.5rem .9rem; min-width:9rem; border-right:1px solid var(--border-soft);
  }
  table.up td.name .sub { display:block; font-size:11px; color:var(--ink-4); }
  table.up td.name .warn-dot { display:inline-block; width:6px; height:6px; border-radius:50%;
                               background:var(--color-warn); margin-left:.4rem; vertical-align:middle; }
  table.up tr.idle td.name .label { color:var(--ink-3); }
  table.up tr.off td.name .label, table.up tr.unassigned td.name .label { color:var(--ink-3); font-style:italic; }

  /* A day cell: the count on a tint whose strength is the cell's share of the
     busiest cell in view (--h, 0..1). */
  table.up td.day { min-width:3rem; height:2.4rem; padding:3px 2px; }
  table.up td.day > * { display:flex; align-items:center; justify-content:center;
                        width:100%; height:2.1rem; box-sizing:border-box; border-radius:5px; }
  table.up td.day .hit {
    background:color-mix(in srgb, var(--color-accent) calc(6% + var(--h) * 42%), transparent);
    font-weight:600;
  }
  table.up td.day.future .hit {
    background:repeating-linear-gradient(135deg, transparent 0 4px, var(--surface-faint) 4px 8px),
               color-mix(in srgb, var(--color-accent) calc(4% + var(--h) * 22%), transparent);
    color:var(--ink-2); font-weight:500;
  }
  table.up td.day .nil { color:var(--ink-4); opacity:.5; }
  /* Below target: red, stronger the further short of it (--m, 0..1). */
  table.up td.day .hit.miss, table.up td.day button.hit.miss {
    background:color-mix(in srgb, var(--color-err) calc(14% + var(--m) * 46%), transparent);
    color:var(--ink-1, inherit); font-weight:600; }
  table.up td.day button.hit { all:unset; display:flex; align-items:center; justify-content:center;
    width:100%; height:2.1rem; border-radius:5px; cursor:pointer; font-weight:600;
    background:color-mix(in srgb, var(--color-accent) calc(6% + var(--h) * 42%), transparent); }
  table.up td.day.future button.hit {
    background:repeating-linear-gradient(135deg, transparent 0 4px, var(--surface-faint) 4px 8px),
               color-mix(in srgb, var(--color-accent) calc(4% + var(--h) * 22%), transparent);
    color:var(--ink-2); font-weight:500; }
  table.up td.day button.hit:hover { box-shadow:inset 0 0 0 1px var(--color-accent); }
  table.up td.day button.hit:focus-visible { outline:2px solid var(--color-accent); outline-offset:-2px; }

  table.up th.sum, table.up td.sum { border-left:1px solid var(--border); padding:.45rem .9rem;
                                     text-align:right; min-width:5.5rem; }
  table.up td.sum b { font-size:14px; }
  table.up tfoot td { border-top:1px solid var(--border); border-bottom:0; color:var(--ink-3);
                      font-weight:600; height:2.2rem; background:var(--surface-faint); }
  table.up tfoot td.name { background:var(--panel-bg); }
  /* The hover card over a count: its total and Shorts / long-form split. */
  .hovercard { position:fixed; z-index:50; pointer-events:none; min-width:12.5rem;
    padding:.75rem .85rem; border-radius:var(--radius-md); background:var(--panel-bg);
    border:1px solid var(--border); box-shadow:var(--shadow-2); font-size:12.5px;
    font-variant-numeric:tabular-nums; opacity:0; transform:translateY(4px);
    transition:opacity .12s ease-out, transform .12s ease-out; }
  .hovercard.on { opacity:1; transform:none; }
  .hovercard .hc-head { font-size:11.5px; color:var(--ink-3); margin:0 0 .35rem; }
  .hovercard .hc-total { font-size:22px; font-weight:700; letter-spacing:-.01em; line-height:1.1; }
  .hovercard .hc-total small { font-size:12px; font-weight:500; color:var(--ink-3); margin-left:.3rem; }
  .hovercard .hc-bar { display:flex; height:6px; border-radius:3px; overflow:hidden; margin:.6rem 0 .55rem;
                       background:var(--surface-tint); }
  .hovercard .hc-bar i { display:block; height:100%; }
  .hovercard .hc-row { display:flex; align-items:center; gap:.45rem; margin:.2rem 0; }
  .hovercard .hc-row .sw { width:8px; height:8px; border-radius:2px; flex:0 0 auto; }
  .hovercard .hc-row b { margin-left:auto; font-weight:600; }
  .hovercard .hc-row .pct { color:var(--ink-4); width:2.6rem; text-align:right; }
  .hovercard .hc-foot { margin:.5rem 0 0; padding:.45rem 0 0; border-top:1px solid var(--border-soft);
                        font-size:11.5px; color:var(--ink-3); }
  .hovercard .hc-target { margin:.5rem 0 0; padding:.45rem 0 0; border-top:1px solid var(--border-soft);
                          font-size:12px; color:var(--ink-3); }
  .hovercard .hc-target b { color:var(--color-err); font-weight:600; }
  .hovercard .hc-target .met { color:var(--color-ok); }
  /* The grid's member sections (2026-11-20): a head row per member with their
     totals, their channels under it; a gap row between sections. */
  table.up tbody.gap td { height:12px; padding:0; border:0; background:var(--ground); }
  table.up tbody.gap td.name { background:var(--ground); }
  table.up tr.sec-head td { background:var(--surface-faint); border-top:1px solid var(--border); }
  table.up tr.sec-head td.name { background:color-mix(in srgb, var(--panel-bg) 94%, var(--ink-4)); }
  table.up tr.sec-head td.name .label { font-weight:650; }
  table.up tr.sec-head .tog { all:unset; cursor:pointer; display:inline-grid; place-items:center; width:16px;
    height:18px; margin:0 .3rem 0 -.3rem; border-radius:3px; color:var(--ink-3); font-size:13px;
    transition:rotate .15s; }
  table.up tr.sec-head .tog:hover { background:var(--surface-tint); }
  table.up tbody.collapsed tr.sec-head .tog { rotate:-90deg; }
  table.up tbody.collapsed tr.sec-ch { display:none; }
  table.up tr.sec-head .n { font-size:11px; color:var(--ink-4); font-weight:500; margin-left:.35rem; }
  table.up tr.sec-ch td.name { padding-left:2.1rem; }
  table.up tr.sec-ch td.name .label { color:var(--ink-2); }
  table.up tr.sec-ch td.none { text-align:left; padding:.5rem .9rem; color:var(--ink-4); font-size:12px; }
  /* A day the channel was someone else's. */
  table.up td.day.not-held > span { background:repeating-linear-gradient(90deg, var(--border-soft) 0 1px, transparent 1px 6px);
    opacity:.6; }
  .hc-shorts { background:var(--color-accent); }
  .hc-long { background:var(--color-ok); }
  .up-legend { display:flex; flex-wrap:wrap; gap:.4rem 1.2rem; font-size:11.5px; color:var(--ink-4);
               margin:.6rem 0 0; }
  .up-legend .sw { display:inline-block; width:10px; height:10px; border-radius:2px;
                   vertical-align:-1px; margin-right:.3rem; }

  /* Drill-down (#152): a cell opens the videos behind it, a card grid per
     channel. */
  .modal.drill { max-width:920px; width:calc(100vw - 2rem); max-height:88vh;
                 display:flex; flex-direction:column; }
  .drill-head { margin:0 0 1rem; }
  .drill-head h2 { font-size:16px; margin:0 0 .25rem; }
  .drill-head .sub { font-size:12.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .drill-head .sub .short { color:var(--color-err); font-weight:600; }
  .drill-head .sub .met { color:var(--color-ok); font-weight:600; }
  .drill-list { overflow-y:auto; margin:0 0 1rem; padding-right:.25rem; }
  .drill-group + .drill-group { margin-top:1.4rem; }
  .drill-group h3 { display:flex; align-items:baseline; gap:.6rem; margin:0 0 .7rem;
                    font-size:13.5px; font-weight:650; }
  .drill-group h3 .n { font-size:12px; font-weight:500; color:var(--ink-3); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:.9rem; }
  .card-v { display:block; color:inherit; text-decoration:none; border-radius:var(--radius-sm); }
  .card-v .th { position:relative; aspect-ratio:16 / 9; border-radius:var(--radius-sm); overflow:hidden;
                background:var(--surface-tint); }
  .card-v .th img { width:100%; height:100%; object-fit:cover; display:block;
                    transition:transform .2s ease-out; }
  .card-v:hover .th img { transform:scale(1.03); }
  .card-v .badge { position:absolute; left:6px; bottom:6px; padding:1px 6px; border-radius:4px;
                   font-size:10.5px; font-weight:600; letter-spacing:.02em; color:#fff;
                   background:rgba(0,0,0,.72); }
  .card-v .badge.sched { left:auto; right:6px; background:var(--color-accent); }
  .card-v .t { margin:.45rem 0 0; font-size:12.5px; line-height:1.35; font-weight:500;
               display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card-v:hover .t { text-decoration:underline; }
  .drill-quiet { margin:1.4rem 0 0; font-size:12px; color:var(--ink-4); }

  /* Targets: a row per weekday, Shorts and long-form. */
  .modal.tgt { max-width:380px; }
  .tgt h2 { font-size:15px; margin:0 0 .9rem; }
  .tgt-grid { display:grid; grid-template-columns:auto 1fr 1fr; gap:.4rem .6rem; align-items:center;

  .tgt-grid input { font:inherit; font-size:13px; width:100%; box-sizing:border-box; text-align:center;
                    padding:.35rem .4rem; border-radius:var(--radius-sm); border:1px solid var(--border);
                    background:var(--panel-bg); color:inherit; font-variant-numeric:tabular-nums; }
  .tgt-grid .wk { color:var(--ink-3); }
  .tgt .copy { margin:.7rem 0 1rem; font-size:12px; }
</style>
</head>
<body>
  <div class="app-shell" id="app-shell">
  <main class="app-main">
    <header class="page-head">
      <h1 class="page-title" id="page-title">Team</h1>
    </header>

    <!-- ─── UPLOADS ─── -->
    <section class="tab-panel" data-panel="uploads" aria-label="Uploads">
      <div class="up-bar" id="up-form">
        <div class="chip-bar" id="up-range" role="group" aria-label="Dates">
          <button type="button" class="chip" data-range="7">Last 7 days</button>
          <button type="button" class="chip" data-range="30">Last 30 days</button>
          <button type="button" class="chip" data-range="next7">Next 7 days</button>
          <button type="button" class="chip" data-range="custom">Custom</button>
        </div>
        <div class="up-custom" id="up-custom" hidden>
          <input type="date" id="up-from" aria-label="From" />
          <span>to</span>
          <input type="date" id="up-to" aria-label="To" />
        </div>
        <span class="grow"></span>
        <div id="up-manager" hidden></div>
        <div class="chip-bar" id="up-kind" role="group" aria-label="Count">
          <button type="button" class="chip" data-kind="all">All</button>
          <button type="button" class="chip" data-kind="shorts">Shorts</button>
          <button type="button" class="chip" data-kind="long">Long-form</button>
        </div>
      </div>
      <div class="up-summary" id="up-summary"></div>
      <div id="up-grid"><div class="skel" data-skeleton data-rows="4"></div></div>
    </section>

    <!-- ─── BOARD (the Roster) ─── -->
    <section class="tab-panel" data-panel="roster" aria-label="Board">
      <div class="board-bar" id="board-bar">
        <span id="board-hint"></span>
        <span class="grow"></span>
        <span class="key"><i class="k-gold"></i>Every target met today</span>
        <span class="key"><i class="k-alarm"></i>Loose channel with a target</span>
        <label class="field-check" id="show-off-wrap"><input type="checkbox" id="show-off" /><span>Show deactivated</span></label>
        <button type="button" class="btn" id="tidy">Tidy up</button>
      </div>
      <div class="board" id="board"><div class="board-canvas" id="board-canvas">
        <div class="skel" data-skeleton data-rows="4" style="margin:2rem;max-width:420px"></div></div></div>
    </section>
  </main>
  </div>

  <div id="toasts" aria-live="assertive" role="alert"></div>
  <div class="hovercard" id="hovercard" role="tooltip" aria-hidden="true"></div>

<script src="/static/swr.js"></script>
<script src="/static/components.js"></script>
<script src="/static/sidebar.js"></script>
<script src="/static/vendor/Sortable.min.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? '').toString().replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ── Rail ──────────────────────────────────────────────────────────────
// The same rail as the board: its channel sections point into the channel
// last opened (Sidebar.lastChannel), or the board until one has been.
const railChannel = Sidebar.lastChannel();
const railHref = (section) => railChannel
  ? `/channel?id=${encodeURIComponent(railChannel)}#${section}` : '/';
Sidebar.mount({
  items: Sidebar.TOP_ITEMS
    .concat([{ section: '' }])
    .concat(Sidebar.CHANNEL_ITEMS.map(it => ({ ...it, href: railHref(it.id) }))),
  activeId: location.pathname === '/uploads' ? 'uploads' : 'roster',
});
fetch('/auth/channels').then(r => r.ok ? r.json() : []).then(chs => {
  Sidebar.setChannels(chs, chs.some(c => c.id === railChannel) ? railChannel : null,
                      { open: false });
}).catch(() => {});

function toast(msg, kind = 'ok', timeout = 3200) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = 0; el.style.transition = '.3s';
                     setTimeout(() => el.remove(), 300); }, timeout);
}

function confirmDialog(message, okLabel = 'Confirm') {
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true">
      <div class="modal-msg"></div>
      <div class="modal-actions">
        <button class="btn modal-cancel">Cancel</button>
        <button class="btn modal-ok"></button>
      </div></div>`;
    back.querySelector('.modal-msg').textContent = message;
    back.querySelector('.modal-ok').textContent = okLabel;
    const close = (val) => { back.remove(); document.removeEventListener('keydown', onKey); resolve(val); };
    back.querySelector('.modal-cancel').onclick = () => close(false);
    back.querySelector('.modal-ok').onclick = () => close(true);
    back.onclick = (e) => { if (e.target === back) close(false); };
    function onKey(e) { if (e.key === 'Escape') close(false); else if (e.key === 'Enter') close(true); }
    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
    back.querySelector('.modal-ok').focus();
  });
}

async function send(method, url, body) {
  const r = await fetch(url, {
    method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = j.detail;
    throw new Error(Array.isArray(d) ? (d[0] && d[0].msg) || 'invalid' : d || r.statusText);
  }
  return j;
}

// ── Page ──────────────────────────────────────────────────────────────
// One file, two rail entries: /uploads shows the grid, /team the roster.
const PAGE = location.pathname === '/uploads' ? 'uploads' : 'roster';
document.querySelectorAll('.tab-panel').forEach(p =>
  p.classList.toggle('active', p.dataset.panel === PAGE));
$('page-title').textContent = PAGE === 'uploads' ? 'Uploads' : 'Roster';
document.title = `Midas · ${PAGE === 'uploads' ? 'Uploads' : 'Roster'}`;

// ── Who is looking ────────────────────────────────────────────────────
let me = null;
const seesAll = () => me && (me.role === 'admin' || me.role === 'exec');
const isAdmin = () => me && me.role === 'admin';
const canEdit = () => me && me.role !== 'exec';
const fmtDay = (d) => d ? String(d).slice(0, 10) : '';
const WEEK = [[1, 'Mon'], [2, 'Tue'], [3, 'Wed'], [4, 'Thu'], [5, 'Fri'], [6, 'Sat'], [7, 'Sun']];

// GET /team/assignments (Uploads page): the user's visible channels and every
// assignment on them, for the drill-down's "Nothing from …" line.
let assign = { channels: [], assignments: [] };

// A toast with one action button (Undo).
function toastAction(msg, label, action, timeout = 7000) {
  const el = document.createElement('div');
  el.className = 'toast ok';
  el.style.display = 'flex'; el.style.alignItems = 'center'; el.style.gap = '.8rem';
  el.innerHTML = `<span></span><button type="button" class="btn-link"></button>`;
  el.firstChild.textContent = msg;
  const b = el.querySelector('button');
  b.textContent = label;
  let done = false;
  const go = () => { el.style.opacity = 0; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300); };
  b.onclick = () => { if (done) return; done = true; go(); action(); };
  $('toasts').appendChild(el);
  setTimeout(go, timeout);
}

// ── The Board ─────────────────────────────────────────────────────────
// GET /team/board: managers, members and channels (holder, targets, today's
// uploads). Managers are hat blocks floating on a pannable canvas (positions
// kept in this browser); members are C-blocks; channels are puzzle pieces.
// SortableJS moves the pieces; every move is one POST and a fresh read.
let B = { managers: [], members: [], channels: [], today: '' };
const NO_MGR = 'none';
const HUES = [217, 266, 24, 158, 330, 44, 192, 2, 96, 288];
const sortables = [];
let landed = null;            // the block to bounce after the next paint
let showOff = false;
try { showOff = localStorage.getItem('midas:board:showOff') === '1'; } catch {}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const hueOf = (id) => HUES[Math.max(0, B.managers.findIndex(m => m.id === id)) % HUES.length];
const mgrName = (id) => id == null ? 'No manager'
  : (B.managers.find(m => m.id === id) || {}).name || `Manager ${id}`;
const memberOf = (id) => B.members.find(m => m.id === id);
const want = (t) => t ? t.shorts + t.long_form : 0;
const metToday = (c) => c.today_target
  ? c.today.shorts >= c.today_target.shorts && c.today.long_form >= c.today_target.long_form : null;
// Uploads counted toward today's target: extra Shorts don't cover missing long-form.
const gotToday = (c) => c.today_target
  ? Math.min(c.today.shorts, c.today_target.shorts) + Math.min(c.today.long_form, c.today_target.long_form) : 0;

function chBlock(c) {
  const w = want(c.today_target), met = metToday(c);
  const alarm = c.holder_id == null && w && !met;
  const cls = `ch${met ? ' met' : ''}${alarm ? ' alarm' : ''}${w ? '' : ' no-target'}`;
  const pct = w ? Math.round(100 * gotToday(c) / w) : 0;
  const body = w
    ? `<span class="ch-bar"><i style="width:${pct}%"></i></span><span class="ch-n">${c.today.total}/${w}</span>`
    : `<span class="ch-n dim">${c.today.total ? `${c.today.total} today` : 'no target'}</span>`;
  return `<div class="${cls}" data-channel="${esc(c.id)}" tabindex="0" role="button"
      title="${esc(c.name || c.id)}" aria-label="${esc(chLabel(c.id, c.name))}: ${c.today.total} today${
      w ? ` of ${w}` : ''}. Open">
    <span class="ch-name">${esc(chLabel(c.id, c.name))}</span>${body}${
    met ? '<span class="ch-tick" aria-hidden="true">✓</span>' : ''}</div>`;
}

function memberStats(m) {
  const chans = B.channels.filter(c => c.holder_id === m.id);
  const targeted = chans.filter(c => c.today_target);
  return {
    chans,
    gold: m.is_active && targeted.length > 0 && targeted.every(metToday),
    want: targeted.reduce((a, c) => a + want(c.today_target), 0),
    got: chans.reduce((a, c) => a + c.today.total, 0),
  };
}

function memberBlock(m) {
  const s = memberStats(m);
  const sum = !m.is_active ? 'Deactivated'
    : s.want ? `${s.got}/${s.want} today` : s.chans.length ? `${s.got} today` : '';
  return `<div class="mem${m.is_active ? '' : ' off'}${s.gold ? ' gold' : ''}" data-member="${m.id}">
    <div class="mem-top" tabindex="0" role="button" aria-label="${esc(m.name)}. Open">
      <span class="mem-name">${esc(m.name)}</span>${s.gold ? '<span class="star" aria-label="every target met">★</span>' : ''}
      <span class="mem-sum">${esc(sum)}</span></div>
    <div class="slot mem-slot" data-member="${m.id}">${s.chans.map(chBlock).join('')}</div>
    <div class="mem-foot"></div></div>`;
}

function managerBlock(g) {
  const none = g.id === NO_MGR;
  const members = none ? [] : B.members.filter(m => m.manager_id === g.id && (showOff || m.is_active));
  const owned = B.channels.filter(c => none ? c.manager_id == null : c.manager_id === g.id);
  const loose = owned.filter(c => c.holder_id == null);
  const active = members.filter(m => m.is_active).length;
  const meta = none ? `${owned.length} channel${owned.length === 1 ? '' : 's'}`
    : `${active} member${active === 1 ? '' : 's'} · ${owned.length} channel${owned.length === 1 ? '' : 's'}`;
  const canAdd = canEdit() && !none && (isAdmin() || g.id === me.id);
  return `<div class="mgr${none ? ' nomgr' : ''}" data-mgr="${g.id}" style="--h:${none ? 220 : hueOf(g.id)}">
    <div class="hat" title="Drag to move this block"><span class="hat-name">${esc(g.name)}</span>
      <span class="hat-meta">${meta}</span></div>
    ${none ? '' : `<div class="members" data-mgr="${g.id}">${members.map(memberBlock).join('')}</div>
      ${canAdd ? `<button type="button" class="add-mem" data-mgr="${g.id}">+ Add member</button>` : ''}`}
    <div class="mgr-foot"><div class="tray-label">${none ? 'Channels with no manager' : 'Loose channels'}</div>
      <div class="slot tray-slot" data-tray="${g.id}">${loose.map(chBlock).join('')}</div></div>
  </div>`;
}

// ── Layout: blocks float; positions live in this browser ──────────────
const posKey = () => `midas:board:pos:${me ? me.id : 0}`;
function savedPos() { try { return JSON.parse(localStorage.getItem(posKey()) || '{}'); } catch { return {}; } }
function savePos(pos) { try { localStorage.setItem(posKey(), JSON.stringify(pos)); } catch {} }

function placeBlocks() {
  const canvas = $('board-canvas');
  const pos = savedPos();
  const COL = 318 + 40, GAP = 46, PAD = 36;
  const cols = Math.max(1, Math.floor(($('board').clientWidth - PAD) / COL));
  const heights = Array(cols).fill(PAD + 18);
  canvas.querySelectorAll('.mgr').forEach(el => {
    const p = pos[el.dataset.mgr];
    if (p) { el.style.left = p.x + 'px'; el.style.top = p.y + 'px'; return; }
    const i = heights.indexOf(Math.min(...heights));
    el.style.left = (PAD + i * COL) + 'px';
    el.style.top = heights[i] + 'px';
    heights[i] += el.offsetHeight + GAP;
  });
  sizeCanvas();
}

function sizeCanvas() {
  const canvas = $('board-canvas');
  let w = 0, h = 0;
  canvas.querySelectorAll('.mgr').forEach(el => {
    w = Math.max(w, el.offsetLeft + el.offsetWidth);
    h = Math.max(h, el.offsetTop + el.offsetHeight);
  });
  canvas.style.width = (w + 400) + 'px';
  canvas.style.height = (h + 300) + 'px';
}

// Drag a block by its hat; drag the empty canvas to pan.
(function wireCanvas() {
  const board = $('board');
  board.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const hat = e.target.closest('.hat');
    if (hat) {
      const block = hat.closest('.mgr');
      const sx = e.clientX, sy = e.clientY, ox = block.offsetLeft, oy = block.offsetTop;
      let moved = false;
      hat.setPointerCapture(e.pointerId);
      const move = (ev) => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.hypot(dx, dy) < 4) return;
        moved = true;
        block.classList.add('carrying');
        block.style.left = Math.max(0, ox + dx) + 'px';
        block.style.top = Math.max(18, oy + dy) + 'px';
      };
      const up = () => {
        hat.removeEventListener('pointermove', move);
        hat.removeEventListener('pointerup', up);
        block.classList.remove('carrying');
        if (!moved) return;
        const pos = savedPos();
        pos[block.dataset.mgr] = { x: block.offsetLeft, y: block.offsetTop };
        savePos(pos);
        sizeCanvas();
      };
      hat.addEventListener('pointermove', move);
      hat.addEventListener('pointerup', up);
      return;
    }
    if (e.target !== board && e.target !== $('board-canvas')) return;
    const sx = e.clientX, sy = e.clientY, sl = board.scrollLeft, st = board.scrollTop;
    board.classList.add('panning');
    board.setPointerCapture(e.pointerId);
    const move = (ev) => { board.scrollLeft = sl - (ev.clientX - sx); board.scrollTop = st - (ev.clientY - sy); };
    const up = () => {
      board.classList.remove('panning');
      board.removeEventListener('pointermove', move);
      board.removeEventListener('pointerup', up);
    };
    board.addEventListener('pointermove', move);
    board.addEventListener('pointerup', up);
  });
})();

$('tidy').onclick = () => {
  savePos({});
  const canvas = $('board-canvas');
  canvas.classList.add('tidying');
  placeBlocks();
  setTimeout(() => canvas.classList.remove('tidying'), 500);
};

// ── Paint ─────────────────────────────────────────────────────────────
function paintBoard() {
  sortables.splice(0).forEach(s => s.destroy());
  buildLabels(B.channels);
  document.body.classList.toggle('is-admin', !!isAdmin());
  document.body.classList.toggle('is-exec', !canEdit());
  const groups = B.managers.slice();
  if (isAdmin() || (seesAll() && B.channels.some(c => c.manager_id == null))) {
    groups.unshift({ id: NO_MGR, name: 'No manager' });
  }
  const canvas = $('board-canvas');
  canvas.innerHTML = groups.length ? groups.map(managerBlock).join('')
    : '<div class="muted" style="padding:2rem">No managers yet.</div>';
  placeBlocks();
  wireSortables();
  $('show-off').checked = showOff;
  $('show-off-wrap').hidden = !B.members.some(m => !m.is_active);
  $('board-hint').textContent = !canEdit() ? 'Read only. Click a block to see it.'
    : isAdmin() ? 'Drag channels onto people, people onto managers. Click any block to edit it.'
      : 'Drag channels onto your people. Click a block to edit it.';
  if (landed) {
    const el = canvas.querySelector(landed);
    if (el && !reduceMotion) {
      el.classList.add('landed');
      el.addEventListener('animationend', () => el.classList.remove('landed'), { once: true });
    }
    landed = null;
  }
  celebrate();
}

function wireSortables() {
  if (!canEdit() || typeof Sortable === 'undefined') return;
  const common = {
    sort: false, animation: 220, easing: 'cubic-bezier(.2,.8,.2,1.15)',
    forceFallback: true, fallbackOnBody: true, fallbackTolerance: 4,
    ghostClass: 'ghost', chosenClass: 'chosen', dragClass: 'lifted', fallbackClass: 'lifted',
  };
  document.querySelectorAll('#board-canvas .slot').forEach(el => {
    const m = el.dataset.member ? memberOf(Number(el.dataset.member)) : null;
    sortables.push(Sortable.create(el, {
      ...common,
      group: { name: 'ch', pull: true, put: !m || m.is_active },
      onStart: () => document.body.classList.add('dragging-ch'),
      onEnd: onChannelDrop,
    }));
  });
  if (!isAdmin()) return;
  document.querySelectorAll('#board-canvas .members').forEach(el => {
    sortables.push(Sortable.create(el, {
      ...common, group: { name: 'mem', pull: true, put: true }, handle: '.mem-top',
      draggable: '.mem',
      onStart: () => document.body.classList.add('dragging-mem'),
      onEnd: onMemberDrop,
    }));
  });
}

// ── Moves ─────────────────────────────────────────────────────────────
async function onChannelDrop(evt) {
  document.body.classList.remove('dragging-ch');
  if (evt.from === evt.to) return;
  const id = evt.item.dataset.channel;
  const to = evt.to.dataset.member
    ? { team_member_id: Number(evt.to.dataset.member) }
    : { manager_id: evt.to.dataset.tray === NO_MGR ? null : Number(evt.to.dataset.tray) };
  await moveChannel(id, to);
}

const whereTo = (after) => after.team_member_id != null
  ? (memberOf(after.team_member_id) || {}).name || 'a member'
  : after.manager_id == null ? 'No manager' : `${mgrName(after.manager_id)}'s loose channels`;
const backTo = (before) => before.team_member_id != null
  ? { team_member_id: before.team_member_id } : { manager_id: before.manager_id };

async function moveChannel(id, body, undo = false) {
  const c = B.channels.find(x => x.id === id);
  const label = chLabel(id, c && c.name);
  try {
    const res = await send('POST', `/channels/${encodeURIComponent(id)}/move`, body);
    landed = `.ch[data-channel="${CSS.escape(id)}"]`;
    await loadBoard();
    if (!res.changed) return;
    if (undo) { toast(`${label} is back with ${whereTo(res.after)}.`); return; }
    toastAction(`${label} → ${whereTo(res.after)}`, 'Undo', () => moveChannel(id, backTo(res.before), true));
  } catch (err) {
    toast(`Could not move ${label}: ${err.message}`, 'err');
    await loadBoard();
  }
}

async function onMemberDrop(evt) {
  document.body.classList.remove('dragging-mem');
  if (evt.from === evt.to) return;
  await moveMember(Number(evt.item.dataset.member), Number(evt.to.dataset.mgr));
}

// Moving a member leaves their channels with their manager, unheld from
// today; undo moves them back and hands the same channels back.
async function moveMember(id, toManager, giveBack = null) {
  const m = memberOf(id);
  const from = m.manager_id;
  if (from === toManager) { await loadBoard(); return; }
  const held = B.channels.filter(c => c.holder_id === id);
  if (!giveBack && held.length) {
    const names = held.map(c => chLabel(c.id, c.name)).join(', ');
    const ok = await confirmDialog(
      `Move ${m.name} to ${mgrName(toManager)}? Their ${held.length === 1 ? 'channel' : `${held.length} channels`} (${names}) ` +
      `stay${held.length === 1 ? 's' : ''} with ${mgrName(from)}, unassigned from today.`, 'Move');
    if (!ok) { await loadBoard(); return; }
  }
  try {
    await send('PATCH', `/team/members/${id}`, { manager_id: toManager });
    for (const cid of giveBack || []) {
      await send('POST', `/channels/${encodeURIComponent(cid)}/move`, { team_member_id: id }).catch(() => {});
    }
    landed = `.mem[data-member="${id}"]`;
    await loadBoard();
    if (giveBack) { toast(`${m.name} is back with ${mgrName(toManager)}.`); return; }
    toastAction(`${m.name} → ${mgrName(toManager)}`, 'Undo',
      () => moveMember(id, from, held.map(c => c.id)));
  } catch (err) {
    toast(`Could not move ${m.name}: ${err.message}`, 'err');
    await loadBoard();
  }
}

// ── Gold and confetti ─────────────────────────────────────────────────
// A member who meets every target today turns gold; the first time a day in
// this browser, confetti.
function celebrate() {
  const key = `midas:board:gold:${B.today}`;
  let seen = [];
  try { seen = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}
  const fresh = Array.from(document.querySelectorAll('#board-canvas .mem.gold'))
    .filter(el => !seen.includes(el.dataset.member));
  if (!fresh.length) return;
  try { localStorage.setItem(key, JSON.stringify(seen.concat(fresh.map(el => el.dataset.member)))); } catch {}
  if (reduceMotion) return;
  fresh.forEach((el, i) => setTimeout(() => confetti(el), 250 + i * 180));
}

function confetti(el) {
  const r = el.getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight) return;
  const colors = ['#f5c542', '#4c97ff', '#9966ff', '#59c059', '#ff8c1a', '#ff6680', '#5cb1d6'];
  for (let i = 0; i < 34; i++) {
    const bit = document.createElement('span');
    bit.className = 'confetti';
    bit.style.background = colors[i % colors.length];
    bit.style.left = (r.left + r.width / 2) + 'px';
    bit.style.top = (r.top + 18) + 'px';
    document.body.appendChild(bit);
    const angle = -Math.PI / 2 + (Math.random() - .5) * 2.2;
    const speed = 140 + Math.random() * 180;
    const dx = Math.cos(angle) * speed, dy = Math.sin(angle) * speed;
    const spin = (Math.random() - .5) * 900;
    bit.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: `translate(${dx * .7}px, ${dy * .7}px) rotate(${spin / 2}deg)`, opacity: 1, offset: .45 },
      { transform: `translate(${dx}px, ${dy + 260}px) rotate(${spin}deg)`, opacity: 0 },
    ], { duration: 1300 + Math.random() * 500, easing: 'cubic-bezier(.2,.6,.4,1)' })
      .onfinish = () => bit.remove();
  }
}

// ── Cards ─────────────────────────────────────────────────────────────
// ``hue`` null: the grey of "No manager".
function card(html, hue, onKey) {
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `<div class="modal blk${hue == null ? ' grey' : ''}" role="dialog" aria-modal="true"
    style="--h:${hue ?? 220}">${html}</div>`;
  const box = back.firstChild;
  const close = () => { back.remove(); document.removeEventListener('keydown', key); };
  function key(e) { if (e.key === 'Escape') close(); else if (onKey) onKey(e); }
  back.addEventListener('click', (e) => { if (e.target === back) close(); });
  document.addEventListener('keydown', key);
  document.body.appendChild(back);
  return { box, close };
}

function openChannel(id) {

  const part = (got, w, word) => !w ? '' : `<span class="${got >= w ? 'met' : 'short'}">${got}/${w} ${word}</span>`;

  }).join('') + (isAdmin() ? `<option value="t:"${c.holder_id == null && c.manager_id == null ? ' selected' : ''}>No manager</option>` : '');

    <div class="blk-head"><h2>${esc(c.name || c.id)}</h2><div class="sub">${esc(where)}</div></div>

      <section><h3>Today</h3><div class="blk-today">${today}</div></section>

            <input type="number" min="0" max="500" inputmode="numeric" data-d="${d}" data-k="shorts"

            <input type="number" min="0" max="500" inputmode="numeric" data-d="${d}" data-k="long_form"

        </div>
        ${canEdit() ? '<button type="button" class="btn-link copy">Copy Monday to every day</button>' : ''}
      </section>
      ${canEdit() ? `<section><h3>Move to</h3><div class="blk-row">

        <button type="button" class="btn move-go">Move</button></div></section>` : ''}
      <div class="modal-actions"><button class="btn modal-cancel">Close</button>${
        canEdit() ? '<button class="btn btn-primary modal-ok">Save target</button>' : ''}</div>
    </div>`, c.manager_id == null ? null : hueOf(c.manager_id),
    (e) => { if (e.key === 'Enter' && e.target.matches('.tgt-grid input')) save(); });

  box.querySelector('.copy').onclick = () => WEEK.forEach(([d]) => ['shorts', 'long_form']

  async function save() {

// ── Uploads grid (#151) ───────────────────────────────────────────────
// GET /team/uploads is scoped: a manager gets their own channels and members;
// admin and exec every channel, narrowed by the manager filter. Days are IST.
const MAX_DAYS = 92;
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
let upManager = '';          // admin/exec: '' = every manager
// Member sections folded shut, remembered per browser.
let upCollapsed = new Set();
try { upCollapsed = new Set(JSON.parse(localStorage.getItem('midas:team:upCollapsed') || '[]')); } catch {}

function istToday() {
  // en-CA formats as YYYY-MM-DD.
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());
}

function addDays(iso, n) {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

// The date range: a preset chip, or Custom (the two date inputs).
let upRange = '7';
function setRange(range) {
  upRange = range;
  const today = istToday();
  if (range === '7' || range === '30') {
    $('up-from').value = addDays(today, -(Number(range) - 1));
    $('up-to').value = today;
  } else if (range === 'next7') {
    $('up-from').value = today;
    $('up-to').value = addDays(today, 6);
  }
  $('up-custom').hidden = range !== 'custom';
  document.querySelectorAll('#up-range .chip').forEach(c =>
    c.setAttribute('aria-pressed', String(c.dataset.range === range)));
}

function ago(iso) {
  if (!iso) return null;
  const h = (Date.now() - new Date(iso).getTime()) / 3600e3;
  if (h < 1) return 'under an hour';
  if (h < 48) return `${Math.floor(h)}h`;
  return `${Math.floor(h / 24)} days`;
}

// The routine sync runs every 6 hours; older than that is worth a look.
const isStale = (c) => !c.last_synced_at || Date.now() - new Date(c.last_synced_at) > 6 * 3600e3;

// Every channel is "Taarak Mehta Ka Ooltah Chashmah <something>": drop the
// words all the names share, and the generic ones, so the row says
// "Marathi". The full name stays in the tooltip.
const GENERIC = new Set(['baalgeet', 'balgeet', 'rhymes', 'nursery', '/', '-', '|']);
let channelLabels = new Map();
function buildLabels(channels) {
  const words = channels.map(c => (c.name || c.id).split(/\s+/));
  let n = 0;
  if (words.length > 1) {
    while (words.every(w => w.length > n + 1 && w[n].toLowerCase() === words[0][n].toLowerCase())) n++;
  }
  channelLabels = new Map(channels.map((c, i) => {
    const rest = words[i].slice(n);
    const core = rest.filter(w => !GENERIC.has(w.toLowerCase()));
    return [c.id, (core.length ? core : rest).join(' ') || c.name || c.id];
  }));
}
const chLabel = (id, fallback) => channelLabels.get(id) || fallback || id;

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dayParts = (iso) => {
  const d = new Date(iso + 'T00:00:00Z');
  return { dow: DOW[d.getUTCDay()], day: d.getUTCDate(), mon: MONTHS[d.getUTCMonth()] };
};
function fmtRange(from, to) {
  const a = dayParts(from), b = dayParts(to);
  if (from === to) return `${a.dow} ${a.day} ${a.mon}`;
  return a.mon === b.mon ? `${a.day}–${b.day} ${b.mon}` : `${a.day} ${a.mon} – ${b.day} ${b.mon}`;
}

// How far below target a finished day is, for the count in view: the
// shortfall's share of the target (0..1), or 0 when met / no target. "All"
// misses when either type does.
function shortfall(c, t) {
  if (!t) return 0;
  const s = (c && c.shorts) || 0, l = (c && c.long_form) || 0;
  const [gap, want] = upKind === 'shorts' ? [Math.max(0, t.shorts - s), t.shorts]
    : upKind === 'long' ? [Math.max(0, t.long_form - l), t.long_form]
    : [Math.max(0, t.shorts - s) + Math.max(0, t.long_form - l), t.shorts + t.long_form];
  return want ? gap / want : 0;
}

let upKind = 'all';          // all | shorts | long
try { const k = localStorage.getItem('midas:team:upKind'); if (['shorts', 'long'].includes(k)) upKind = k; } catch {}
const count = (c) => !c ? 0 : upKind === 'shorts' ? c.shorts : upKind === 'long' ? c.long_form : c.total;
const KIND_WORD = { all: 'uploads', shorts: 'Shorts', long: 'long-form videos' };

function paintSummary(data, rows) {
  const holder = $('up-summary');
  const sum = { total: 0, shorts: 0, long_form: 0 };
  const perDay = {};
  rows.forEach(r => {
    ['total', 'shorts', 'long_form'].forEach(k => { sum[k] += r.total[k]; });
    data.days.forEach(d => { perDay[d] = (perDay[d] || 0) + count(r.days[d]); });
  });
  const today = istToday();
  // Whole days only: today is still filling up.
  const past = data.days.filter(d => d < today);
  const busiest = past.reduce((a, d) => (perDay[d] > (perDay[a] ?? -1) ? d : a), null);
  const idle = (data.channel_rows || []).filter(r => !r.total.total);
  const stale = data.channels.filter(isStale);
  const synced = data.channels.filter(c => c.last_synced_at);
  const oldest = synced.length
    ? synced.reduce((a, b) => (a.last_synced_at < b.last_synced_at ? a : b)) : null;
  const stat = (v, label, title = '') =>
    `<div class="up-stat"${title ? ` title="${esc(title)}"` : ''}><b>${v}</b><span>${label}</span></div>`;
  const stats = [];
  if (upKind === 'all') {
    stats.push(stat(sum.shorts, 'Shorts'), stat(sum.long_form, 'Long-form'));
  }
  if (past.length > 1) {
    const avg = past.reduce((a, d) => a + perDay[d], 0) / past.length;
    stats.push(stat(avg.toFixed(avg < 10 ? 1 : 0), 'a day on average'));
  }
  if (busiest && past.length > 1) {
    const p = dayParts(busiest);
    stats.push(stat(perDay[busiest], `busiest: ${p.dow} ${p.day} ${p.mon}`));
  }
  if (data.channel_rows) {
    stats.push(stat(`${data.channel_rows.length - idle.length}/${data.channel_rows.length}`,
      'channels posted', idle.length ? 'Nothing: ' + idle.map(r => chLabel(r.channel_id, r.name)).join(', ') : ''));
  }
  const fresh = !data.channels.length ? ''
    : stale.length
      ? `<span class="stale" title="${esc(stale.map(c => `${chLabel(c.id, c.name)}: ${
          c.last_synced_at ? 'synced ' + ago(c.last_synced_at) + ' ago' : 'never synced'}`).join('\n'))}">${
          stale.length} channel${stale.length > 1 ? 's' : ''} not synced for 6h+</span>`
      : `Synced ${esc(ago(oldest.last_synced_at))} ago`;
  holder.innerHTML = `
    <div><div><span class="big">${upKind === 'all' ? sum.total : upKind === 'shorts' ? sum.shorts : sum.long_form}</span><span class="big-u">${
      KIND_WORD[upKind]}</span></div><div class="range">${esc(fmtRange(data.from, data.to))}</div></div>
    <div class="up-stats">${stats.join('')}</div>
    <div class="fresh">${fresh}</div>`;
}

// What the hover card shows for each count in the grid, keyed by data-hv.
let hoverData = [];
function hv(c, head, extra = {}) {
  hoverData.push({ c, head, ...extra });
  return hoverData.length - 1;
}
const dayLabel = (d) => { const p = dayParts(d); return `${p.dow}, ${p.mon} ${p.day}`; };

// ``target``: that day's { shorts, long_form } for the row, or null.
function dayCell(c, d, max, today, open, rowName, target) {
  const v = count(c);
  const cls = `day${d > today ? ' future' : ''}`;
  // Only a finished day can miss: today is still filling up.
  const t = d < today && target && (target.shorts || target.long_form) ? target : null;
  const m = shortfall(c, t);
  const miss = m > 0 ? ` miss" style="--m:${m.toFixed(2)}` : '';
  if (!v) {
    if (!m) return `<td class="${cls}"><span class="nil">·</span></td>`;
    return `<td class="${cls}"><span class="hit${miss}" data-hv="${
      hv(c || { total: 0, shorts: 0, long_form: 0 }, `${rowName} · ${dayLabel(d)}`, { target: t })}">0</span></td>`;
  }
  const h = max ? (v / max).toFixed(2) : 0;
  const i = hv(c, `${rowName} · ${dayLabel(d)}`, { future: d > today, click: true, target: t });
  return `<td class="${cls}"><button type="button" class="hit${miss}" style="--h:${h}" data-hv="${i}"
      data-member="${esc(open.member)}"${open.channel ? ` data-channel="${esc(open.channel)}"` : ''} data-day="${d}"
      aria-label="${c.total} videos on ${d}: ${c.shorts} Shorts, ${c.long_form} long-form. Show them">${v}</button></td>`;
}

function sumCell(c, rowName) {
  const v = count(c);
  if (!c.total) return `<td class="sum"><b>${v}</b></td>`;
  return `<td class="sum" data-hv="${hv(c, `${rowName} · ${fmtRange(upShown.from, upShown.to)}`)}"><b>${v}</b></td>`;
}

function hoverCard(i) {
  const { c, head, future, click, target } = hoverData[i];
  const pct = (n) => c.total ? Math.round(100 * n / c.total) + '%' : '';
  return `<div class="hc-head">${esc(head)}</div>
    <div class="hc-total">${c.total}<small>video${c.total === 1 ? '' : 's'}${future ? ' scheduled' : ''}</small></div>
    <div class="hc-bar"><i class="hc-shorts" style="width:${pct(c.shorts) || 0}"></i><i class="hc-long" style="width:${pct(c.long_form) || 0}"></i></div>
    <div class="hc-row"><span class="sw hc-shorts"></span>Shorts<b>${c.shorts}</b><span class="pct">${pct(c.shorts)}</span></div>
    <div class="hc-row"><span class="sw hc-long"></span>Long-form<b>${c.long_form}</b><span class="pct">${pct(c.long_form)}</span></div>
    ${target ? targetLine(c, target) : ''}
    ${future ? '<div class="hc-foot">Not live yet: goes live on this day.</div>'
      : click ? '<div class="hc-foot">Click to see the videos</div>' : ''}`;
}

function targetLine(c, t) {
  const part = (got, want, word) => {
    if (!want) return '';
    return got >= want ? `<span class="met">${got}/${want} ${word}</span>`
      : `<b>${got}/${want} ${word}</b>`;
  };
  const parts = [part(c.shorts, t.shorts, 'Shorts'), part(c.long_form, t.long_form, 'long-form')]
    .filter(Boolean);
  return `<div class="hc-target">Target: ${parts.join(' · ')}</div>`;
}

(function wireHoverCard() {
  const card = $('hovercard');
  let on = null;
  const hide = () => { on = null; card.classList.remove('on'); card.setAttribute('aria-hidden', 'true'); };
  const show = (el) => {
    if (on === el) return;
    on = el;
    card.innerHTML = hoverCard(Number(el.dataset.hv));
    const r = el.getBoundingClientRect();
    const w = card.offsetWidth, h = card.offsetHeight;
    let left = r.left + r.width / 2 - w / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
    // Above the cell, or below it when there is no room.
    const top = r.top - h - 8 >= 8 ? r.top - h - 8 : r.bottom + 8;
    card.style.left = left + 'px';
    card.style.top = top + 'px';
    card.classList.add('on');
    card.setAttribute('aria-hidden', 'false');
  };
  const grid = $('up-grid');
  grid.addEventListener('mouseover', (e) => { const el = e.target.closest('[data-hv]'); if (el) show(el); else hide(); });
  grid.addEventListener('mouseleave', hide);
  grid.addEventListener('focusin', (e) => { const el = e.target.closest('[data-hv]'); if (el) show(el); });
  grid.addEventListener('focusout', hide);
  window.addEventListener('scroll', hide, true);
})();

function paintGrid(data) {
  upShown = data;
  if (!data.channels.length) {
    $('up-summary').innerHTML = '';
    $('up-grid').innerHTML = `<div class="dt"><div class="dt-empty muted">${seesAll()
      ? 'No channels for this filter.' : 'No channels are mapped to you yet; ask the admin.'}</div></div>`;
    return;
  }
  // The full visible set, so the grid and drill-down share labels.
  buildLabels(assign.channels.length ? assign.channels : data.channels);
  hoverData = [];
  $('hovercard').classList.remove('on');
  const showMgr = seesAll() && !data.manager_id;
  const today = istToday();
  const staleIds = new Set(data.channels.filter(isStale).map(c => c.id));
  const hasTarget = (ch) => Object.values(ch.targets).some(Boolean);
  // A section per member: active ones always; others when they count or hold
  // something. Unassigned only when a channel in it counts or has a target.
  const sections = data.rows.map(r => ({
    r, channels: r.member_id == null ? r.channels.filter(ch => ch.total.total || hasTarget(ch)) : r.channels,
  })).filter(({ r, channels }) => r.member_id == null ? channels.length > 0
    : r.is_active || r.total.total || channels.length);
  paintSummary(data, data.rows);

  let maxM = 0, maxC = 0;
  sections.forEach(({ r, channels }) => data.days.forEach(d => {
    maxM = Math.max(maxM, count(r.days[d]));
    channels.forEach(ch => { if (ch.days[d]) maxC = Math.max(maxC, count(ch.days[d])); });
  }));
  const head = data.days.map(d => {
    const p = dayParts(d);
    const cls = d === today ? 'today' : d > today ? 'future' : '';
    return `<th scope="col" class="${cls}"${d === today ? ' title="Today"' : ''}><span class="d">${p.mon} ${p.day}</span><span class="w">${p.dow}</span></th>`;
  }).join('');
  const add = (cs) => cs.reduce((a, c) => ({ total: a.total + (c?.total || 0),
    shorts: a.shorts + (c?.shorts || 0), long_form: a.long_form + (c?.long_form || 0) }),
    { total: 0, shorts: 0, long_form: 0 });
  const foot = data.days.map(d => {
    const c = add(data.rows.map(r => r.days[d]));
    const v = count(c);
    return v ? `<td class="day" data-hv="${hv(c, `All · ${dayLabel(d)}`, { future: d > today })}">${v}</td>`
      : '<td class="day"><span class="nil">·</span></td>';
  }).join('');
  const all = add(data.rows.map(r => r.total));
  const grand = count(all);
  const hasFuture = data.days.some(d => d > today);
  const hasTargets = sections.some(({ r }) => Object.values(r.targets || {}).some(Boolean));
  const hasGaps = sections.some(({ channels }) => channels.some(ch => Object.values(ch.days).some(v => v === null)));
  const cols = data.days.length + 2;

  const body = sections.map(({ r, channels }, i) => {
    const key = String(r.member_id ?? 'u');
    const shut = upCollapsed.has(key);
    const mem = r.member_id ?? '';
    const n = channels.length;
    const name = `<button type="button" class="tog" data-toggle="${esc(key)}" aria-expanded="${!shut}"
        aria-label="${shut ? 'Show' : 'Hide'} ${esc(r.name)}'s channels">▾</button><span class="label">${esc(r.name)}</span>${
      r.is_active ? '' : ' <span class="tag tag--off">Deactivated</span>'}<span class="n">${
      n ? `${n} channel${n === 1 ? '' : 's'}` : ''}</span>${
      showMgr && r.manager_name ? `<span class="sub">${esc(r.manager_name)}</span>` : ''}`;
    const memberRow = `<tr class="sec-head${r.member_id == null ? ' unassigned' : ''}${r.is_active ? '' : ' off'}">
      <td class="name">${name}</td>${data.days.map(d => dayCell(r.days[d], d, maxM, today,
        { member: mem }, r.name, r.targets && r.targets[d])).join('')}${sumCell(r.total, r.name)}</tr>`;
    const chRows = channels.length ? channels.map(ch => {
      const label = chLabel(ch.channel_id, ch.name);
      return `<tr class="sec-ch"><td class="name"><span class="label" title="${esc(ch.name || ch.channel_id)}">${esc(label)}</span>${
        staleIds.has(ch.channel_id) ? '<span class="warn-dot" title="Not synced for 6h+: recent uploads may be missing"></span>' : ''}</td>${
        data.days.map(d => ch.days[d] === null
          ? '<td class="day not-held" title="Someone else held this channel that day"><span></span></td>'
          : dayCell(ch.days[d], d, maxC, today, { member: mem, channel: ch.channel_id },
                    `${label} · ${r.name}`, ch.targets[d])).join('')}${sumCell(ch.total, `${label} · ${r.name}`)}</tr>`;
    }).join('') : `<tr class="sec-ch"><td class="none" colspan="${cols}">No channels${
      canEdit() ? ' (drag some onto them on the Roster board)' : ''}</td></tr>`;
    return `${i ? `<tbody class="gap" aria-hidden="true"><tr><td class="name"></td><td colspan="${cols - 1}"></td></tr></tbody>` : ''}
      <tbody class="sec${shut ? ' collapsed' : ''}">${memberRow}${chRows}</tbody>`;
  }).join('');

  $('up-grid').innerHTML = `<div class="grid-wrap"><table class="up">
      <thead><tr><th scope="col" class="name">Member · channel</th>${head}<th scope="col" class="sum">Total</th></tr></thead>
      ${body}
      <tfoot><tr><td class="name">All</td>${foot}<td class="sum"${all.total
        ? ` data-hv="${hv(all, `All · ${fmtRange(data.from, data.to)}`)}"` : ''}><b>${grand}</b></td></tr></tfoot>
    </table></div>
    <div class="up-legend"><span><span class="sw" style="background:color-mix(in srgb, var(--color-accent) 48%, transparent)"></span>Darker = more ${
      KIND_WORD[upKind]}</span>${hasFuture ? `<span><span class="sw" style="background:repeating-linear-gradient(135deg, transparent 0 3px, var(--surface-tint) 3px 6px)"></span>Hatched = scheduled, not live yet</span>` : ''}${
      hasTargets ? '<span><span class="sw" style="background:color-mix(in srgb, var(--color-err) 50%, transparent)"></span>Red = below the channel\'s target (darker = further off)</span>' : ''}${
      hasGaps ? '<span><span class="sw" style="background:repeating-linear-gradient(90deg, var(--border) 0 1px, transparent 1px 4px)"></span>Lined = someone else held the channel that day</span>' : ''}${
      staleIds.size ? '<span><span class="sw" style="background:var(--color-warn);border-radius:50%"></span>Not synced for 6h+</span>' : ''}<span>Hover for the Shorts / long-form split, click for the videos</span></div>`;
}

// ── Drill-down (#152) ─────────────────────────────────────────────────
// GET /team/uploads/videos lists the videos behind a cell, credited by the
// same rule as the grid; the grid's manager filter goes with it so the
// Unassigned list matches its cell.
let upShown = null;          // the grid last painted

function drillCard(v) {
  const href = `https://www.youtube.com/watch?v=${encodeURIComponent(v.video_id)}`;
  const thumb = v.thumbnail_url ? `<img src="${esc(v.thumbnail_url)}" loading="lazy" alt="" />` : '';
  const type = v.is_short === true ? 'Short' : v.is_short === false ? 'Long-form' : '?';
  return `<a class="card-v" href="${href}" target="_blank" rel="noopener" title="${esc(v.title || v.video_id)}">
    <div class="th">${thumb}<span class="badge">${type}</span>${
      v.status === 'scheduled' ? '<span class="badge sched">Scheduled</span>' : ''}</div>
    <div class="t">${esc(v.title || v.video_id)}</div></a>`;
}

function drillModal() {
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `<div class="modal drill" role="dialog" aria-modal="true" aria-labelledby="drill-title">
    <div class="drill-head"><h2 id="drill-title"></h2><div class="sub"></div></div>
    <div class="drill-list"><div class="skel" data-skeleton data-rows="3"></div></div>
    <div class="modal-actions"><button class="btn modal-cancel">Close</button></div></div>`;
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
  function onKey(e) { if (e.key === 'Escape') close(); }
  back.querySelector('.modal-cancel').onclick = close;
  back.addEventListener('click', (e) => { if (e.target === back) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(back);
  back.querySelector('.modal-cancel').focus();
  return back;
}

async function openDrill({ member, channel }, day) {
  const row = (upShown?.rows || []).find(r => String(r.member_id ?? '') === member);
  const ch = channel != null && row ? row.channels.find(c => c.channel_id === channel) : null;
  const back = drillModal();
  const p = dayParts(day);
  const rowName = !row ? 'Uploads' : ch ? `${chLabel(ch.channel_id, ch.name)} · ${row.name}` : row.name;
  back.querySelector('#drill-title').textContent = `${rowName} · ${p.dow} ${p.day} ${p.mon}`;
  const q = new URLSearchParams({ day });
  if (member) q.set('member_id', member);
  if (channel != null) { q.set('channel_id', channel); q.set('by_member', 'true'); }
  if (seesAll() && upShown?.manager_id) q.set('manager_id', upShown.manager_id);
  const list = back.querySelector('.drill-list');
  try {
    const r = await fetch('/team/uploads/videos?' + q);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || r.statusText);
    const shorts = j.videos.filter(v => v.is_short === true).length;
    const c = { total: j.videos.length, shorts, long_form: j.videos.length - shorts };
    const dayT = day < istToday() ? (ch ? ch.targets[day] : row && row.targets && row.targets[day]) : null;
    const t = dayT && (dayT.shorts || dayT.long_form) ? dayT : null;
    const tgt = (got, want, word) => !want ? ''
      : ` · <span class="${got >= want ? 'met' : 'short'}">${got}/${want} ${word}</span>`;
    back.querySelector('.sub').innerHTML = `${c.total} video${c.total === 1 ? '' : 's'} · ${
      shorts} Shorts / ${c.long_form} long-form${t ? ' · target' + tgt(c.shorts, t.shorts, 'Shorts')
        + tgt(c.long_form, t.long_form, 'long-form') : ''}`;
    list.innerHTML = drillGroups(j.videos, channel == null && member ? Number(member) : null, day);
  } catch (err) {
    list.innerHTML = `<em class="muted">Could not load the videos: ${esc(err.message)}</em>`;
  }
}

// The videos as a card grid per channel. For a member, the channels they
// held that day with nothing in it are named in one line underneath.
function drillGroups(videos, memberId, day) {
  const groups = new Map();
  videos.forEach(v => {
    if (!groups.has(v.channel_id)) groups.set(v.channel_id, { name: v.channel_name, videos: [] });
    groups.get(v.channel_id).videos.push(v);
  });
  const quiet = memberId == null ? [] : assign.assignments
    .filter(a => a.team_member_id === memberId && String(a.starts_on) <= day
                 && (a.ends_on == null || day < String(a.ends_on)) && !groups.has(a.channel_id))
    .map(a => chLabel(a.channel_id, (assign.channels.find(c => c.id === a.channel_id) || {}).name))
    .sort();
  const named = Array.from(groups, ([id, g]) => ({ label: chLabel(id, g.name), videos: g.videos }))
    .sort((a, b) => a.label.localeCompare(b.label));
  const html = named.map(g => {
    const shorts = g.videos.filter(v => v.is_short === true).length;
    const long = g.videos.length - shorts;
    const n = [shorts && `${shorts} Short${shorts > 1 ? 's' : ''}`, long && `${long} long-form`]
      .filter(Boolean).join(' · ');
    return `<div class="drill-group"><h3>${esc(g.label)}<span class="n">${n}</span></h3>
      <div class="cards">${g.videos.map(drillCard).join('')}</div></div>`;
  }).join('');
  return (html || '<em class="muted">No uploads.</em>')
    + (quiet.length ? `<div class="drill-quiet">Nothing from ${esc(quiet.join(', '))}</div>` : '');
}

$('up-grid').addEventListener('click', (e) => {
  const tog = e.target.closest('button.tog');
  if (tog) {
    const key = tog.dataset.toggle;
    if (upCollapsed.has(key)) upCollapsed.delete(key); else upCollapsed.add(key);
    try { localStorage.setItem('midas:team:upCollapsed', JSON.stringify([...upCollapsed])); } catch {}
    const sec = tog.closest('tbody');
    sec.classList.toggle('collapsed', upCollapsed.has(key));
    tog.setAttribute('aria-expanded', String(!upCollapsed.has(key)));
    return;
  }
  const b = e.target.closest('button.hit');
  if (b) openDrill({ member: b.dataset.member, channel: b.dataset.channel }, b.dataset.day);
});

function paintManagerFilter(managers) {
  const holder = $('up-manager');
  if (!seesAll()) { holder.hidden = true; return; }
  const opts = [{ value: '', label: 'All managers' }]
    .concat(managers.map(m => ({ value: String(m.id), label: m.name })));
  holder.hidden = false;
  holder.innerHTML = '';
  holder.dataset.dropdown = '';
  holder.dataset.label = 'Manager';
  holder.dataset.value = upManager;
  holder.dataset.options = JSON.stringify(opts);
  delete holder.dataset.cmpWired;
  Components.init(holder.parentNode);
}

async function loadUploads() {
  const from = $('up-from').value, to = $('up-to').value;
  if (!from || !to) return;
  if (to < from) { toast('"To" is before "From".', 'warn'); return; }
  if ((new Date(to) - new Date(from)) / 864e5 + 1 > MAX_DAYS) {
    toast(`Pick at most ${MAX_DAYS} days.`, 'warn'); return;
  }
  const q = new URLSearchParams({ from, to });
  if (seesAll() && upManager) q.set('manager_id', upManager);
  try {
    const r = await fetch('/team/uploads?' + q);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || r.statusText);
    paintManagerFilter(j.managers || []);
    paintGrid(j);
  } catch (err) {
    $('up-grid').innerHTML = `<em class="muted">Could not load the uploads: ${esc(err.message)}</em>`;
  }
}

$('up-range').addEventListener('click', (e) => {
  const c = e.target.closest('.chip');
  if (!c) return;
  setRange(c.dataset.range);
  if (c.dataset.range === 'custom') $('up-from').focus();
  else loadUploads();
});
['up-from', 'up-to'].forEach(id => $(id).addEventListener('change', () => {
  if (upRange === 'custom') loadUploads();
}));
function paintKind() {
  document.querySelectorAll('#up-kind .chip').forEach(c =>
    c.setAttribute('aria-pressed', String(c.dataset.kind === upKind)));
}
$('up-kind').addEventListener('click', (e) => {
  const c = e.target.closest('.chip');
  if (!c || c.dataset.kind === upKind) return;
  upKind = c.dataset.kind;
  try { localStorage.setItem('midas:team:upKind', upKind); } catch {}
  paintKind();
  if (upShown) paintGrid(upShown);
});
paintKind();
$('up-manager').addEventListener('change', (e) => {
  if (e.detail && 'value' in e.detail) { upManager = e.detail.value; loadUploads(); }
});

setRange('7');
(async () => {
  const r = await fetch('/session/me').catch(() => null);
  me = r && r.ok ? await r.json() : null;
  if (PAGE === 'uploads') {
    const a = await fetch('/team/assignments').catch(() => null);
    assign = a && a.ok ? await a.json() : assign;
    buildLabels(assign.channels);
    loadUploads();
  } else {
    loadBoard();
  }
})();
</script>
