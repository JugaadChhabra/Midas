<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Midas · Team</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/static/theme.css" />
<link rel="icon" type="image/png" href="/static/midas.png" />
<link rel="apple-touch-icon" href="/static/midas.png" />
<style>
  body { margin:0; background:var(--ground); }

  /* One panel per tab; the chip bar above picks which is shown. */
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  .add-row { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; margin:0 0 1.2rem; }
  .add-row input, .dt-row input.rename {
    font:inherit; font-size:13px; padding:.45rem .6rem; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--panel-bg); color:inherit; min-width:14rem;
  }
  .dt { --dt-cols: minmax(9rem, 14rem) minmax(10rem, 1fr) 7rem 22rem; }
  .dt-row .acts { display:flex; gap:.35rem; justify-content:flex-end; }
  .dt-row .chs { display:flex; flex-wrap:wrap; gap:.3rem; }
  .dt-row .chs .none { color:var(--ink-4); }
  .dt-row.off .name { color:var(--ink-4); }
  .show-off { margin:0 0 1rem; }
  .show-off[hidden], #add-manager[hidden] { display:none; }

  .group-head .mgr-chs { font-size:12px; font-weight:400; color:var(--ink-3); text-transform:none;
                         letter-spacing:0; }
  .group-head button { font-size:12px; }
  .group .dt-empty { padding:.6rem .9rem; }

  /* The channel picker: a member's channels, or (admin) a manager's. */
  .modal.pick { max-width:460px; max-height:85vh; display:flex; flex-direction:column; }
  .pick h2 { font-size:15px; margin:0 0 .8rem; }
  .pick-list { overflow-y:auto; margin:0 0 1rem; border:1px solid var(--border-soft);
               border-radius:var(--radius-sm); }
  .pick-row { display:flex; align-items:center; gap:.6rem; padding:.55rem .75rem; font-size:13px;
              cursor:pointer; border-bottom:1px solid var(--border-soft); }
  .pick-row:last-child { border-bottom:0; }
  .pick-row:hover { background:var(--surface-faint); }
  .pick-row .note { margin-left:auto; font-size:11.5px; color:var(--ink-4); }
  .pick-row .note.move { color:var(--color-warn); }
  .pick-empty { padding:1rem; font-size:13px; color:var(--ink-3); }

  /* Uploads grid (#151): rows × IST days, one number per cell, shaded by
     how busy the cell is; the Shorts / long-form split is a filter, and a
     hover card spells it out. */
  .up-bar { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem 1rem; margin:0 0 1.4rem; }
  .up-bar .chip-bar { margin:0; }
  .up-bar .grow { flex:1 1 0; }
  .up-custom { display:flex; align-items:center; gap:.35rem; font-size:12px; color:var(--ink-3); }
  .up-custom[hidden], #up-manager[hidden] { display:none; }
  .up-custom input[type="date"] {
    font:inherit; font-size:12.5px; padding:.3rem .5rem; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--panel-bg); color:inherit;
  }
  .up-sep { width:1px; height:18px; background:var(--border); }

  .up-summary { display:flex; flex-wrap:wrap; align-items:flex-end; gap:.4rem 2rem;
                margin:0 0 1rem; font-variant-numeric:tabular-nums; }
  .up-summary .big { font-size:28px; font-weight:700; letter-spacing:-.02em; line-height:1; }
  .up-summary .big-u { font-size:14px; font-weight:600; color:var(--ink-3); margin-left:.3rem; }
  .up-summary .range { font-size:13px; color:var(--ink-3); margin-top:.35rem; }
  .up-stats { display:flex; gap:1.6rem; }
  .up-stat { display:grid; gap:2px; }
  .up-stat b { font-size:16px; font-weight:650; }
  .up-stat span { font-size:11.5px; color:var(--ink-3); }
  .up-summary .fresh { margin-left:auto; font-size:12px; color:var(--ink-3); text-align:right; }
  .up-summary .fresh .stale { color:var(--color-warn); }

  .grid-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);
               background:var(--panel-bg); }
  table.up { border-collapse:separate; border-spacing:0; font-size:13px;
             font-variant-numeric:tabular-nums; width:100%; }
  table.up th, table.up td { padding:0; text-align:center; white-space:nowrap;
                             border-bottom:1px solid var(--border-soft); }
  table.up tbody tr:last-child td { border-bottom:0; }
  table.up thead th { padding:.55rem .4rem; font-size:11px; font-weight:500; color:var(--ink-4);
                      border-bottom:1px solid var(--border); vertical-align:bottom; }
  table.up thead th .d { font-size:13px; font-weight:600; color:var(--ink-2); }
  table.up thead th .w { font-size:11.5px; color:var(--ink-4); margin-left:.25rem; }
  table.up thead th.today .d { color:var(--color-accent); }
  table.up thead th.today { box-shadow:inset 0 -2px 0 var(--color-accent); }
  table.up thead th.future .d { color:var(--ink-3); font-weight:500; }
  table.up th.name, table.up td.name {
    text-align:left; position:sticky; left:0; z-index:1; background:var(--panel-bg);
    padding:.5rem .9rem; min-width:9rem; border-right:1px solid var(--border-soft);
  }
  table.up td.name .sub { display:block; font-size:11px; color:var(--ink-4); }
  table.up td.name .warn-dot { display:inline-block; width:6px; height:6px; border-radius:50%;
                               background:var(--color-warn); margin-left:.4rem; vertical-align:middle; }
  table.up tr.idle td.name .label { color:var(--ink-3); }
  table.up tr.off td.name .label, table.up tr.unassigned td.name .label { color:var(--ink-3); font-style:italic; }

  /* A day cell: the count on a tint whose strength is the cell's share of the
     busiest cell in view (--h, 0..1). */
  table.up td.day { min-width:3rem; height:2.4rem; padding:3px 2px; }
  table.up td.day > * { display:flex; align-items:center; justify-content:center;
                        width:100%; height:2.1rem; box-sizing:border-box; border-radius:5px; }
  table.up td.day .hit {
    background:color-mix(in srgb, var(--color-accent) calc(6% + var(--h) * 42%), transparent);
    font-weight:600;
  }
  table.up td.day.future .hit {
    background:repeating-linear-gradient(135deg, transparent 0 4px, var(--surface-faint) 4px 8px),
               color-mix(in srgb, var(--color-accent) calc(4% + var(--h) * 22%), transparent);
    color:var(--ink-2); font-weight:500;
  }
  table.up td.day .nil { color:var(--ink-4); opacity:.5; }
  /* Below target: red, stronger the further short of it (--m, 0..1). */
  table.up td.day .hit.miss, table.up td.day button.hit.miss {
    background:color-mix(in srgb, var(--color-err) calc(14% + var(--m) * 46%), transparent);
    color:var(--ink-1, inherit); font-weight:600; }
  table.up td.day button.hit { all:unset; display:flex; align-items:center; justify-content:center;
    width:100%; height:2.1rem; border-radius:5px; cursor:pointer; font-weight:600;
    background:color-mix(in srgb, var(--color-accent) calc(6% + var(--h) * 42%), transparent); }
  table.up td.day.future button.hit {
    background:repeating-linear-gradient(135deg, transparent 0 4px, var(--surface-faint) 4px 8px),
               color-mix(in srgb, var(--color-accent) calc(4% + var(--h) * 22%), transparent);
    color:var(--ink-2); font-weight:500; }
  table.up td.day button.hit:hover { box-shadow:inset 0 0 0 1px var(--color-accent); }
  table.up td.day button.hit:focus-visible { outline:2px solid var(--color-accent); outline-offset:-2px; }

  table.up th.sum, table.up td.sum { border-left:1px solid var(--border); padding:.45rem .9rem;
                                     text-align:right; min-width:5.5rem; }
  table.up td.sum b { font-size:14px; }
  table.up tfoot td { border-top:1px solid var(--border); border-bottom:0; color:var(--ink-3);
                      font-weight:600; height:2.2rem; background:var(--surface-faint); }
  table.up tfoot td.name { background:var(--panel-bg); }
  /* The hover card over a count: its total and Shorts / long-form split. */
  .hovercard { position:fixed; z-index:50; pointer-events:none; min-width:12.5rem;
    padding:.75rem .85rem; border-radius:var(--radius-md); background:var(--panel-bg);
    border:1px solid var(--border); box-shadow:var(--shadow-2); font-size:12.5px;
    font-variant-numeric:tabular-nums; opacity:0; transform:translateY(4px);
    transition:opacity .12s ease-out, transform .12s ease-out; }
  .hovercard.on { opacity:1; transform:none; }
  .hovercard .hc-head { font-size:11.5px; color:var(--ink-3); margin:0 0 .35rem; }
  .hovercard .hc-total { font-size:22px; font-weight:700; letter-spacing:-.01em; line-height:1.1; }
  .hovercard .hc-total small { font-size:12px; font-weight:500; color:var(--ink-3); margin-left:.3rem; }
  .hovercard .hc-bar { display:flex; height:6px; border-radius:3px; overflow:hidden; margin:.6rem 0 .55rem;
                       background:var(--surface-tint); }
  .hovercard .hc-bar i { display:block; height:100%; }
  .hovercard .hc-row { display:flex; align-items:center; gap:.45rem; margin:.2rem 0; }
  .hovercard .hc-row .sw { width:8px; height:8px; border-radius:2px; flex:0 0 auto; }
  .hovercard .hc-row b { margin-left:auto; font-weight:600; }
  .hovercard .hc-row .pct { color:var(--ink-4); width:2.6rem; text-align:right; }
  .hovercard .hc-foot { margin:.5rem 0 0; padding:.45rem 0 0; border-top:1px solid var(--border-soft);
                        font-size:11.5px; color:var(--ink-3); }
  .hovercard .hc-target { margin:.5rem 0 0; padding:.45rem 0 0; border-top:1px solid var(--border-soft);
                          font-size:12px; color:var(--ink-3); }
  .hovercard .hc-target b { color:var(--color-err); font-weight:600; }
  .hovercard .hc-target .met { color:var(--color-ok); }
  .hc-shorts { background:var(--color-accent); }
  .hc-long { background:var(--color-ok); }
  .up-legend { display:flex; flex-wrap:wrap; gap:.4rem 1.2rem; font-size:11.5px; color:var(--ink-4);
               margin:.6rem 0 0; }
  .up-legend .sw { display:inline-block; width:10px; height:10px; border-radius:2px;
                   vertical-align:-1px; margin-right:.3rem; }

  /* Drill-down (#152): a cell opens the videos behind it, a card grid per
     channel. */
  .modal.drill { max-width:920px; width:calc(100vw - 2rem); max-height:88vh;
                 display:flex; flex-direction:column; }
  .drill-head { margin:0 0 1rem; }
  .drill-head h2 { font-size:16px; margin:0 0 .25rem; }
  .drill-head .sub { font-size:12.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .drill-head .sub .short { color:var(--color-err); font-weight:600; }
  .drill-head .sub .met { color:var(--color-ok); font-weight:600; }
  .drill-list { overflow-y:auto; margin:0 0 1rem; padding-right:.25rem; }
  .drill-group + .drill-group { margin-top:1.4rem; }
  .drill-group h3 { display:flex; align-items:baseline; gap:.6rem; margin:0 0 .7rem;
                    font-size:13.5px; font-weight:650; }
  .drill-group h3 .n { font-size:12px; font-weight:500; color:var(--ink-3); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:.9rem; }
  .card-v { display:block; color:inherit; text-decoration:none; border-radius:var(--radius-sm); }
  .card-v .th { position:relative; aspect-ratio:16 / 9; border-radius:var(--radius-sm); overflow:hidden;
                background:var(--surface-tint); }
  .card-v .th img { width:100%; height:100%; object-fit:cover; display:block;
                    transition:transform .2s ease-out; }
  .card-v:hover .th img { transform:scale(1.03); }
  .card-v .badge { position:absolute; left:6px; bottom:6px; padding:1px 6px; border-radius:4px;
                   font-size:10.5px; font-weight:600; letter-spacing:.02em; color:#fff;
                   background:rgba(0,0,0,.72); }
  .card-v .badge.sched { left:auto; right:6px; background:var(--color-accent); }
  .card-v .t { margin:.45rem 0 0; font-size:12.5px; line-height:1.35; font-weight:500;
               display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card-v:hover .t { text-decoration:underline; }
  .drill-quiet { margin:1.4rem 0 0; font-size:12px; color:var(--ink-4); }

  /* Targets: a row per weekday, Shorts and long-form. */
  .modal.tgt { max-width:380px; }
  .tgt h2 { font-size:15px; margin:0 0 .9rem; }
  .tgt-grid { display:grid; grid-template-columns:auto 1fr 1fr; gap:.4rem .6rem; align-items:center;
              font-size:13px; }
  .tgt-grid .hd { font-size:11.5px; color:var(--ink-3); text-align:center; }
  .tgt-grid input { font:inherit; font-size:13px; width:100%; box-sizing:border-box; text-align:center;
                    padding:.35rem .4rem; border-radius:var(--radius-sm); border:1px solid var(--border);
                    background:var(--panel-bg); color:inherit; font-variant-numeric:tabular-nums; }
  .tgt-grid .wk { color:var(--ink-3); }
  .tgt .copy { margin:.7rem 0 1rem; font-size:12px; }
</style>
</head>
<body>
  <div class="app-shell" id="app-shell">
  <main class="app-main">
    <header class="page-head">
      <h1 class="page-title" id="page-title">Team</h1>
    </header>

    <!-- ─── UPLOADS ─── -->
    <section class="tab-panel" data-panel="uploads" aria-label="Uploads">
      <div class="up-bar" id="up-form">
        <div class="chip-bar" id="up-range" role="group" aria-label="Dates">
          <button type="button" class="chip" data-range="7">Last 7 days</button>
          <button type="button" class="chip" data-range="30">Last 30 days</button>
          <button type="button" class="chip" data-range="next7">Next 7 days</button>
          <button type="button" class="chip" data-range="custom">Custom</button>
        </div>
        <div class="up-custom" id="up-custom" hidden>
          <input type="date" id="up-from" aria-label="From" />
          <span>to</span>
          <input type="date" id="up-to" aria-label="To" />
        </div>
        <span class="grow"></span>
        <div id="up-manager" hidden></div>
        <div class="chip-bar" id="up-kind" role="group" aria-label="Count">
          <button type="button" class="chip" data-kind="all">All</button>
          <button type="button" class="chip" data-kind="shorts">Shorts</button>
          <button type="button" class="chip" data-kind="long">Long-form</button>
        </div>
        <span class="up-sep" aria-hidden="true"></span>
        <div class="chip-bar" id="up-view" role="group" aria-label="Rows">
          <button type="button" class="chip" data-view="member">By member</button>
          <button type="button" class="chip" data-view="channel">By channel</button>
        </div>
      </div>
      <div class="up-summary" id="up-summary"></div>
      <div id="up-grid"><div class="skel" data-skeleton data-rows="4"></div></div>
    </section>

    <!-- ─── ROSTER ─── -->
    <section class="tab-panel" data-panel="roster" aria-label="Roster">
      <form class="add-row" id="add-form" autocomplete="off">
        <input id="add-name" type="text" maxlength="100" placeholder="Name"
               aria-label="New member's name" required />
        <div id="add-manager" hidden></div>
        <button class="btn-primary" type="submit" id="add-btn">Add member</button>
      </form>

      <label class="field-check show-off">
        <input type="checkbox" id="show-off" />
        <span>Show deactivated members</span>
      </label>

      <div id="roster"><div class="skel" data-skeleton data-rows="4"></div></div>
    </section>
  </main>
  </div>

  <div id="toasts" aria-live="assertive" role="alert"></div>
  <div class="hovercard" id="hovercard" role="tooltip" aria-hidden="true"></div>

<script src="/static/swr.js"></script>
<script src="/static/components.js"></script>
<script src="/static/sidebar.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? '').toString().replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ── Rail ──────────────────────────────────────────────────────────────
// The same rail as the board: its channel sections point into the channel
// last opened (Sidebar.lastChannel), or the board until one has been.
const railChannel = Sidebar.lastChannel();
const railHref = (section) => railChannel
  ? `/channel?id=${encodeURIComponent(railChannel)}#${section}` : '/';
Sidebar.mount({
  items: Sidebar.TOP_ITEMS
    .concat([{ section: '' }])
    .concat(Sidebar.CHANNEL_ITEMS.map(it => ({ ...it, href: railHref(it.id) }))),
  activeId: location.pathname === '/uploads' ? 'uploads' : 'roster',
});
fetch('/auth/channels').then(r => r.ok ? r.json() : []).then(chs => {
  Sidebar.setChannels(chs, chs.some(c => c.id === railChannel) ? railChannel : null,
                      { open: false });
}).catch(() => {});

function toast(msg, kind = 'ok', timeout = 3200) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = 0; el.style.transition = '.3s';
                     setTimeout(() => el.remove(), 300); }, timeout);
}

function confirmDialog(message, okLabel = 'Confirm') {
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true">
      <div class="modal-msg"></div>
      <div class="modal-actions">
        <button class="btn modal-cancel">Cancel</button>
        <button class="btn modal-ok"></button>
      </div></div>`;
    back.querySelector('.modal-msg').textContent = message;
    back.querySelector('.modal-ok').textContent = okLabel;
    const close = (val) => { back.remove(); document.removeEventListener('keydown', onKey); resolve(val); };
    back.querySelector('.modal-cancel').onclick = () => close(false);
    back.querySelector('.modal-ok').onclick = () => close(true);
    back.onclick = (e) => { if (e.target === back) close(false); };
    function onKey(e) { if (e.key === 'Escape') close(false); else if (e.key === 'Enter') close(true); }
    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
    back.querySelector('.modal-ok').focus();
  });
}

async function send(method, url, body) {
  const r = await fetch(url, {
    method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = j.detail;
    throw new Error(Array.isArray(d) ? (d[0] && d[0].msg) || 'invalid' : d || r.statusText);
  }
  return j;
}

// ── Page ──────────────────────────────────────────────────────────────
// One file, two rail entries: /uploads shows the grid, /team the roster.
const PAGE = location.pathname === '/uploads' ? 'uploads' : 'roster';
document.querySelectorAll('.tab-panel').forEach(p =>
  p.classList.toggle('active', p.dataset.panel === PAGE));
$('page-title').textContent = PAGE === 'uploads' ? 'Uploads' : 'Roster';
document.title = `Midas · ${PAGE === 'uploads' ? 'Uploads' : 'Roster'}`;

// ── Roster ────────────────────────────────────────────────────────────
// GET /team/members is already scoped: a manager gets their own members,
// admin and exec every member plus the managers to choose from.
let state = { members: [], managers: [] };
let me = null;
let editing = null;          // the member id whose name is being edited
let addManager = '';         // admin/exec: the manager a new member goes under

const seesAll = () => me && (me.role === 'admin' || me.role === 'exec');

function paintAddForm() {
  const holder = $('add-manager');
  if (!seesAll()) { holder.hidden = true; return; }
  const opts = [{ value: '', label: 'Choose a manager' }]
    .concat(state.managers.map(m => ({ value: String(m.id), label: m.name })));
  holder.hidden = false;
  holder.innerHTML = '';
  holder.dataset.dropdown = '';
  holder.dataset.label = 'Manager';
  holder.dataset.value = addManager;
  holder.dataset.options = JSON.stringify(opts);
  delete holder.dataset.cmpWired;
  Components.init(holder.parentNode);
}

// Channels each member holds today, from GET /team/assignments.
function heldBy(memberId) {
  return assign.assignments
    .filter(a => a.ends_on == null && a.team_member_id === memberId)
    .map(a => a.channel_id)
    .sort((a, b) => chLabel(a).localeCompare(chLabel(b)));
}

function chipList(ids) {
  return ids.length
    ? ids.map(id => {
        const ch = assign.channels.find(c => c.id === id);
        return `<span class="tag" title="${esc(ch ? ch.name : id)}">${esc(chLabel(id, ch && ch.name))}</span>`;
      }).join('')
    : '<span class="none">None</span>';
}

function memberRow(m) {
  const name = editing === m.id
    ? `<input class="rename" data-id="${m.id}" maxlength="100" value="${esc(m.name)}"
              aria-label="New name for ${esc(m.name)}" />`
    : `<span class="name">${esc(m.name)}</span>`;
  const acts = editing === m.id
    ? `<button class="btn-primary" data-act="save" data-id="${m.id}">Save</button>
       <button class="btn-link" data-act="cancel">Cancel</button>`
    : (m.is_active ? `<button data-act="channels" data-id="${m.id}">Channels</button>` : '') +
      (m.is_active && canSetTargets() ? `<button data-act="targets" data-id="${m.id}">Targets</button>` : '') +
      `<button data-act="rename" data-id="${m.id}">Rename</button>` +
      (m.is_active
        ? `<button data-act="deactivate" data-id="${m.id}">Deactivate</button>`
        : `<button data-act="reactivate" data-id="${m.id}">Reactivate</button>`);
  const status = m.is_active
    ? '<span class="pill pill--ok pill--sm">Active</span>'
    : '<span class="tag tag--off">Deactivated</span>';
  return `<div class="dt-row${m.is_active ? '' : ' off'}">
      <div>${name}</div><div class="chs">${m.is_active ? chipList(heldBy(m.id)) : ''}</div>
      <div>${status}</div><div class="acts">${acts}</div></div>`;
}

function table(members) {
  return `<div class="dt"><div class="dt-scroll"><div class="dt-body">
    <div class="dt-head"><div>Name</div><div>Channels</div><div>Status</div><div></div></div>
    ${members.map(memberRow).join('')}
  </div></div></div>`;
}

const managedBy = (managerId) => assign.channels.filter(c => c.manager_id === managerId);

function paintRoster() {
  const showOff = $('show-off').checked;
  const members = state.members.filter(m => showOff || m.is_active);
  const off = state.members.length - state.members.filter(m => m.is_active).length;
  $('show-off').parentNode.hidden = off === 0;
  if (!seesAll()) {
    $('roster').innerHTML = members.length ? table(members)
      : `<div class="dt"><div class="dt-empty muted">${state.members.length
          ? 'Everyone on the roster is deactivated.' : 'No team members yet.'}</div></div>`;
    return;
  }
  // Admin and exec: one group per manager (every active one, members or not),
  // with the channels mapped to them; the admin changes that mapping here.
  const groups = new Map(state.managers.map(m => [m.id, { name: m.name, ms: [] }]));
  members.forEach(m => {
    if (!groups.has(m.manager_id)) {
      groups.set(m.manager_id, { name: m.manager_name || `Manager ${m.manager_id}`, ms: [] });
    }
    groups.get(m.manager_id).ms.push(m);
  });
  if (!groups.size) {
    $('roster').innerHTML = '<div class="dt"><div class="dt-empty muted">No managers yet.</div></div>';
    return;
  }
  $('roster').innerHTML = Array.from(groups, ([id, g]) => {
    const chs = managedBy(id).map(c => chLabel(c.id, c.name));
    return `<div class="group">
      <div class="group-head"><span>${esc(g.name)}</span><span class="n">${g.ms.length}</span>
        <span class="mgr-chs">${chs.length ? esc(chs.join(', ')) : 'No channels'}</span>
        <span class="rule"></span>${isAdmin() && state.managers.some(m => m.id === id)
          ? `<button data-act="mgr-channels" data-id="${id}">Channels</button>` : ''}</div>
      ${g.ms.length ? table(g.ms) : '<div class="dt"><div class="dt-empty muted">No members yet.</div></div>'}
    </div>`;
  }).join('');
}

async function load() {
  try {
    const [meR, listR, asR] = await Promise.all(
      [fetch('/session/me'), fetch('/team/members'), fetch('/team/assignments')]);
    if (!listR.ok) throw new Error(listR.statusText);
    me = meR.ok ? await meR.json() : null;
    state = await listR.json();
    assign = asR.ok ? await asR.json() : { channels: [], assignments: [] };
    buildLabels(assign.channels);
    paintAddForm();
    paintRoster();
  } catch (err) {
    $('roster').innerHTML = '<em class="muted">Could not load the roster.</em>';
  }
}

// ── Channel picker ────────────────────────────────────────────────────
// A checklist of channels in a modal; resolves to the ticked ids, or null.
function pickChannels(title, options, empty) {
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `<div class="modal pick" role="dialog" aria-modal="true" aria-labelledby="pick-title">
      <h2 id="pick-title"></h2>
      <div class="pick-list">${options.length ? options.map(o => `
        <label class="pick-row" title="${esc(o.name)}">
          <input type="checkbox" value="${esc(o.id)}"${o.checked ? ' checked' : ''} />
          <span>${esc(o.label)}</span>
          ${o.note ? `<span class="note${o.move ? ' move' : ''}">${esc(o.note)}</span>` : ''}
        </label>`).join('') : `<div class="pick-empty">${esc(empty)}</div>`}</div>
      <div class="modal-actions">
        <button class="btn modal-cancel">Cancel</button>
        <button class="btn btn-primary modal-ok"${options.length ? '' : ' disabled'}>Save</button>
      </div></div>`;
    back.querySelector('#pick-title').textContent = title;
    const close = (val) => { back.remove(); document.removeEventListener('keydown', onKey); resolve(val); };
    back.querySelector('.modal-cancel').onclick = () => close(null);
    back.querySelector('.modal-ok').onclick = () => close(
      Array.from(back.querySelectorAll('input:checked'), i => i.value));
    back.onclick = (e) => { if (e.target === back) close(null); };
    function onKey(e) { if (e.key === 'Escape') close(null); }
    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
    (back.querySelector('input') || back.querySelector('.modal-cancel')).focus();
  });
}

const byLabel = (a, b) => a.label.localeCompare(b.label);

// ── Targets ───────────────────────────────────────────────────────────
// Each member's daily target per ISO weekday (1 = Monday), Shorts and
// long-form apart. Managers set their own members', the admin anyone's.
const canSetTargets = () => me && me.role !== 'exec';
const WEEK = [[1, 'Mon'], [2, 'Tue'], [3, 'Wed'], [4, 'Thu'], [5, 'Fri'], [6, 'Sat'], [7, 'Sun']];

function editTargets(member) {
  const t = member.targets || {};
  const val = (d, k) => (t[d] && t[d][k]) || '';
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `<div class="modal tgt" role="dialog" aria-modal="true" aria-labelledby="tgt-title">
      <h2 id="tgt-title"></h2>
      <div class="tgt-grid"><span></span><span class="hd">Shorts</span><span class="hd">Long-form</span>
        ${WEEK.map(([d, w]) => `<span class="wk">${w}</span>
          <input type="number" min="0" max="500" inputmode="numeric" data-d="${d}" data-k="shorts"
                 value="${val(d, 'shorts')}" placeholder="0" aria-label="${w} Shorts" />
          <input type="number" min="0" max="500" inputmode="numeric" data-d="${d}" data-k="long_form"
                 value="${val(d, 'long_form')}" placeholder="0" aria-label="${w} long-form" />`).join('')}
      </div>
      <button type="button" class="btn-link copy">Copy Monday to every day</button>
      <div class="modal-actions">
        <button class="btn modal-cancel">Cancel</button>
        <button class="btn btn-primary modal-ok">Save</button>
      </div></div>`;
    back.querySelector('#tgt-title').textContent = `${member.name}'s daily targets`;
    const inputs = (d, k) => back.querySelector(`input[data-d="${d}"][data-k="${k}"]`);
    back.querySelector('.copy').onclick = () => WEEK.forEach(([d]) => ['shorts', 'long_form']
      .forEach(k => { inputs(d, k).value = inputs(1, k).value; }));
    const close = () => { back.remove(); document.removeEventListener('keydown', onKey); resolve(); };
    async function save() {
      const days = {};
      for (const [d] of WEEK) {
        const day = {};
        for (const k of ['shorts', 'long_form']) {
          const n = inputs(d, k).value.trim() === '' ? 0 : Number(inputs(d, k).value);
          if (!Number.isInteger(n) || n < 0 || n > 500) {
            toast('Targets are whole numbers from 0 to 500.', 'warn'); inputs(d, k).focus(); return;
          }
          day[k] = n;
        }
        days[d] = day;
      }
      try {
        const res = await send('PUT', `/team/members/${member.id}/targets`, { days });
        toast(res.targets ? `${member.name}'s targets saved.` : `${member.name} has no targets now.`);
        close();
        await load();
      } catch (err) {
        toast('Could not save the targets: ' + err.message, 'err');
      }
    }
    back.querySelector('.modal-cancel').onclick = close;
    back.querySelector('.modal-ok').onclick = save;
    back.onclick = (e) => { if (e.target === back) close(); };
    function onKey(e) { if (e.key === 'Escape') close(); else if (e.key === 'Enter') save(); }
    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
    inputs(1, 'shorts').focus();
  });
}

async function editMemberChannels(member) {
  const held = new Set(heldBy(member.id));
  // A manager picks from their own channels; admin and exec from the
  // member's manager's channels. Whatever the member holds is always listed,
  // so it can be taken away.
  const pool = assign.channels.filter(c =>
    held.has(c.id) || !seesAll() || c.manager_id === member.manager_id);
  const options = pool.map(c => {
    const open = assign.assignments.find(a => a.channel_id === c.id && a.ends_on == null);
    const mine = open && open.team_member_id === member.id;
    return {
      id: c.id, name: c.name || c.id, label: chLabel(c.id, c.name), checked: mine,
      note: mine ? `since ${fmtDay(open.starts_on)}`
        : open ? `held by ${open.member_name || 'another member'}` : '',
      move: !mine && !!open,
    };
  }).sort(byLabel);
  const picked = await pickChannels(`${member.name}'s channels`, options,
    seesAll() ? `No channels are mapped to ${member.manager_name || 'their manager'} yet.`
              : 'No channels are mapped to you yet; ask the admin.');
  if (!picked) return;
  const same = picked.length === held.size && picked.every(id => held.has(id));
  if (same) return;
  try {
    const res = await send('PUT', `/team/members/${member.id}/channels`, { channel_ids: picked });
    const parts = [];
    if (res.added.length) parts.push(`${res.added.length} added`);
    if (res.ended.length) parts.push(`${res.ended.length} removed`);
    toast(`${member.name}: ${parts.join(', ') || 'no change'}.`);
  } catch (err) {
    toast('Could not save the channels: ' + err.message, 'err');
  }
  await load();
}

async function editManagerChannels(managerId) {
  const manager = state.managers.find(m => m.id === managerId);
  const options = assign.channels.map(c => ({
    id: c.id, name: c.name || c.id, label: chLabel(c.id, c.name), checked: c.manager_id === managerId,
    note: c.manager_id && c.manager_id !== managerId ? `with ${c.manager_name || 'another manager'}` : '',
    move: !!c.manager_id && c.manager_id !== managerId,
  })).sort(byLabel);
  const picked = await pickChannels(`${manager.name}'s channels`, options, 'No channels yet.');
  if (!picked) return;
  const want = new Set(picked);
  const changes = assign.channels.filter(c => want.has(c.id) !== (c.manager_id === managerId));
  let failed = 0;
  for (const c of changes) {
    try {
      await send('PATCH', `/channels/${encodeURIComponent(c.id)}/manager`,
                 { manager_id: want.has(c.id) ? managerId : null });
    } catch (err) {
      failed++;
    }
  }
  if (failed) toast(`Could not save ${failed} of ${changes.length} channel${changes.length > 1 ? 's' : ''}.`, 'err');
  else if (changes.length) toast(`${manager.name}'s channels saved.`);
  await load();
}

async function patch(id, change, done) {

$('roster').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = Number(btn.dataset.id);
  const member = state.members.find(m => m.id === id);
  const act = btn.dataset.act;
  if (act === 'channels') {

  } else if (act === 'targets') {

      'credited to them stay credited.', 'Deactivate');

  } else if (act === 'reactivate') {
    await patch(id, { is_active: true }, m => `${m.name} is back on the roster.`);
  }
});

$('roster').addEventListener('keydown', (e) => {

});

// GET /team/assignments: the user's visible channels and every assignment on
// them; the roster's channel chips and pickers, and the drill-down's grouping.
let assign = { channels: [], assignments: [] };
const isAdmin = () => me && me.role === 'admin';
const fmtDay = (d) => d ? String(d).slice(0, 10) : '';

// ── Uploads grid (#151) ───────────────────────────────────────────────
// GET /team/uploads is scoped: a manager gets their own channels and members;
// admin and exec every channel, narrowed by the manager filter. Days are IST.
const MAX_DAYS = 92;
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
let upManager = '';          // admin/exec: '' = every manager
// Rows per member (who uploaded) or per channel (where); remembered per browser.
let upView = 'member';
try { if (localStorage.getItem('midas:team:upView') === 'channel') upView = 'channel'; } catch {}

function istToday() {
  // en-CA formats as YYYY-MM-DD.
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());
}

function addDays(iso, n) {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

// The date range: a preset chip, or Custom (the two date inputs).
let upRange = '7';
function setRange(range) {
  upRange = range;
  const today = istToday();
  if (range === '7' || range === '30') {
    $('up-from').value = addDays(today, -(Number(range) - 1));
    $('up-to').value = today;
  } else if (range === 'next7') {
    $('up-from').value = today;
    $('up-to').value = addDays(today, 6);
  }
  $('up-custom').hidden = range !== 'custom';
  document.querySelectorAll('#up-range .chip').forEach(c =>
    c.setAttribute('aria-pressed', String(c.dataset.range === range)));
}

function ago(iso) {
  if (!iso) return null;
  const h = (Date.now() - new Date(iso).getTime()) / 3600e3;
  if (h < 1) return 'under an hour';
  if (h < 48) return `${Math.floor(h)}h`;
  return `${Math.floor(h / 24)} days`;
}

// The routine sync runs every 6 hours; older than that is worth a look.
const isStale = (c) => !c.last_synced_at || Date.now() - new Date(c.last_synced_at) > 6 * 3600e3;

// Every channel is "Taarak Mehta Ka Ooltah Chashmah <something>": drop the
// words all the names share, and the generic ones, so the row says
// "Marathi". The full name stays in the tooltip.
const GENERIC = new Set(['baalgeet', 'balgeet', 'rhymes', 'nursery', '/', '-', '|']);
let channelLabels = new Map();
function buildLabels(channels) {
  const words = channels.map(c => (c.name || c.id).split(/\s+/));
  let n = 0;
  if (words.length > 1) {
    while (words.every(w => w.length > n + 1 && w[n].toLowerCase() === words[0][n].toLowerCase())) n++;
  }
  channelLabels = new Map(channels.map((c, i) => {
    const rest = words[i].slice(n);
    const core = rest.filter(w => !GENERIC.has(w.toLowerCase()));
    return [c.id, (core.length ? core : rest).join(' ') || c.name || c.id];
  }));
}
const chLabel = (id, fallback) => channelLabels.get(id) || fallback || id;

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dayParts = (iso) => {
  const d = new Date(iso + 'T00:00:00Z');
  return { dow: DOW[d.getUTCDay()], day: d.getUTCDate(), mon: MONTHS[d.getUTCMonth()] };
};
function fmtRange(from, to) {
  const a = dayParts(from), b = dayParts(to);
  if (from === to) return `${a.dow} ${a.day} ${a.mon}`;
  return a.mon === b.mon ? `${a.day}–${b.day} ${b.mon}` : `${a.day} ${a.mon} – ${b.day} ${b.mon}`;
}

// A day's target for a row: { shorts, long_form } or null.
const isoWeekday = (iso) => new Date(iso + 'T00:00:00Z').getUTCDay() || 7;
const targetOn = (targets, d) => {
  const t = targets && targets[String(isoWeekday(d))];
  return t && (t.shorts || t.long_form) ? t : null;
};
// How far below target a finished day is, for the count in view: the
// shortfall's share of the target (0..1), or 0 when met / no target. "All"
// misses when either type does.
function shortfall(c, t) {
  if (!t) return 0;
  const s = (c && c.shorts) || 0, l = (c && c.long_form) || 0;
  const [gap, want] = upKind === 'shorts' ? [Math.max(0, t.shorts - s), t.shorts]
    : upKind === 'long' ? [Math.max(0, t.long_form - l), t.long_form]
    : [Math.max(0, t.shorts - s) + Math.max(0, t.long_form - l), t.shorts + t.long_form];
  return want ? gap / want : 0;
}

let upKind = 'all';          // all | shorts | long
try { const k = localStorage.getItem('midas:team:upKind'); if (['shorts', 'long'].includes(k)) upKind = k; } catch {}
const count = (c) => !c ? 0 : upKind === 'shorts' ? c.shorts : upKind === 'long' ? c.long_form : c.total;
const KIND_WORD = { all: 'uploads', shorts: 'Shorts', long: 'long-form videos' };

function paintSummary(data, rows) {
  const holder = $('up-summary');
  const sum = { total: 0, shorts: 0, long_form: 0 };
  const perDay = {};
  rows.forEach(r => {
    ['total', 'shorts', 'long_form'].forEach(k => { sum[k] += r.total[k]; });
    data.days.forEach(d => { perDay[d] = (perDay[d] || 0) + count(r.days[d]); });
  });
  const today = istToday();
  // Whole days only: today is still filling up.
  const past = data.days.filter(d => d < today);
  const busiest = past.reduce((a, d) => (perDay[d] > (perDay[a] ?? -1) ? d : a), null);
  const idle = (data.channel_rows || []).filter(r => !r.total.total);
  const stale = data.channels.filter(isStale);
  const synced = data.channels.filter(c => c.last_synced_at);
  const oldest = synced.length
    ? synced.reduce((a, b) => (a.last_synced_at < b.last_synced_at ? a : b)) : null;
  const stat = (v, label, title = '') =>
    `<div class="up-stat"${title ? ` title="${esc(title)}"` : ''}><b>${v}</b><span>${label}</span></div>`;
  const stats = [];
  if (upKind === 'all') {
    stats.push(stat(sum.shorts, 'Shorts'), stat(sum.long_form, 'Long-form'));
  }
  if (past.length > 1) {
    const avg = past.reduce((a, d) => a + perDay[d], 0) / past.length;
    stats.push(stat(avg.toFixed(avg < 10 ? 1 : 0), 'a day on average'));
  }
  if (busiest && past.length > 1) {
    const p = dayParts(busiest);
    stats.push(stat(perDay[busiest], `busiest: ${p.dow} ${p.day} ${p.mon}`));
  }
  if (data.channel_rows) {
    stats.push(stat(`${data.channel_rows.length - idle.length}/${data.channel_rows.length}`,
      'channels posted', idle.length ? 'Nothing: ' + idle.map(r => chLabel(r.channel_id, r.name)).join(', ') : ''));
  }
  const fresh = !data.channels.length ? ''
    : stale.length
      ? `<span class="stale" title="${esc(stale.map(c => `${chLabel(c.id, c.name)}: ${
          c.last_synced_at ? 'synced ' + ago(c.last_synced_at) + ' ago' : 'never synced'}`).join('\n'))}">${
          stale.length} channel${stale.length > 1 ? 's' : ''} not synced for 6h+</span>`
      : `Synced ${esc(ago(oldest.last_synced_at))} ago`;
  holder.innerHTML = `
    <div><div><span class="big">${upKind === 'all' ? sum.total : upKind === 'shorts' ? sum.shorts : sum.long_form}</span><span class="big-u">${
      KIND_WORD[upKind]}</span></div><div class="range">${esc(fmtRange(data.from, data.to))}</div></div>
    <div class="up-stats">${stats.join('')}</div>
    <div class="fresh">${fresh}</div>`;
}

// What the hover card shows for each count in the grid, keyed by data-hv.
let hoverData = [];
function hv(c, head, extra = {}) {
  hoverData.push({ c, head, ...extra });
  return hoverData.length - 1;
}
const dayLabel = (d) => { const p = dayParts(d); return `${p.dow}, ${p.mon} ${p.day}`; };

function dayCell(c, d, max, today, open, rowName, targets) {
  const v = count(c);
  const cls = `day${d > today ? ' future' : ''}`;
  // Only a finished day can miss: today is still filling up.
  const t = d < today ? targetOn(targets, d) : null;
  const m = shortfall(c, t);
  const miss = m > 0 ? ` miss" style="--m:${m.toFixed(2)}` : '';
  if (!v) {
    if (!m) return `<td class="${cls}"><span class="nil">·</span></td>`;
    return `<td class="${cls}"><span class="hit${miss}" data-hv="${
      hv(c || { total: 0, shorts: 0, long_form: 0 }, `${rowName} · ${dayLabel(d)}`, { target: t })}">0</span></td>`;
  }
  const h = max ? (v / max).toFixed(2) : 0;
  const i = hv(c, `${rowName} · ${dayLabel(d)}`, { future: d > today, click: true, target: t });
  return `<td class="${cls}"><button type="button" class="hit${miss}" style="--h:${h}" data-hv="${i}"
      data-${open.kind}="${esc(open.id)}" data-day="${d}"
      aria-label="${c.total} videos on ${d}: ${c.shorts} Shorts, ${c.long_form} long-form. Show them">${v}</button></td>`;
}

function sumCell(c, rowName) {
  const v = count(c);
  if (!c.total) return `<td class="sum"><b>${v}</b></td>`;
  return `<td class="sum" data-hv="${hv(c, `${rowName} · ${fmtRange(upShown.from, upShown.to)}`)}"><b>${v}</b></td>`;
}

function hoverCard(i) {
  const { c, head, future, click, target } = hoverData[i];
  const pct = (n) => c.total ? Math.round(100 * n / c.total) + '%' : '';
  return `<div class="hc-head">${esc(head)}</div>
    <div class="hc-total">${c.total}<small>video${c.total === 1 ? '' : 's'}${future ? ' scheduled' : ''}</small></div>
    <div class="hc-bar"><i class="hc-shorts" style="width:${pct(c.shorts) || 0}"></i><i class="hc-long" style="width:${pct(c.long_form) || 0}"></i></div>
    <div class="hc-row"><span class="sw hc-shorts"></span>Shorts<b>${c.shorts}</b><span class="pct">${pct(c.shorts)}</span></div>
    <div class="hc-row"><span class="sw hc-long"></span>Long-form<b>${c.long_form}</b><span class="pct">${pct(c.long_form)}</span></div>
    ${target ? targetLine(c, target) : ''}
    ${future ? '<div class="hc-foot">Not live yet: goes live on this day.</div>'
      : click ? '<div class="hc-foot">Click to see the videos</div>' : ''}`;
}

function targetLine(c, t) {
  const part = (got, want, word) => {
    if (!want) return '';
    return got >= want ? `<span class="met">${got}/${want} ${word}</span>`
      : `<b>${got}/${want} ${word}</b>`;
  };
  const parts = [part(c.shorts, t.shorts, 'Shorts'), part(c.long_form, t.long_form, 'long-form')]
    .filter(Boolean);
  return `<div class="hc-target">Target: ${parts.join(' · ')}</div>`;
}

(function wireHoverCard() {
  const card = $('hovercard');
  let on = null;
  const hide = () => { on = null; card.classList.remove('on'); card.setAttribute('aria-hidden', 'true'); };
  const show = (el) => {
    if (on === el) return;
    on = el;
    card.innerHTML = hoverCard(Number(el.dataset.hv));
    const r = el.getBoundingClientRect();
    const w = card.offsetWidth, h = card.offsetHeight;
    let left = r.left + r.width / 2 - w / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
    // Above the cell, or below it when there is no room.
    const top = r.top - h - 8 >= 8 ? r.top - h - 8 : r.bottom + 8;
    card.style.left = left + 'px';
    card.style.top = top + 'px';
    card.classList.add('on');
    card.setAttribute('aria-hidden', 'false');
  };
  const grid = $('up-grid');
  grid.addEventListener('mouseover', (e) => { const el = e.target.closest('[data-hv]'); if (el) show(el); else hide(); });
  grid.addEventListener('mouseleave', hide);
  grid.addEventListener('focusin', (e) => { const el = e.target.closest('[data-hv]'); if (el) show(el); });
  grid.addEventListener('focusout', hide);
  window.addEventListener('scroll', hide, true);
})();

function paintGrid(data) {
  upShown = data;
  if (!data.channels.length) {
    $('up-summary').innerHTML = '';
    $('up-grid').innerHTML = `<div class="dt"><div class="dt-empty muted">${seesAll()
      ? 'No channels for this filter.' : 'No channels are mapped to you yet; ask the admin.'}</div></div>`;
    return;
  }
  // The full visible set, so the roster, grid and drill-down share labels.
  buildLabels(assign.channels.length ? assign.channels : data.channels);
  hoverData = [];
  $('hovercard').classList.remove('on');
  const showMgr = seesAll() && !data.manager_id;
  const byChannel = upView === 'channel';
  const today = istToday();
  const staleIds = new Set(data.channels.filter(isStale).map(c => c.id));
  const rows = byChannel
    ? (data.channel_rows || []).map(r => ({
        r, open: { kind: 'channel', id: r.channel_id }, label: chLabel(r.channel_id, r.name),
        cls: r.total.total ? '' : 'idle',
        name: `<span class="label" title="${esc(r.name || r.channel_id)}">${esc(chLabel(r.channel_id, r.name))}</span>${
          staleIds.has(r.channel_id) ? '<span class="warn-dot" title="Not synced for 6h+: recent uploads may be missing"></span>' : ''}${
          showMgr ? `<span class="sub">${esc(r.manager_name || 'No manager')}</span>` : ''}`,
      }))
    : data.rows
        // Unassigned with nothing in it is noise; show it only when it counts something.
        .filter(r => r.member_id != null || r.total.total)
        .map(r => ({
          r, open: { kind: 'member', id: r.member_id ?? '' }, label: r.name, targets: r.targets,
          cls: `${r.member_id == null ? 'unassigned' : ''}${r.is_active ? '' : ' off'}${r.total.total ? '' : ' idle'}`,
          name: `<span class="label">${esc(r.name)}</span>${r.is_active ? '' : ' <span class="tag tag--off">Deactivated</span>'}${
            showMgr && r.manager_name ? `<span class="sub">${esc(r.manager_name)}</span>` : ''}`,
        }));
  const sumRows = byChannel ? (data.channel_rows || []) : data.rows;
  paintSummary(data, sumRows);

  let max = 0;
  rows.forEach(({ r }) => data.days.forEach(d => { max = Math.max(max, count(r.days[d])); }));
  const head = data.days.map(d => {
    const p = dayParts(d);
    const cls = d === today ? 'today' : d > today ? 'future' : '';
    return `<th scope="col" class="${cls}"${d === today ? ' title="Today"' : ''}><span class="d">${p.mon} ${p.day}</span><span class="w">${p.dow}</span></th>`;
  }).join('');
  const add = (cs) => cs.reduce((a, c) => ({ total: a.total + (c?.total || 0),
    shorts: a.shorts + (c?.shorts || 0), long_form: a.long_form + (c?.long_form || 0) }),
    { total: 0, shorts: 0, long_form: 0 });
  const foot = data.days.map(d => {
    const c = add(sumRows.map(r => r.days[d]));
    const v = count(c);
    return v ? `<td class="day" data-hv="${hv(c, `All · ${dayLabel(d)}`, { future: d > today })}">${v}</td>`
      : '<td class="day"><span class="nil">·</span></td>';
  }).join('');
  const all = add(sumRows.map(r => r.total));
  const grand = count(all);
  const hasFuture = data.days.some(d => d > today);
  const hasTargets = !byChannel && rows.some(({ targets }) => targets);
  $('up-grid').innerHTML = `<div class="grid-wrap"><table class="up">
      <thead><tr><th scope="col" class="name">${byChannel ? 'Channel' : 'Member'}</th>${head}<th scope="col" class="sum">Total</th></tr></thead>
      <tbody>${rows.map(({ r, open, cls, name, label, targets }) => `<tr class="${cls}"><td class="name">${name}</td>${
        data.days.map(d => dayCell(r.days[d], d, max, today, open, label, targets)).join('')}${sumCell(r.total, label)}</tr>`).join('')}</tbody>
      <tfoot><tr><td class="name">All</td>${foot}<td class="sum"${all.total
        ? ` data-hv="${hv(all, `All · ${fmtRange(data.from, data.to)}`)}"` : ''}><b>${grand}</b></td></tr></tfoot>
    </table></div>
    <div class="up-legend"><span><span class="sw" style="background:color-mix(in srgb, var(--color-accent) 48%, transparent)"></span>Darker = more ${
      KIND_WORD[upKind]}</span>${hasFuture ? `<span><span class="sw" style="background:repeating-linear-gradient(135deg, transparent 0 3px, var(--surface-tint) 3px 6px)"></span>Hatched = scheduled, not live yet</span>` : ''}${
      hasTargets ? '<span><span class="sw" style="background:color-mix(in srgb, var(--color-err) 50%, transparent)"></span>Red = below target (darker = further off)</span>' : ''}${
      byChannel && staleIds.size ? '<span><span class="sw" style="background:var(--color-warn);border-radius:50%"></span>Not synced for 6h+</span>' : ''}<span>Hover for the Shorts / long-form split, click for the videos</span></div>`;
}

// ── Drill-down (#152) ─────────────────────────────────────────────────
// GET /team/uploads/videos lists the videos behind a cell, credited by the
// same rule as the grid; the grid's manager filter goes with it so the
// Unassigned list matches its cell.
let upShown = null;          // the grid last painted

function drillCard(v) {
  const href = `https://www.youtube.com/watch?v=${encodeURIComponent(v.video_id)}`;
  const thumb = v.thumbnail_url ? `<img src="${esc(v.thumbnail_url)}" loading="lazy" alt="" />` : '';
  const type = v.is_short === true ? 'Short' : v.is_short === false ? 'Long-form' : '?';
  return `<a class="card-v" href="${href}" target="_blank" rel="noopener" title="${esc(v.title || v.video_id)}">
    <div class="th">${thumb}<span class="badge">${type}</span>${
      v.status === 'scheduled' ? '<span class="badge sched">Scheduled</span>' : ''}</div>
    <div class="t">${esc(v.title || v.video_id)}</div></a>`;
}

function drillModal() {
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `<div class="modal drill" role="dialog" aria-modal="true" aria-labelledby="drill-title">
    <div class="drill-head"><h2 id="drill-title"></h2><div class="sub"></div></div>
    <div class="drill-list"><div class="skel" data-skeleton data-rows="3"></div></div>
    <div class="modal-actions"><button class="btn modal-cancel">Close</button></div></div>`;
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
  function onKey(e) { if (e.key === 'Escape') close(); }
  back.querySelector('.modal-cancel').onclick = close;
  back.addEventListener('click', (e) => { if (e.target === back) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(back);
  back.querySelector('.modal-cancel').focus();
  return back;
}

async function openDrill({ member, channel }, day) {
  const row = channel != null
    ? (upShown?.channel_rows || []).find(r => r.channel_id === channel)
    : (upShown?.rows || []).find(r => String(r.member_id ?? '') === member);
  const back = drillModal();
  const p = dayParts(day);
  const rowName = !row ? 'Uploads' : channel != null ? chLabel(row.channel_id, row.name) : row.name;
  back.querySelector('#drill-title').textContent = `${rowName} · ${p.dow} ${p.day} ${p.mon}`;
  const q = new URLSearchParams({ day });
  if (channel != null) q.set('channel_id', channel);
  else if (member) q.set('member_id', member);
  if (seesAll() && upShown?.manager_id) q.set('manager_id', upShown.manager_id);
  const list = back.querySelector('.drill-list');
  try {
    const r = await fetch('/team/uploads/videos?' + q);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || r.statusText);
    const shorts = j.videos.filter(v => v.is_short === true).length;
    const c = { total: j.videos.length, shorts, long_form: j.videos.length - shorts };
    const t = channel == null && row && day < istToday() ? targetOn(row.targets, day) : null;
    const tgt = (got, want, word) => !want ? ''
      : ` · <span class="${got >= want ? 'met' : 'short'}">${got}/${want} ${word}</span>`;
    back.querySelector('.sub').innerHTML = `${c.total} video${c.total === 1 ? '' : 's'} · ${
      shorts} Shorts / ${c.long_form} long-form${t ? ' · target' + tgt(c.shorts, t.shorts, 'Shorts')
        + tgt(c.long_form, t.long_form, 'long-form') : ''}`;
    list.innerHTML = drillGroups(j.videos, channel == null && member ? Number(member) : null, day);
  } catch (err) {
    list.innerHTML = `<em class="muted">Could not load the videos: ${esc(err.message)}</em>`;
  }
}

// The videos as a card grid per channel. For a member, the channels they
// held that day with nothing in it are named in one line underneath.
function drillGroups(videos, memberId, day) {
  const groups = new Map();
  videos.forEach(v => {
    if (!groups.has(v.channel_id)) groups.set(v.channel_id, { name: v.channel_name, videos: [] });
    groups.get(v.channel_id).videos.push(v);
  });
  const quiet = memberId == null ? [] : assign.assignments
    .filter(a => a.team_member_id === memberId && String(a.starts_on) <= day
                 && (a.ends_on == null || day < String(a.ends_on)) && !groups.has(a.channel_id))
    .map(a => chLabel(a.channel_id, (assign.channels.find(c => c.id === a.channel_id) || {}).name))
    .sort();
  const named = Array.from(groups, ([id, g]) => ({ label: chLabel(id, g.name), videos: g.videos }))
    .sort((a, b) => a.label.localeCompare(b.label));
  const html = named.map(g => {
    const shorts = g.videos.filter(v => v.is_short === true).length;
    const long = g.videos.length - shorts;
    const n = [shorts && `${shorts} Short${shorts > 1 ? 's' : ''}`, long && `${long} long-form`]
      .filter(Boolean).join(' · ');
    return `<div class="drill-group"><h3>${esc(g.label)}<span class="n">${n}</span></h3>
      <div class="cards">${g.videos.map(drillCard).join('')}</div></div>`;
  }).join('');
  return (html || '<em class="muted">No uploads.</em>')
    + (quiet.length ? `<div class="drill-quiet">Nothing from ${esc(quiet.join(', '))}</div>` : '');
}

$('up-grid').addEventListener('click', (e) => {
  const b = e.target.closest('button.hit');
  if (b) openDrill({ member: b.dataset.member, channel: b.dataset.channel }, b.dataset.day);
});

function paintView() {
  document.querySelectorAll('#up-view .chip').forEach(c =>
    c.setAttribute('aria-pressed', String(c.dataset.view === upView)));
}
$('up-view').addEventListener('click', (e) => {
  const c = e.target.closest('.chip');
  if (!c || c.dataset.view === upView) return;
  upView = c.dataset.view;
  try { localStorage.setItem('midas:team:upView', upView); } catch {}
  paintView();
  if (upShown) paintGrid(upShown);
});
paintView();

function paintManagerFilter(managers) {
  const holder = $('up-manager');
  if (!seesAll()) { holder.hidden = true; return; }
  const opts = [{ value: '', label: 'All managers' }]
    .concat(managers.map(m => ({ value: String(m.id), label: m.name })));
  holder.hidden = false;
  holder.innerHTML = '';
  holder.dataset.dropdown = '';
  holder.dataset.label = 'Manager';
  holder.dataset.value = upManager;
  holder.dataset.options = JSON.stringify(opts);
  delete holder.dataset.cmpWired;
  Components.init(holder.parentNode);
}

async function loadUploads() {
  const from = $('up-from').value, to = $('up-to').value;
  if (!from || !to) return;
  if (to < from) { toast('"To" is before "From".', 'warn'); return; }
  if ((new Date(to) - new Date(from)) / 864e5 + 1 > MAX_DAYS) {
    toast(`Pick at most ${MAX_DAYS} days.`, 'warn'); return;
  }
  const q = new URLSearchParams({ from, to });
  if (seesAll() && upManager) q.set('manager_id', upManager);
  try {
    const r = await fetch('/team/uploads?' + q);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || r.statusText);
    paintManagerFilter(j.managers || []);
    paintGrid(j);
  } catch (err) {
    $('up-grid').innerHTML = `<em class="muted">Could not load the uploads: ${esc(err.message)}</em>`;
  }
}

$('up-range').addEventListener('click', (e) => {
  const c = e.target.closest('.chip');
  if (!c) return;
  setRange(c.dataset.range);
  if (c.dataset.range === 'custom') $('up-from').focus();
  else loadUploads();
});
['up-from', 'up-to'].forEach(id => $(id).addEventListener('change', () => {
  if (upRange === 'custom') loadUploads();
}));
function paintKind() {
  document.querySelectorAll('#up-kind .chip').forEach(c =>
    c.setAttribute('aria-pressed', String(c.dataset.kind === upKind)));
}
$('up-kind').addEventListener('click', (e) => {
  const c = e.target.closest('.chip');
  if (!c || c.dataset.kind === upKind) return;
  upKind = c.dataset.kind;
  try { localStorage.setItem('midas:team:upKind', upKind); } catch {}
  paintKind();
  if (upShown) paintGrid(upShown);
});
paintKind();
$('up-manager').addEventListener('change', (e) => {
  if (e.detail && 'value' in e.detail) { upManager = e.detail.value; loadUploads(); }
});

setRange('7');
load().then(() => { if (PAGE === 'uploads') loadUploads(); });
</script>
