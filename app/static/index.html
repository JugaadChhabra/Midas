<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Midas · Running</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/static/theme.css" />
<style>
  /* The shell owns page layout (see .app-shell in theme.css); body just
     provides the backdrop the inset content panel sits on. */
  body { margin:0; background:var(--surface-faint); }
  button, .btn { padding:.5rem .9rem; }
  .btn-sm { padding:.25rem .55rem; font-size:.78rem; }

  /* Attention banner — only when something needs saying at the very top. */
  .attention { border:1px solid var(--color-warn-border); background:var(--color-warn-bg);
               color:var(--color-warn); border-radius:var(--radius); padding:.7rem 1rem;
               margin:0 0 1.2rem; font-size:.9rem; }
</style>
</head>
<body>
  <div class="app-shell" id="app-shell">
  <main class="app-main">
    <header class="page-head">
      <h1 class="page-title" id="run-checked">Running</h1>
    </header>

    <p class="page-lede" id="run-lede">Checking…</p>
    <p class="page-meta" id="run-meta"></p>

    <div id="attention" class="attention" role="alert" hidden></div>

    <div class="quota" id="quota" aria-live="polite"></div>

    <div id="groups" aria-live="polite">
      <div class="skel" data-skeleton data-rows="6"></div>
    </div>
  </main>
  </div>

  <div id="toasts" aria-live="assertive" role="alert"></div>

<script src="/static/swr.js"></script>
<script src="/static/components.js"></script>
<script src="/static/sidebar.js"></script>
<script src="/static/running.js"></script>
<script>
const $ = (id) => document.getElementById(id);

// The rail is the same on every screen, including here. The four channel
// sections stay put and point into whichever channel you last had open, so
// getting from the board into a specific section is one click rather than
// "open the channel, then find the section". They are hrefs, not panels,
// because on this page they lead somewhere else.
//
// Mounted with placeholders; setChannels fills in the divider label and
// re-points the links once /dashboard tells us which channels exist.
let railChannel = Sidebar.lastChannel();
Sidebar.mount({
  items: [{ id: 'running', label: 'Running', icon: 'home', href: '/' }]
    .concat([{ section: '' }])
    .concat(Sidebar.CHANNEL_ITEMS.map(it => ({ ...it, href: railHref(it.id) }))),
  activeId: 'running',
});

function railHref(section) {
  return railChannel
    ? `/channel?id=${encodeURIComponent(railChannel)}#${section}`
    : '/';
}

// Re-point the channel links once we know the channels. Until a channel has
// been opened there is nothing to point at, so the items stay but lead to the
// first channel rather than dead-ending.
function pointRailAt(channels) {
  if (!railChannel || !channels.some(c => c.id === railChannel)) {
    railChannel = (channels[0] || {}).id || '';
  }
  document.querySelectorAll('.sidebar-nav a.snav').forEach(a => {
    const id = a.dataset.tab;
    if (id !== 'running') a.setAttribute('href', railHref(id));
  });
  return railChannel;
}

function toast(msg, kind = 'ok', timeout = 3200) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = 0; el.style.transition = '.3s';
                     setTimeout(() => el.remove(), 300); }, timeout);
}

const els = {
  lede: $('run-lede'), meta: $('run-meta'),
  groups: $('groups'), quota: $('quota'),
};

function paint(payload) {
  Running.render(payload, els);
  const pointed = pointRailAt(payload.channels || []);
  const now = new Date();
  $('run-checked').textContent = 'Checked ' + now.toLocaleTimeString([],
    { hour: '2-digit', minute: '2-digit' }) + ' · ' + now.toLocaleDateString([],
    { day: 'numeric', month: 'short' });
  Sidebar.setChannels(payload.channels, pointed, { open: false });

  const paused = (payload.health || {}).autopilot_paused || 0;
  const banner = $('attention');
  banner.hidden = paused === 0;
  if (paused) {
    banner.textContent = `${paused} channel${paused > 1 ? 's' : ''} stopped on their own — `
      + 'open one to see why and start it again.';
  }
}

// Stale-while-revalidate: paint the last board instantly, then refresh behind
// it. The 30s poll below reuses this, so each tick is a quiet repaint rather
// than a blank reload.
function load() {
  SWR.swr('/dashboard', paint, {
    onError: () => {
      if (SWR.get('/dashboard') === undefined) {
        els.groups.innerHTML =
          '<em class="muted">Could not reach Midas. Is the server running?</em>';
      }
    },
  });
}

// Row actions live here, not in running.js — the board decides what a state
// means, the page decides what to do about it.
document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-run-action]');
  if (!act) return;
  e.preventDefault();          // the row is a link; the button inside it isn't
  e.stopPropagation();
  const { runAction, channel } = act.dataset;
  if (runAction === 'Update') {
    toast('Fetching the latest from YouTube…');
    fetch(`/channels/${encodeURIComponent(channel)}/sync`, { method: 'POST' })
      .then(r => r.json())
      .then(j => { toast(`${j.synced ?? 0} new videos.`, 'ok'); SWR.invalidate('/dashboard'); load(); })
      .catch(() => toast('Could not fetch from YouTube.', 'err'));
  } else if (runAction === 'Try again') {
    return;   // gated by hold — see the confirm listener below
  } else {
    // Starting and resuming change what the machine does on its own, so they
    // happen on the channel page where the reason it stopped is in view.
    location.href = `/channel?id=${encodeURIComponent(channel)}#autopilot`;
  }
});

// Trying the bad ones again writes nothing to YouTube, but it calls the model
// once per video and runs to completion before answering — hence the hold, and
// hence the clock on the button while it works.
document.addEventListener('confirm', async (e) => {
  const btn = e.target.closest('[data-run-action="Try again"]');
  if (!btn) return;
  const channel = btn.dataset.channel;
  Components.busy(btn, 'Rewriting');
  try {
    const r = await fetch(`/channels/${encodeURIComponent(channel)}/audits/reaudit-quarantined`,
                          { method: 'POST' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || 'failed');
    toast(`${j.reaudited} rewritten again, ${j.skipped} skipped, ${j.failed} failed `
        + `(of ${j.total_quarantined}).`, j.failed ? 'warn' : 'ok');
    SWR.invalidate('/dashboard');
    load();
  } catch (err) {
    Components.done(btn);
    toast('Could not start them again: ' + err, 'err');
  }
});

load();

// Poll only while the tab is visible — a backgrounded board otherwise keeps
// triggering full scans on the server for nobody.
let timer = null;
const startPolling = () => { if (!timer) timer = setInterval(load, 30000); };
const stopPolling = () => { clearInterval(timer); timer = null; };
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopPolling();
  else { load(); startPolling(); }
});
if (!document.hidden) startPolling();
</script>
</body>
</html>
