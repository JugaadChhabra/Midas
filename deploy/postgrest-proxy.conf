# supabase-py builds its REST URL as "{SUPABASE_URL}/rest/v1" — that prefix is
# hardcoded in the client. Bare PostgREST serves at "/", so without this the app
# would 404 against every table.
#
# Stripping the prefix here rather than special-casing app/db.py keeps the URL
# shape identical to hosted Supabase, so the same client code works against
# either with only an env var changed.
server {
    listen 80;
    server_name _;

    # app/rows.py batches 500 video ids into one `in_()` filter, which is a URL
    # of ~10 KB. nginx's default request-line/header buffer is 8 KB, so those
    # reads came back as "414 Request-URI Too Large" and PostgREST's reply to
    # them as "upstream sent too big header" -> 502. Hosted Supabase (Kong)
    # allowed them, so this is purely a proxy default to match, not an app
    # limit; embeddings and orphan-cluster reads fail without it.
    client_header_buffer_size    64k;
    large_client_header_buffers  4 64k;

    location /rest/v1/ {
        proxy_pass http://postgrest:3000/;
        proxy_buffer_size   64k;
        proxy_buffers       8 64k;
        proxy_busy_buffers_size 128k;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header apikey            $http_apikey;
        proxy_set_header Accept-Profile    $http_accept_profile;
        proxy_set_header Content-Profile   $http_content_profile;
        proxy_set_header Prefer            $http_prefer;
        proxy_set_header Range             $http_range;
        proxy_set_header Range-Unit        $http_range_unit;
        # PostgREST returns the row count in Content-Range; the client reads it.
        proxy_pass_request_headers on;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
