services:
  db:
    image: pgvector/pgvector:pg16
    container_name: midas-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-midas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-midas}
    volumes:
      - ./pgdata:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:55432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-midas} -d ${POSTGRES_DB:-midas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Phoenix (LLM + evidence-loop tracing) ────────────────────────────────
  # Its own database in the same cluster, NOT its own volume. Two reasons:
  # app/backup.py runs pg_dump against a single DSN rather than pg_dumpall, so
  # a separate database keeps trace data out of the NAS snapshot by
  # construction — traces are telemetry, losing them is not a DR event, and
  # they must not bloat the snapshot CLAUDE.md is built around. And a bind
  # mount whose source is missing on the office machine silently becomes a
  # directory, which is a failure mode this deployment has already hit once.
  phoenix:
    # Pinned, like postgrest and pgvector above. `version-20.3.0` was the
    # latest published tag on 2026-08-23; verify it still exists before
    # deploying and bump deliberately, never track `latest`.
    image: arizephoenix/phoenix:version-20.3.0
    container_name: midas-phoenix
    depends_on:
      db:
        condition: service_healthy
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://${POSTGRES_USER:-midas}:${POSTGRES_PASSWORD}@db:5432/phoenix
      # No Prometheus exporter: nothing scrapes it, and it would open a second
      # port on a box that publishes everything on loopback only.
      #
      # There is deliberately NO retention cap here. Phoenix does not prune by
      # default and this disk is shared with the operational database — see
      # docs/OBSERVABILITY.md §Retention before adding one, and measure real
      # span volume first rather than guessing a number.
      PHOENIX_ENABLE_PROMETHEUS: "false"
    ports:
      # Loopback only, like every other service here. 6006 is the UI and the
      # OTLP/HTTP collector; the app reaches it in-network as http://phoenix:6006.
      - "127.0.0.1:6006:6006"
    restart: unless-stopped

  # ── PostgREST (the API the app actually speaks) ──────────────────────────
  # Every one of the app's ~190 call sites uses the postgrest fluent builder
  # (`supabase().table(...).select(...)`), not SQL. Postgres alone is not
  # enough; this is what makes supabase-py work unchanged against a local DB.
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: midas-postgrest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgresql://${POSTGRES_USER:-midas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-midas}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?set PGRST_JWT_SECRET in .env}
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_POOL: 12
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  # supabase-py hardcodes a /rest/v1 prefix that bare PostgREST does not serve.
  # This strips it, so SUPABASE_URL keeps the same shape as the hosted project
  # and no app code has to know which one it is talking to.
  rest:
    image: nginx:alpine
    container_name: midas-rest
    depends_on:
      - postgrest
    volumes:
      - ./deploy/postgrest-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8001:80"
    restart: unless-stopped

  midas:
    image: ghcr.io/jugaadchhabra/midas:latest
    pull_policy: always
    container_name: midas
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CLIENT_SECRETS_FILE: /app/client_secret.json
      KEYFRAMES_LOCAL_DIR: /app/storage/keyframes
      SHORTS_CACHE_DIR: /app/shorts_cache
      LOG_DIR: /app/logs
      # Point the existing supabase-py client at the local PostgREST. No app
      # code changes: it only ever needed a base URL and a JWT.
      SUPABASE_URL: http://rest
      # pg_dump target for the nightly NAS snapshot (app/backup.py).
      DATABASE_URL: postgresql://${POSTGRES_USER:-midas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-midas}
      # Bare names, resolved on the image's PATH — where the Dockerfile installed
      # postgresql-client-16 and asserted its major version at build time.
      #
      # These are overridden for the same reason as the two URLs above: .env is
      # written for the host, where these may legitimately be absolute paths to
      # that machine's install (a Mac's Homebrew prefix, say), and the container
      # inherits the whole file via env_file. An absolute host path breaks the
      # restore immediately and the nightly snapshot silently at midnight — and
      # the snapshot is the entire disaster-recovery story, so that second one
      # loses data rather than uptime.
      BACKUP_PG_DUMP: pg_dump
      RESTORE_PSQL: psql
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://phoenix:6006/v1/traces}
    volumes:
      - ./client_secret.json:/app/client_secret.json:ro
      # Host bind mounts (not named volumes) so each job's artifacts stay
      # reachable from the host. If an upload dies on a YouTube quota hit, the
      # finished vertical master sits in ./shorts_cache/<channel>/tmp and the
      # run's log lands in ./logs — both survive a container prune.
      - ./storage:/app/storage
      - ./shorts_cache:/app/shorts_cache
      - ./logs:/app/logs
      - ./backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5.0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # The bgutil-provider PO-token sidecar was removed with the retired YouTube-URL
  # shorts download flow (yt-dlp). Shorts now come from the NAS source, which needs
  # no PO tokens. To revive: restore this service, the `depends_on` gate above, the
  # BGUTIL_POT_HTTP_BASE_URL env, and the yt-dlp/Deno/bgutil deps in the image.
